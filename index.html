      '<td class="num">' + (r.bonus ? money(r.bonus) + '<div class="muted" style="font-size:12px">' + esc(r.bonusPeriod) + '</div>'
          : '<span class="muted">—</span>') + '</td>' +
      '<td class="num">' + (r.bonus && prev ? (r.bonus / prev.ctc * 100).toFixed(1) + '%' : '<span class="muted">—</span>') + '</td></tr>';
  }).join("");
  var years = Math.max(1, rows.length - 1);
  var cagr = Math.pow(last.ctc / first.ctc, 1 / years) - 1;
  return '<div class="card"><h2>CTC history</h2>' +
    '<p class="cap">Annual cost to company from each year\'s compensation letter. CTC is more than the gross on a ' +
      'payslip: it also counts the employer\'s PF and other costs. The bonus is the performance bonus paid with ' +
      'that revision, shown as a share of the CTC in force during the year it rewards.</p>' +
    '<div class="grid k4" style="margin-bottom:12px">' +
      '<div class="exit-box"><div class="lbl">CTC now</div><div class="v">' + money(last.ctc) + '</div>' +
        '<div class="t">from ' + esc(last.from) + '</div></div>' +
      '<div class="exit-box"><div class="lbl">Previous CTC</div><div class="v">' +
        (rows.length > 1 ? money(rows[rows.length - 2].ctc) : '—') + '</div>' +
        '<div class="t">' + (rows.length > 1 ? 'from ' + esc(rows[rows.length - 2].from) : '') + '</div></div>' +
      '<div class="exit-box"><div class="lbl">Latest rise</div><div class="v">' +
        (rows.length > 1 ? pctLabel(last.ctc / rows[rows.length - 2].ctc - 1) : '—') + '</div>' +
        '<div class="t">' + (rows.length > 1 ? '+' + money(last.ctc - rows[rows.length - 2].ctc) + ' a year' : '') + '</div></div>' +
      '<div class="exit-box"><div class="lbl">Growth since ' + esc(first.from) + '</div><div class="v">' +
        pctLabel(last.ctc / first.ctc - 1) + '</div>' +
        '<div class="t">about ' + (cagr * 100).toFixed(1) + '% a year</div></div>' +
    '</div>' +
    '<div class="tbl-scroll"><table><thead><tr><th>From</th><th class="num">Annual CTC</th><th class="num">Rise</th>' +
      '<th class="num">Performance bonus</th><th class="num">Bonus % of CTC</th></tr></thead><tbody>' + body +
    '</tbody></table></div></div>';
}

/* Tax deducted from salary, one row per financial year (Apr-Mar), from the
   payslips; where a Form 16 is on file its full-year figures sit alongside, so a
   year with missing slips shows the gap. Bonuses paid outside the payslip had
   their own tax taken, which no payslip shows. */
function salaryTaxByYear(styles, meta) {
  var slips = DATA.salary || [];
  if (!slips.length) return "";
  var f16 = DATA.salaryForm16 || [], extra = DATA.salaryExtraBonus || [];
  var by = {};
  slips.forEach(function (p) {
    var y = +p.m.slice(0, 4), mo = +p.m.slice(5, 7), y0 = mo >= 4 ? y : y - 1;
    var r = by[y0] = by[y0] || { y0: y0, n: 0, gross: 0, tax: 0, bonus: 0, firms: [] };
    r.n++; r.gross += p.gross || 0; r.tax += p.tax || 0; r.bonus += p.bonus || 0;
    var sh = employerStyle(p.company, styles, meta).short;
    if (r.firms.indexOf(sh) < 0) r.firms.push(sh);
  });
  // a year known only from its Form 16 (no payslips on file) still gets a row
  f16.forEach(function (f) {
    var y0 = +f.fy.slice(0, 4);
    if (!by[y0]) by[y0] = { y0: y0, n: 0, gross: 0, tax: 0, bonus: 0,
                            firms: [employerStyle(f.company, styles, meta).short] };
  });
  var outside = {};
  extra.forEach(function (b) {
    var mo = /(Jan|Feb|Mar)/.test(b.label) ? 1 : 4, y0 = mo >= 4 ? b.year : b.year - 1;
    outside[y0] = (outside[y0] || 0) + b.bonus;
  });
  var nowY = new Date().getMonth() >= 3 ? new Date().getFullYear() : new Date().getFullYear() - 1;
  var rows = Object.keys(by).map(Number).sort(function (a, b) { return b - a; }).map(function (y0) {
    var r = by[y0], fy = y0 + "-" + String(y0 + 1).slice(2);
    var forms = f16.filter(function (f) { return f.fy === fy; });
    var fG = forms.reduce(function (t, f) { return t + f.gross; }, 0);
    var fT = forms.some(function (f) { return f.tax; }) ? forms.reduce(function (t, f) { return t + (f.tax || 0); }, 0) : null;
    return '<tr><td style="white-space:nowrap"><b>FY ' + fy + '</b>' + (y0 === nowY ? ' <span class="pill">so far</span>' : '') +
        '<div class="muted" style="font-size:12px">' + esc(r.firms.join(", ")) + '</div></td>' +
      '<td class="num">' + r.n + (r.n < 12 && y0 !== nowY ? '<div class="muted" style="font-size:12px">of 12</div>' : '') + '</td>' +
      '<td class="num">' + (r.n ? money(r.gross) : '<span class="muted">no slips</span>') + (outside[y0] ? '<div class="muted" style="font-size:12px">+ ' + money(outside[y0]) +
        ' bonus off-slip</div>' : '') + '</td>' +
      '<td class="num">' + (r.n ? '<b>' + money(r.tax) + '</b>' : '<span class="muted">—</span>') + '</td>' +
      '<td class="num">' + (r.gross ? (r.tax / r.gross * 100).toFixed(1) + '%' : '—') + '</td>' +
      '<td class="num">' + (forms.length ? money(fG) + '<div class="muted" style="font-size:12px">' +
        (fT !== null ? 'tax ' + money(fT) : 'tax not stated') + '</div>' : '<span class="muted">—</span>') + '</td></tr>';
  }).join("");
  return '<div class="card"><h2>Salary tax by year</h2>' +
    '<p class="cap">Tax deducted from your pay in each financial year (April to March), from the payslips. Where a ' +
      'Form 16 is on file its full-year figures are shown too, so a year with missing payslips shows the gap. ' +
      'Bonuses paid outside the payslip had their own tax taken, which is not in these totals.</p>' +
    '<div class="tbl-scroll"><table><thead><tr><th>Year</th><th class="num">Slips</th><th class="num">Gross on slips</th>' +
      '<th class="num">Tax deducted</th><th class="num">Share of gross</th><th class="num">Form 16</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
}

/* Old vs new regime side by side, exactly as Vinod's tax calculator computed
   them in Excel (its filled copy; data.json exitTax.compare). Nothing is
   recomputed here, so the figures are the calculator's own; the caption says
   when they were calculated. */
function regimeCompareCard() {
  var c = DATA.exitTax && DATA.exitTax.compare;
  if (!c || !c.rows.length) return "";
  function get(item) { return c.rows.filter(function (r) { return r.item === item; })[0] || { old: 0, "new": 0 }; }
  var tot = get("Total tax"), due = get("Still to pay"), inc = get("Taxable income");
  var better = tot["new"] <= tot.old ? "new" : "old";
  var saving = Math.abs(tot.old - tot["new"]);
  var KEY = { "Taxable income": 1, "Total tax": 1, "Still to pay": 1 };
  var body = c.rows.map(function (r) {
    var strong = KEY[r.item];
    function v(x) { return strong ? '<b>' + money(x) + '</b>' : money(x); }
    return '<tr><td>' + (strong ? '<b>' + esc(r.item) + '</b>' : esc(r.item)) + '</td>' +
      '<td class="num">' + v(r.old) + '</td><td class="num">' + v(r["new"]) + '</td></tr>';
  }).join("");
  return '<div class="card"><h2>Old vs new regime</h2>' +
    '<p class="cap">Both regimes as your tax calculator works them out (' + esc(c.source) + '). The old regime ' +
      'allows HRA on rent paid, 80C, 80D and the savings-interest deduction; the new regime has lower slabs and a ' +
      'bigger standard deduction but almost no deductions. Re-filled whenever the calculator is refreshed.</p>' +
    '<div class="grid k4" style="margin-bottom:12px">' +
      '<div class="exit-box"><div class="lbl">Old regime</div><div class="v">' + money(tot.old) + '</div>' +
        '<div class="t">on ' + money(inc.old) + ' taxable</div></div>' +
      '<div class="exit-box"><div class="lbl">New regime</div><div class="v">' + money(tot["new"]) + '</div>' +
        '<div class="t">on ' + money(inc["new"]) + ' taxable</div></div>' +
      '<div class="exit-box"><div class="lbl">' + (better === "new" ? 'New regime saves' : 'Old regime saves') + '</div>' +
        '<div class="v">' + money(saving) + '</div><div class="t">for the year</div></div>' +
      '<div class="exit-box"><div class="lbl">Still to pay</div><div class="v">' + money(due[better]) + '</div>' +
        '<div class="t">under the ' + better + ' regime (' + money(due[better === "new" ? "old" : "new"]) + ' under the other)</div></div>' +
    '</div>' +
    '<div class="tbl-scroll"><table><thead><tr><th>Item</th><th class="num">Old regime</th><th class="num">New regime' +
      '</th></tr></thead><tbody>' + body + '</tbody></table></div></div>';
}

/* Everything tax in one place: the year's estimate with full workings, tax on
   interest paid out by holdings, and salary tax by year. */
function renderTax() {
  var meta = DATA.salaryMeta || {}, styles = {};
  (DATA.salary || []).slice().sort(function (a, b) { return a.m < b.m ? -1 : a.m > b.m ? 1 : 0; })
    .forEach(function (p) { employerStyle(p.company, styles, meta); });
  var html = yearTaxCard() + regimeCompareCard() + interestTaxCards() + salaryTaxByYear(styles, meta);
  el("tab-tax").innerHTML = html ||
    '<div class="card"><h2>Tax Planning</h2><div class="empty">No tax data yet.</div></div>';
}

function renderSalary() {
  var slips = (DATA.salary || []).slice().sort(function (a, b) { return a.m < b.m ? -1 : a.m > b.m ? 1 : 0; });
  var box = el("tab-salary");
  if (!slips.length) {
    box.innerHTML = '<div class="card"><h2>Salary</h2><div class="empty">No payslips in the spreadsheet yet.</div></div>';
    return;
  }
  var meta = DATA.salaryMeta || {}, notes = meta.notes || {};
  var styles = {};
  slips.forEach(function (p) { employerStyle(p.company, styles, meta); });
  function sum(rs, k) { return rs.reduce(function (t, r) { return t + (r[k] || 0); }, 0); }
  function span(rs) { return monthLabel(rs[0].m) + " – " + monthLabel(rs[rs.length - 1].m); }

  /* Bonuses known from a bonus statement or tax sheet, paid in a month whose
     slip is not on file. They count in every bonus figure, never in pay. */
  var extra = (DATA.salaryExtraBonus || []).map(function (b) {
    var mi = -1;
    MONTH_NAMES.forEach(function (n, i) { if (mi < 0 && b.label.indexOf(n) >= 0) mi = i; });
    employerStyle(b.company, styles, meta);
    return { company: b.company, m: b.year + "-" + String(mi < 0 ? 1 : mi + 1).padStart(2, "0"),
             label: b.label, bonus: b.bonus, bonusNotes: b.notes.split("; source")[0], extra: true };
  });
  function extraFor(company, year) {
    return extra.filter(function (b) {
      return b.company === company && (year === undefined || +b.m.slice(0, 4) === year);
    }).reduce(function (t, b) { return t + b.bonus; }, 0);
  }


  // employers in the order they employed you; a stint is consecutive slips
  var groups = [];
  slips.forEach(function (p) {
    var g = groups[groups.length - 1];
    if (!g || g.company !== p.company) {
      g = { company: p.company, short: styles[p.company].short, colour: styles[p.company].colour, slips: [] };
      groups.push(g);
    }
    g.slips.push(p);
  });
  groups.forEach(function (g) {
    var byYear = {};
    g.slips.forEach(function (p) { (byYear[p.m.slice(0, 4)] = byYear[p.m.slice(0, 4)] || []).push(p); });
    var prev = null;
    g.years = Object.keys(byYear).sort().map(function (y) {
      var rs = byYear[y], a = sum(rs, "regular") / rs.length;
      var row = { y: +y, avg: a, n: rs.length, bonus: sum(rs, "bonus") + extraFor(g.company, +y),
                  change: prev ? a / prev - 1 : null };
      prev = a;
      return row;
    });
  });

  var first = slips[0], last = slips[slips.length - 1];
  var payouts = slips.filter(function (p) { return p.bonus > 0; }).concat(extra)
    .sort(function (a, b) { return a.m < b.m ? -1 : a.m > b.m ? 1 : 0; });
  var oneOffs = slips.filter(function (p) { return p.oneOff > 0; });
  var cur = groups[groups.length - 1];

  var empRows = groups.map(function (g) {
    var n = g.slips.length;
    return '<tr><td><i class="swatch" style="background:' + g.colour + ';display:inline-block;margin-right:8px"></i>' + esc(g.company) + '</td>' +
      '<td>' + span(g.slips) + '</td><td class="num">' + n + '</td>' +
      '<td class="num">' + money(sum(g.slips, "gross") / n) + '</td>' +
      '<td class="num">' + money(sum(g.slips, "tax") / n) + '</td>' +
      '<td class="num">' + money(sum(g.slips, "net") / n) + '</td>' +
      '<td class="num">' + (sum(g.slips, "bonus") + extraFor(g.company)
        ? money(sum(g.slips, "bonus") + extraFor(g.company)) : '<span class="muted">none</span>') + '</td></tr>';
  }).join("");

  /* Every job, from offer and relieving letters. For employers with payslips,
     regular monthly pay at the first and last slip stands in for the
     letter's figure. */
  var career = DATA.salaryCareer || [];
  var careerRows = career.map(function (j) {
    // average regular pay in the first and last calendar year of slips: a
    // single slip can be a part-month or a set-up month, a year's average isn't
    var g = groups.filter(function (x) { return x.company === j.employer; })[0];
    var pay = g
      ? (j.monthly
          ? money(j.monthly) + ' at joining → ' + money(g.years[g.years.length - 1].avg) +
            '<div class="muted" style="font-size:12px">joining pay from the letter; then average regular monthly pay in ' +
              g.years[g.years.length - 1].y + ' from payslips</div>'
          : money(g.years[0].avg) + ' → ' + money(g.years[g.years.length - 1].avg) +
            '<div class="muted" style="font-size:12px">average regular monthly pay, ' + g.years[0].y + ' → ' +
              g.years[g.years.length - 1].y + ', from payslips</div>')
      : j.monthly
        ? money(j.monthly) + '<div class="muted" style="font-size:12px">' + esc(j.pay) + '</div>'
        : '<span class="muted">' + esc(j.pay) + '</span>';
    return '<tr><td><b>' + esc(j.employer) + '</b><div class="muted" style="font-size:12px">' + esc(j.role) + '</div></td>' +
      '<td style="white-space:nowrap">' + esc(j.from) + ' – ' + esc(j.to) + '</td>' +
      '<td class="desc">' + pay + '</td></tr>';
  }).join("");

  var slipRows = slips.slice().reverse().map(function (p) {
    var extra = [];
    if (p.bonus)   extra.push("bonus " + money(p.bonus));
    if (p.arrears) extra.push("arrears " + money(p.arrears));
    if (p.oneOff)  extra.push("one-off " + money(p.oneOff));
    if (p.rebuilt) extra.push("no slip on file — rebuilt from Form 16");
    return '<tr><td>' + monthLabel(p.m) + '</td><td>' + esc(styles[p.company].short) + '</td>' +
      '<td class="num">' + money(p.gross) + '</td><td class="num">' + money(p.tax) + '</td>' +
      '<td class="num">' + money(p.pf) + '</td><td class="num">' + money(p.ded) + '</td>' +
      '<td class="num"><b>' + money(p.net) + '</b></td>' +
      '<td class="muted" style="font-size:12.5px">' + extra.join(" · ") + '</td></tr>';
  }).join("");

  var oneOffRows = oneOffs.map(function (p) {
    return '<tr><td>' + monthLabel(p.m) + '</td><td>' + esc(styles[p.company].short) + '</td>' +
      '<td class="desc">' + esc(p.oneOffNotes || "") + '</td><td class="num">' + money(p.oneOff) + '</td></tr>';
  }).join("");

  /* Salary and bonus kept apart. A bonus is taxed at the top marginal rate
     (the workbook's slab + cess -- Sep 2026: 3,07,912 x 31.2% = 96,069, exactly
     the extra TDS that month); without that rate, the previous ordinary month's
     tax stands in for the salary part. The salary part keeps PF and the rest. */
  var tx0 = DATA.exitTax, marg = tx0 ? tx0.slab / 100 * (1 + tx0.cess / 100) : null;
  function bonusTaxOf(p) {
    if (!p.bonus) return 0;
    if (marg !== null) return Math.round(p.bonus * marg);
    var before = slips.filter(function (q) { return q.m < p.m && !q.bonus && q.company === p.company; }).pop();
    return before ? Math.max(0, p.tax - before.tax) : 0;
  }
  // the month picker: the tiles show the chosen payslip (newest by default)
  if (!STATE.salMonth || !slips.some(function (p) { return p.m === STATE.salMonth; })) STATE.salMonth = last.m;
  var cur = slips.filter(function (p) { return p.m === STATE.salMonth; })[0];
  var monthPick = '<div class="filters"><div class="f"><label for="sal-month">Payslip</label><select id="sal-month">' +
    slips.slice().reverse().map(function (p) {
      return '<option value="' + p.m + '"' + (p.m === cur.m ? ' selected' : '') + '>' + monthLabel(p.m) + ' · ' +
        esc(styles[p.company].short) + (p.bonus ? ' · bonus' : '') + (p.rebuilt ? ' · rebuilt' : '') + '</option>';
    }).join("") + '</select></div></div>';
  var lastBonusTax = bonusTaxOf(cur);
  var salGrossNow = cur.gross - (cur.bonus || 0) - (cur.oneOff || 0);
  var salTaxNow = cur.tax - lastBonusTax;
  var salNetNow = cur.net - ((cur.bonus || 0) - lastBonusTax) - (cur.oneOff || 0);
  // a bonus only for the month it was paid -- on the payslip, or paid separately that month
  var offSlip = payouts.filter(function (p) { return p.extra && p.m === cur.m && p.company === cur.company; });
  var bonusAmt = (cur.bonus || 0) + offSlip.reduce(function (t, p) { return t + p.bonus; }, 0);
  var bonusTax = lastBonusTax + (marg !== null ? offSlip.reduce(function (t, p) { return t + Math.round(p.bonus * marg); }, 0) : 0);
  var bonusNote = cur.bonus ? (cur.bonusNotes || 'on the payslip') : (offSlip.length ? 'paid separately from the payslip' : '');

  var pf = cur.pf || 0, pt = cur.profTax || 0, otherDed = cur.otherDed || 0;

  box.innerHTML =
    monthPick +
    '<div class="grid k4" style="margin-bottom:16px">' +
      '<div class="tile"><div class="lbl">Monthly salary (gross)</div><div class="val">' + money(cur.regular) + '</div>' +
        kvText('Employer', esc(styles[cur.company].short)) +
        kvText('Month', monthLabel(cur.m)) +
        (cur.arrears ? kv('Plus arrears (back pay)', cur.arrears) : '') +
        (cur.rebuilt ? kv('No payslip on file — rebuilt', null, 'note') : '') +
      '</div>' +
      '<div class="tile"><div class="lbl">Take-home salary · ' + monthLabel(cur.m) + '</div><div class="val">' + money(salNetNow) + '</div>' +
        kv('Gross salary', salGrossNow) +
        kv('Less income tax', -salTaxNow) +
        (pf ? kv('Less provident fund (PF)', -pf) : '') +
        (pt ? kv('Less professional tax', -pt) : '') +
        (otherDed ? kv('Less other deductions', -otherDed) : '') +
        kv('Paid into your bank', salNetNow, 'total') +
        (cur.oneOff ? kv('Not included: ' + money(cur.oneOff) + ' one-off payment', null, 'note') : '') +
      '</div>' +
      '<div class="tile"><div class="lbl">Bonus · ' + monthLabel(cur.m) + '</div><div class="val">' + money(bonusAmt - bonusTax) + '</div>' +
        (bonusAmt
          ? kv('Bonus', bonusAmt) +
            kv('Less income tax', -bonusTax) +
            kv('Paid into your bank', bonusAmt - bonusTax, 'total') +
            (bonusNote ? kv(esc(bonusNote), null, 'note') : '')
          : kv('No bonus this month', null, 'note')) +

      '<div class="tile"><div class="lbl">Growth since ' + first.m.slice(0, 4) + '</div><div class="val">' +
        (cur.regular / first.regular).toFixed(1) + '×</div>' +
        kv(monthLabel(first.m) + ' (first payslip)', first.regular) +
        kv(monthLabel(cur.m), cur.regular) +
        kv('Monthly salary, gross', null, 'note') +
      '</div>' +
    '</div>' +



    '<div class="card"><h2>Year-on-year pay rise</h2>' +
      '<p class="cap">Every job since you started. Coloured bars: average regular monthly pay each year from ' +
        'payslips; the % under each year is the change on the year before at the same employer (bonus, arrears and ' +
        'one-offs left out). Grey bars: pay at joining from the offer letter; ≈ marks an estimate (a salary in another ' +
        'currency, or fees averaged per month). Tap a bar for detail.</p>' +
      '<div id="sal-rise"></div>' +
      '<p class="cap" style="margin:12px 0 0">First and last years at a firm are part-years.' +
        (notes.rise ? ' ' + esc(notes.rise) : '') + '</p>' +
    '</div>' +

    ctcCard(styles, meta) +

    '<div class="card"><h2>Bonuses</h2>' +
      '<p class="cap">Bonus lines on the payslips, one bar per payout.' +
        (notes.bonus ? ' ' + esc(notes.bonus) : '') + '</p>' +
      (payouts.length ? '<div id="sal-bonus"></div>' : '<div class="empty">No bonus lines on any slip.</div>') +
      (oneOffs.length
        ? '<h2 style="margin-top:22px">Other one-off payments</h2>' +
          '<p class="cap">Other one-off lines on the payslips, not counted as bonus.' +
            (notes.oneOff ? ' ' + esc(notes.oneOff) : '') +
            ' Back pay after a raise (arrears) is left out of both.</p>' +
          '<div class="tbl-scroll"><table><thead><tr><th>Month</th><th>Employer</th><th>What</th>' +
          '<th class="num">Amount</th></tr></thead><tbody>' + oneOffRows + '</tbody></table></div>'
        : '') +
    '</div>' +

    '<div class="card"><h2>By employer</h2>' +
      '<p class="cap">Averages per payslip. Months with no payslip on file are simply missing, not counted as zero.</p>' +
      '<div class="tbl-scroll"><table><thead><tr><th>Employer</th><th>Period</th><th class="num">Slips</th>' +
      '<th class="num">Avg gross</th><th class="num">Avg tax</th><th class="num">Avg take-home</th>' +
      '<th class="num">Bonus total</th></tr></thead><tbody>' + empRows + '</tbody></table></div>' +
    '</div>' +

    (career.length
      ? '<div class="card"><h2>Career since ' + esc(career[0].from.slice(-4)) + '</h2>' +
          '<p class="cap">Every job, from offer, appointment and relieving letters. Pay is as stated ' +
          'when you joined; where payslips exist, the average regular monthly pay in the first and last year.</p>' +
          '<div class="tbl-scroll"><table><thead><tr><th>Employer</th><th>Period</th><th>Pay</th></tr></thead>' +
          '<tbody>' + careerRows + '</tbody></table></div></div>'
      : '') +

    '<div class="card"><h2>Every payslip</h2>' +
      '<p class="cap">' + slips.length + ' slips, newest first.</p>' +
      '<div class="tbl-scroll"><table><thead><tr><th>Month</th><th>Employer</th><th class="num">Gross</th>' +
      '<th class="num">Income tax</th><th class="num">PF</th><th class="num">Deductions</th>' +
      '<th class="num">Take-home</th><th></th></tr></thead><tbody>' + slipRows + '</tbody></table></div>' +
    '</div>';

  /* The chart follows the whole career in date order: employers with payslips
     keep their year-by-year bars; the others show one grey bar, the joining
     pay from their offer letter (or a note where it isn't a rupee monthly). */
  var riseGroups = [], used = {};
  (DATA.salaryCareer || []).forEach(function (j) {
    var g = groups.filter(function (x) { return x.company === j.employer; })[0];
    if (g) {
      if (!used[g.company]) { riseGroups.push(g); used[g.company] = true; }
      return;
    }
    var yr = +(j.from.slice(-4)) || 0;
    var last = riseGroups[riseGroups.length - 1];
    // a figure marked "≈" in the data is an estimate (a foreign-currency salary
    // converted, or fees averaged per month), not a salary stated in rupees
    var bar = { y: yr, avg: j.monthly || 0, n: 0, change: null, bonus: 0, letter: true, role: j.role, pay: j.pay,
                approx: /^≈/.test(j.pay || "") };
    if (last && last.letter && last.company === j.employer) { last.years.push(bar); return; }
    // one word under a narrow grey bar (the tooltip carries the full name)
    riseGroups.push({ company: j.employer, short: j.employer.split(" (")[0].split(" ")[0], full: j.employer,
                      colour: "var(--muted)", letter: true, years: [bar] });
  });
  groups.forEach(function (g) { if (!used[g.company]) riseGroups.push(g); });
  el("sal-month").addEventListener("change", function () {
    STATE.salMonth = this.value;
    var y = window.scrollY;
    renderSalary();
    window.scrollTo(0, y);
  });
  chartPayRise(el("sal-rise"), riseGroups.length ? riseGroups : groups);
  if (payouts.length) chartBonus(el("sal-bonus"), payouts, styles);
}

function cmpLoad() {
  if (STATE.cmp) return STATE.cmp;
  var tx = DATA.exitTax || {}, saved = {};
  try { saved = JSON.parse(localStorage.getItem("ft.cmp") || "{}") || {}; } catch (e) { saved = {}; }
  STATE.cmp = { amt: saved.amt || 500000, yrs: saved.yrs || 5, slab: saved.slab != null ? saved.slab : (tx.slab != null ? tx.slab : 30),
                allow: saved.allow != null ? saved.allow : true, open: {} };
  return STATE.cmp;
}
function cmpSave() {
  var c = STATE.cmp;
  try { localStorage.setItem("ft.cmp", JSON.stringify({ amt: c.amt, yrs: c.yrs, slab: c.slab, allow: c.allow })); } catch (e) {}
}

/* Premiums already going into policies that count towards the tax-free
   limits: ULIPs bought on or after 1 Feb 2021, other savings policies on or
   after 1 Apr 2023. A policy still awaiting issue has no start date and counts. */
function premiumsUsed() {
  var u = 0, t = 0;
  (DATA.insurance || []).forEach(function (p) {
    var k = String(p.kind || ""), s = p.start || "9999";
    if (/ulip/i.test(k) && s >= "2021-02-01") u += p.premium || 0;
    else if (/life \((savings|guaranteed|endowment)/i.test(k) && s >= "2023-04-01") t += p.premium || 0;
  });
  return { ulip: u, trad: t };
}

function cmpRow(s, A, H, c, used) {
  var t = c.slab / 100 * (1 + ((DATA.exitTax || {}).cess || 4) / 100);
  var cess = 1 + ((DATA.exitTax || {}).cess || 4) / 100;
  var r = { s: s, rateTxt: typeof s.rateTxt === "function" ? s.rateTxt(H) : s.rateTxt, fit: true, why: "", note: "" };
  if (s.notYet) { r.fit = false; r.why = s.notYet; return r; }
  if (s.minYears && H < s.minYears) { r.fit = false; r.why = s.minWhy; return r; }
  if (H < s.lock) { r.fit = false; r.why = "Locked for " + (s.lock < 1 ? s.lock * 12 + " months" : s.lock + " years") + ", longer than your " + H + (H === 1 ? " year" : " years"); return r; }
  var amt = s.cap ? Math.min(A, s.cap) : A;
  if (s.cap && A > s.cap) r.note = "Only " + money(s.cap) + " can go in; the other " + money(A - s.cap) + " has to go elsewhere";
  var e = s.rate(H), pen = s.penalty ? s.penalty(H) * amt : 0;
  var pre = amt * Math.pow(1 + e, H) - pen, post, how;
  var gain = pre - amt;
  if (s.tax === "slab") {
    post = amt * Math.pow(1 + e * (1 - t), H) - pen * (1 - t);
    how = "Interest taxed at " + c.slab + "% + cess each year";
  } else if (s.tax === "slabExit") {              // debt funds: whole gain taxed at the slab, once, on sale
    post = pre - Math.max(0, gain) * t;
    how = "Whole gain taxed at " + c.slab + "% + cess when you sell";
  } else if (s.tax === "gold") {                  // gold price gain at 12.5% on sale; the small interest at the slab yearly
    var gGain = amt * Math.pow(1 + e, H) - amt, iPre = amt * (Math.pow(1 + s.interest, H) - 1);
    pre = amt + gGain + iPre; gain = pre - amt;
    post = amt + gGain * (1 - EQUITY_LTCG / 100 * cess) + amt * (Math.pow(1 + s.interest * (1 - t), H) - 1);
    how = "Gold gain taxed at 12.5% + cess when sold (no ₹1.25 lakh allowance: that is for shares and equity funds only); the interest at " + c.slab + "% + cess each year";
  } else if (s.tax === "free") {
    post = pre; how = "Tax-free";
  } else if (s.tax === "trad" && used.trad + amt <= TRAD_PREMIUM_LIMIT) {
    post = pre; how = "Tax-free: your policies would total " + money(used.trad + amt) + " a year, within ₹5 lakh";
  } else if (s.tax === "trad") {
    post = pre - Math.max(0, gain) * t;
    how = "Taxable: with this your policies total " + money(used.trad + amt) + " a year, over ₹5 lakh, so the gain is taxed at your slab";
  } else if (s.tax === "ulip" && used.ulip + amt <= ULIP_PREMIUM_LIMIT) {
    post = pre; how = "Tax-free: your ULIPs would total " + money(used.ulip + amt) + " a year, within ₹2.5 lakh (and cover must be 10× premium)";
  } else {           // equity funds, and ULIPs over the limit
    var free = c.allow ? EQUITY_ALLOWANCE : 0;
    post = pre - Math.max(0, gain - free) * EQUITY_LTCG / 100 * cess;
    how = (s.tax === "ulip" ? "Taxed like an equity fund: your ULIPs would total " + money(used.ulip + amt) + " a year, over ₹2.5 lakh. " : "") +
      "Sold after 12 months: 12.5% + cess on gains" + (c.allow ? " above ₹1.25 lakh" : " (₹1.25 lakh allowance already used)");
  }
  r.amt = amt; r.pre = pre; r.post = post; r.tax = pre - post; r.how = how;
  r.cagr = Math.pow(post / amt, 1 / H) - 1;
  r.preRate = Math.pow(pre / amt, 1 / H) - 1;
  return r;
}

function pct1(x) { return (x * 100).toFixed(1) + "%"; }

function renderInvest() {
  var c = cmpLoad(), A = c.amt, H = c.yrs, used = premiumsUsed();
  var rows = SCHEMES.map(function (s) { return cmpRow(s, A, H, c, used); });
  var fit = rows.filter(function (r) { return r.fit; }).sort(function (a, b) { return b.cagr - a.cagr; });

      '<div class="f"><label for="inv-yrs">Can stay invested for</label><select id="inv-yrs">' + yrOpts + '</select></div>' +

      '<div class="f"><label for="inv-allow">₹1.25L equity-gain allowance</label><select id="inv-allow">' +
        '<option value="1"' + (c.allow ? ' selected' : '') + '>Not used yet</option><option value="0"' + (c.allow ? '' : ' selected') + '>Already used</option></select></div>' +
    '</div><div class="inv-quick">' + amtBtns + '</div></div>';

  // ---- summary boxes
  function best(pred) { return fit.filter(pred)[0]; }
  function box(lbl, r, extra) {
    if (!r) return '<div class="exit-box"><div class="lbl">' + lbl + '</div><div class="v">—</div><div class="t">nothing fits ' + H + ' years</div></div>';
    return '<div class="exit-box"><div class="lbl">' + lbl + '</div><div class="v">' + pct1(r.cagr) + ' a year</div>' +
      '<div class="t">' + esc(r.s.name) + '</div><div class="why">' + money(r.amt) + ' → ' + money(r.post) + ' after tax' + (extra || '') + '</div></div>';
  }
  var sav = fit.filter(function (r) { return r.s.id === "sav"; })[0];
  html += '<div class="grid k4" style="margin-bottom:16px">' +
    box("Best guaranteed", best(function (r) { return r.s.guaranteed; })) +
    box("Best you can take out any time", best(function (r) { return r.s.lock <= 0.5 && !r.s.risky; })) +
    box("Best overall (not guaranteed)", best(function (r) { return !r.s.guaranteed; })) +
    box("If it stays in savings", sav) + '</div>';

  // ---- ranked table
  var top = fit.length ? Math.max.apply(null, fit.map(function (r) { return r.cagr; })) : 1;
  function pills(s) {
    return (s.guaranteed ? '<span class="pill ok">Guaranteed</span>' : s.floating ? '<span class="pill">Rate resets</span>'

      ' <span class="pill">' + esc(s.safety) + '</span>';
  }
  var body = fit.map(function (r, i) {

      '<div class="tax-lines">' +
        kv("Put in", Math.round(r.amt)) +
        kv("Value after " + H + (H === 1 ? " year" : " years") + ", before tax", Math.round(r.pre)) +
        kv("Tax", -Math.round(r.tax)) +

      '</div><p>' + esc(r.how) + '.</p>' + (r.note ? '<p><b>' + esc(r.note) + '.</b></p>' : '') +

  var offBody = off.map(function (r) {
    return '<tr class="inv-off"><td>' + esc(r.s.name) + '</td><td class="num">' + esc(r.rateTxt) + '</td><td colspan="5">' + esc(r.why) + '</td></tr>';
  }).join("");
  html += '<div class="card"><h2>Ranked by what you keep · ' + money(A) + ' for ' + H + (H === 1 ? ' year' : ' years') + '</h2>' +
    '<p class="cap">Tax at ' + c.slab + '% + ' + (tx.cess || 4) + '% cess under the new regime. Interest that is paid out is counted as if put back at the same rate, ' +
      'so every option can be compared as "% a year". Tap a row for the workings.</p>' +
    '<div class="tbl-scroll"><table class="inv-tbl"><thead><tr><th>Option</th><th class="num">Rate</th><th>Locked for</th>' +
      '<th class="num">Value before tax</th><th class="num">Tax</th><th class="num">You keep</th><th class="num">After tax, a year</th></tr></thead>' +
      '<tbody>' + body + (offBody ? '<tr><td colspan="7" class="inv-sep">Not a fit for ' + H + (H === 1 ? ' year' : ' years') + '</td></tr>' + offBody : '') +
    '</tbody></table></div></div>';

  // ---- rules side by side
  html += '<div class="card"><h2>The rules, side by side</h2>' +
    '<p class="cap">Lock-in, early exit, tax and limits for each option. Your insurance policies already use ' + money(used.ulip) +
      ' of the ₹2.5 lakh yearly ULIP limit and ' + money(used.trad) + ' of the ₹5 lakh limit for other savings policies.</p>' +
    '<div class="tbl-scroll"><table class="inv-rules"><thead><tr><th>Option</th><th>Lock-in</th><th>Taking money out early</th><th>Tax</th>' +
      '<th>Interest paid</th><th>Limit</th><th>TDS</th><th>Safety</th></tr></thead><tbody>' +
    SCHEMES.map(function (s) {
      var R = s.rules;
      return '<tr><td><b>' + esc(s.name) + '</b></td><td>' + esc(R.lock) + '</td><td>' + esc(R.exit) + '</td><td>' + esc(R.tax) + '</td>' +
        '<td>' + esc(R.paid) + '</td><td>' + esc(R.limit) + '</td><td>' + esc(R.tds) + '</td><td>' + esc(s.safety) + '</td></tr>';
    }).join("") + '</tbody></table></div></div>';

  html += '<div class="card"><h2>Before you decide</h2><ul class="inv-notes">' +
    '<li>Guaranteed rates are fixed on the day you invest. Post Office rates are reset each quarter (unchanged for Oct–Dec 2026), the RBI bond every six months.</li>' +
    '<li>Fund, gold and ULIP figures are assumptions, not promises: arbitrage funds have run between about 5.5% and 7.5%; debt funds can dip for a few months when interest rates rise; gold and share-market funds can fall sharply in a bad year.</li>' +
    '<li>Tax law: the Income-tax Act 2025 applies from 1 April 2026, with the same rates and limits as before (sections renumbered).</li>' +
    '<li>Rates from: India Post / Ministry of Finance (Oct–Dec 2026), HDFC Bank FD card, RBI (FRSB 8.05% to Dec 2026), REC/PFC/IRFC 54EC (5.25%), Bajaj Finance and Shriram Finance, Value Research (arbitrage, liquid and corporate bond categories), Budget 2026 SGB tax change, insurer illustrations.</li>' +
    '<li>This is a comparison to help you think, not investment advice. It was prepared with an AI assistant, not a licensed financial adviser.</li></ul></div>';

  var box0 = el("tab-invest");
  box0.innerHTML = html;

  function redraw() { cmpSave(); var y = window.scrollY; renderInvest(); window.scrollTo(0, y); }
  var amtIn = el("inv-amt");

/* Money fronted for Amma and repaid over the following months. Both legs are
   tagged Transfer / Amma Receivable in the spreadsheet and excluded from the
   charts, so they appear nowhere else in this app -- which is exactly why this
   tab exists: without it the arrangement is invisible. */
function renderAmma() {
  var rows = DATA.txns.filter(function (t) { return t.s === "Amma Receivable"; })
                      .slice()
                      .sort(function (a, b) { return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; });

  var paid   = rows.reduce(function (s, t) { return s + t.db; }, 0);
  var repaid = rows.reduce(function (s, t) { return s + t.cr; }, 0);
  var out    = paid - repaid;
  var owed   = out >= 0;

  var body = rows.length ? rows.map(function (t) {
    var isPaid = t.db > 0;
    return '<tr>' +
      '<td>' + dayLabel(t.d) + ' ' + t.d.slice(0, 4) + '</td>' +
      '<td>' + esc(t.ds) + (t.n ? '<div class="muted" style="font-size:12px">' + esc(t.n) + '</div>' : '') + '</td>' +
      '<td class="num">' + (isPaid ? money(t.db) : '') + '</td>' +
      '<td class="num">' + (isPaid ? '' : money(t.cr)) + '</td>' +
    '</tr>';
  }).join("") : "";

  el("tab-amma").innerHTML =
    '<div class="card"><div class="total">' +
      '<div class="headline"><div class="lbl">' + (owed ? 'She owes' : 'She is ahead by') + '</div>' +
        '<div class="val">' + money(Math.abs(out)) + '</div></div>' +
      '<div class="parts">' +
        '<div class="part"><div class="p-lbl">Paid on her behalf</div>' +
          '<div class="p-val">' + money(paid) + '</div></div>' +
        '<div class="part"><div class="p-lbl">Repaid by her</div>' +
          '<div class="p-val">' + money(repaid) + '</div></div>' +
      '</div>' +
    '</div>' +
    '<p class="cap" style="margin:14px 0 0">' +
      (owed
        ? 'What you have fronted, less what she has sent back.'
        : 'She has sent back more than the spending tagged so far. That usually means bills ' +
          'she has reimbursed are not yet tagged in the spreadsheet rather than that she has overpaid.') +
      ' None of this counts as your income or your expense, so it appears on no other tab.</p>' +
    '</div>' +

    '<div class="card"><h2>Every tagged transaction</h2>' +
      '<p class="cap">' + rows.length + ' rows, newest first.</p>' +
      (body
        ? '<div class="tbl-scroll"><table><thead><tr><th>Date</th><th>Description</th>' +
          '<th class="num">Paid out</th><th class="num">Repaid</th></tr></thead>' +
          '<tbody>' + body + '</tbody></table></div>'
        : '<div class="empty">Nothing tagged yet.</div>') +
    '</div>';
}

/* Month by month: one row per month -- income, expenses, invested, net saved,
   savings rate -- newest first, with a total row for the year shown. A row
   opens in place into where that month's money came from and went. Same
   numbers as the Overview tiles (monthsIndex / addTo), so the two always agree.
   The Overview tiles land here with their month already open. */
/* One-off costs (Vinod, 2 Oct 2026): the Monthly tab can set aside spending
   that is not part of an ordinary month, so the everyday months stand out.
   Display only -- nothing in the data changes, and Overview is untouched.
     - anything filed Moving & Relocation
     - an insurance premium of Rs 5,000 or more (the yearly renewals)
     - any other single expense of Rs 40,000 or more, except rent and home-loan
       EMIs, which are regular however large */
var ONE_OFF_MIN = 40000, ONE_OFF_INSURANCE_MIN = 5000;
function isOneOff(t) {
  if (!charted(t) || t.t !== "Expense" || !(t.db > 0)) return false;
  if (t.s === "Moving & Relocation") return true;
  if (t.s === "Insurance Premium") return t.db >= ONE_OFF_INSURANCE_MIN;
  if (t.s === "Rent" || t.s === "Home Loan") return false;
  return t.db >= ONE_OFF_MIN;
}
function oneOffByMonth() {
  var m = {};
  DATA.txns.forEach(function (t) {
    if (!isOneOff(t)) return;
    var k = monthKey(t.d);
    (m[k] = m[k] || { sum: 0, rows: [] }).sum += t.db;
    m[k].rows.push(t);
  });
  return m;
}
/* the month as the table shows it: one-offs taken out of Expenses when set aside */
function shownAgg(k, a, oo) {
  a = a || blankAgg();
  if (!STATE.mOneOff || !oo[k]) return a;
  var b = {}; for (var x in a) b[x] = a[x];
  b.expense -= oo[k].sum;
  return b;
}

function monthDetail(k) {
  var inc = {}, exp = {}, inv = [], big = [], n = 0;
  DATA.txns.forEach(function (t) {
    if (!charted(t) || monthKey(t.d) !== k) return;
    n++;
    if (t.t === "Income") { var nm = t.s || t.c || "Other"; inc[nm] = (inc[nm] || 0) + t.cr; }
    else if (t.t === "Expense") {
      if (STATE.mOneOff && isOneOff(t)) return;           // listed in its own box below
      exp[t.c] = (exp[t.c] || 0) + t.db; if (t.db > 0) big.push(t);
    }
    else if (t.t === "Savings" && (t.db || t.cr)) inv.push(t);
  });
  function ranked(m) {
    return Object.keys(m).map(function (x) { return [x, m[x]]; })
                 .filter(function (r) { return Math.abs(r[1]) >= 0.5; })
                 .sort(function (a, b) { return b[1] - a[1]; });
  }
  var oo = oneOffByMonth();
  var a = shownAgg(k, monthsIndex(DATA.txns).map[k], oo);
  var incR = ranked(inc), expR = ranked(exp);
  big.sort(function (x, y) { return y.db - x.db; });
  function what(t) { return esc(t.n || t.ds); }

  var incBox = '<div class="exit-box"><div class="lbl">Income</div><div class="v">' + money(a.income) + '</div>' +
    (incR.length ? incR.map(function (r) { return kv(esc(r[0]), Math.round(r[1])); }).join("")
                 : kvText('No income this month', '', 'note')) + '</div>';

  var expBox = '<div class="exit-box"><div class="lbl">' + (STATE.mOneOff ? 'Everyday expenses' : 'Expenses by category') + '</div><div class="v">' + money(a.expense) + '</div>' +
    (expR.length ? expR.map(function (r) {
      var pct = a.expense > 0 ? Math.round(r[1] / a.expense * 100) : 0;
      return '<div class="kv"><span>' + esc(r[0]) + ' <span class="muted">' + pct + '%</span></span><b>' + money(r[1]) + '</b></div>';
    }).join("") : kvText('No expenses this month', '', 'note')) + '</div>';

  var invLines = fdRenewals(inv);
  var invBox = '<div class="exit-box"><div class="lbl">Invested</div><div class="v">' + signed(a.invest) + '</div>' +
    (invLines.length ? invLines.map(function (l) { return kv(l[0], l[1]); }).join("") +
      (invLines.some(function (l) { return l[1] < 0; })
        ? kvText('A minus is money taken back out of savings', '', 'note') : '')
                : kvText('Nothing newly invested', '', 'note')) +
    '<div class="kv total"><span>Net saved</span><b>' + signed(net(a)) + '</b></div>' +
    kvText('Savings rate', (rate(a) * 100).toFixed(1) + '%') + '</div>';

  var bigBox = big.length
    ? '<div class="exit-box" style="margin-top:12px"><div class="lbl">Biggest expenses</div>' +
        big.slice(0, 5).map(function (t) {
          return txnLine(t, t.db, t.c);
        }).join("") + '</div>'
    : '';

  var ooBox = STATE.mOneOff && oo[k]
    ? '<div class="exit-box" style="margin-top:12px"><div class="lbl">One-off costs set aside · ' + money(oo[k].sum) + '</div>' +
        oo[k].rows.slice().sort(function (x, y) { return y.db - x.db; }).map(function (t) {
          return txnLine(t, t.db, t.c + ' / ' + t.s);
        }).join("") + '</div>'
    : '';

  return '<div class="m-detail"><div class="grid k3" style="margin:6px 0 4px">' + incBox + expBox + invBox + '</div>' + ooBox + bigBox +
    '<p style="margin:12px 0 2px"><button class="linkish m-txns" data-m="' + k + '">See all ' + n +
    ' transactions for ' + monthLabel(k) + ' ›</button></p></div>';
}

/* An FD that matures and a new FD opened within a week of it -- or later the
   same month for much the same amount -- are one renewal,
   shown as a single line worth the difference -- usually the interest left in.
   Only the display is merged; the amounts and the month's total are unchanged,
   and the two bank lines stay on the Transactions tab. Largest maturity first,
   each paired with the placement closest to it in amount. */
function fdRenewals(rows) {
  var fd = function (t) { return t.s === "Fixed Deposit"; };
  var outs = rows.filter(function (t) { return fd(t) && t.cr > 0 && !t.db; })
                 .sort(function (a, b) { return b.cr - a.cr; });
  var ins = rows.filter(function (t) { return fd(t) && t.db > 0 && !t.cr; });
  var used = [], lines = [];
  function days(a, b) { return Math.abs(new Date(a) - new Date(b)) / 864e5; }
  outs.forEach(function (o) {
    var best = null;
    ins.forEach(function (n) {
      if (used.indexOf(n) >= 0) return;
      if (days(n.d, o.d) > 7 && Math.abs(n.db - o.cr) > o.cr * 0.05) return;
      if (!best || Math.abs(n.db - o.cr) < Math.abs(best.db - o.cr)) best = n;
    });
    if (!best) return;
    used.push(o, best);
    var diff = best.db - o.cr, pair = ' (' + money(o.cr) + ' → ' + money(best.db) + ')';
    var what = Math.abs(diff) <= o.cr * 0.05 ? 'FD renewed'
             : diff > 0 ? 'FD renewed with ' + money(diff) + ' added'
             : 'FD renewed, ' + money(-diff) + ' kept as cash';
    var when = days(o.d, best.d) > 7 ? dayLabel(o.d) + ' → ' + dayLabel(best.d) : dayLabel(o.d < best.d ? o.d : best.d);
    lines.push([o.d < best.d ? o.d : best.d, when + ' · ' + what +
      '<span class="muted">' + pair + '</span>', Math.round(diff)]);
  });
  rows.forEach(function (t) {
    if (used.indexOf(t) < 0) lines.push([t.d, dayLabel(t.d) + ' · ' + esc(t.n || t.ds), Math.round(t.db - t.cr)]);
  });
  return lines.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0; })
              .map(function (l) { return [l[1], l[2]]; });
}

function signed(n) { return n < 0 ? '−' + money(-n) : money(n); }

/* "Show" on the Monthly tab: one category, or one sub-category, month by month.
   Spending categories count debits, income categories credits -- the same
   amounts the Spending tab and the Overview tiles use. Months with nothing
   spent show ₹0 so a gap is visible, from the first month the item appears. */
function catRows(cat, sub) {
  // a category is spending if any of its rows is; a stray Income row under it is left out
  var typ = DATA.txns.some(function (t) { return t.c === cat && t.t === "Expense"; }) ? "Expense" : "Income";
  return DATA.txns.filter(function (t) {
    return charted(t) && t.t === typ && t.c === cat && (!sub || t.s === sub);
  });
}
function nOf(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
function catAmt(t) { return t.t === "Income" ? t.cr : t.db; }

/* One transaction in an opened month: row number, date, the note (if any) and
   the bank's description in full underneath, amount on the right. */
function txnLine(t, amt, tag) {
  return '<div class="kv m-line"><span><span class="muted">#' + t.row + '</span> ' + dayLabel(t.d) + ' · ' +
      (t.n ? '<span class="m-note">' + esc(t.n) + '</span>' : '') + (tag ? ' <span class="muted">' + esc(tag) + '</span>' : '') +
      '<span class="m-desc">' + esc(t.ds) + '</span></span><b>' + money(amt) + '</b></div>';
}

function catMonthDetail(k) {
  var rows = catRows(STATE.mCat, STATE.mSub).filter(function (t) { return monthKey(t.d) === k && catAmt(t) > 0; })
                                           .sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
  var bySub = {};
  rows.forEach(function (t) { bySub[t.s] = (bySub[t.s] || 0) + catAmt(t); });
  var subs = Object.keys(bySub).sort(function (a, b) { return bySub[b] - bySub[a]; });
  var html = (!STATE.mSub && subs.length > 1
      ? '<div class="exit-box" style="margin:6px 0 12px"><div class="lbl">By sub-category</div>' +
          subs.map(function (x) { return kv(esc(x), Math.round(bySub[x])); }).join("") + '</div>'
      : '') +
    (rows.length
      ? '<div class="exit-box"><div class="lbl">' + nOf(rows.length, 'transaction') + '</div>' +
          rows.map(function (t) {
            return txnLine(t, catAmt(t), STATE.mSub ? '' : t.s);
          }).join("") + '</div>'
      : '<div class="empty">Nothing this month.</div>');
  return '<div class="m-detail">' + html +
    (rows.length ? '<p style="margin:12px 0 2px"><button class="linkish m-txns" data-m="' + k + '">Open these on the Transactions tab ›</button></p>' : '') +
    '</div>';
}

function catMonthlyCard(allKeys) {
  var cat = STATE.mCat, sub = STATE.mSub, rows = catRows(cat, sub);
  var isInc = rows.length && rows[0].t === "Income";
  var per = {}, cnt = {};
  rows.forEach(function (t) { var k = monthKey(t.d); per[k] = (per[k] || 0) + catAmt(t); if (catAmt(t) > 0) cnt[k] = (cnt[k] || 0) + 1; });
  var first = Object.keys(per).sort()[0];
  var keys = allKeys.filter(function (k) { return first && k >= first; });
  var idx = monthsIndex(DATA.txns).map;
  var name = sub ? sub : cat;

  // headline figures: this year and last year, as totals and as a monthly average
  var last = keys[keys.length - 1] || "", yNow = last.slice(0, 4), yPrev = String(+yNow - 1);
  // the month still under way is in the total but not the average -- a day or
  // two of it would drag the average down
  var d0 = new Date(), cur = d0.getFullYear() + "-" + String(d0.getMonth() + 1).padStart(2, "0");
  function yr(y) {
    var ks = keys.filter(function (k) { return k.slice(0, 4) === y; });
    var full = ks.filter(function (k) { return k !== cur; });
    var sum = ks.reduce(function (s, k) { return s + (per[k] || 0); }, 0);
    var fsum = full.reduce(function (s, k) { return s + (per[k] || 0); }, 0);
    return { sum: sum, n: ks.length, avg: full.length ? fsum / full.length : 0, full: full.length };
  }
  var now = yr(yNow), prev = yr(yPrev);
  var peak = keys.reduce(function (b, k) { return !b || (per[k] || 0) > (per[b] || 0) ? k : b; }, null);
  var change = prev.avg > 0 ? (now.avg - prev.avg) / prev.avg * 100 : null;

  var shown = keys.filter(function (k) { return !STATE.mYear || k.slice(0, 4) === STATE.mYear; }).reverse();
  var tot = 0, totN = 0;
  var body = shown.map(function (k) {
    var v = per[k] || 0, open = !!STATE.mcOpen[k];
    var base = isInc ? (idx[k] || blankAgg()).income : (idx[k] || blankAgg()).expense;
    tot += v; totN += cnt[k] || 0;
    return '<tr class="tax-row" data-key="' + k + '" tabindex="0" role="button" aria-expanded="' + open + '">' +
        '<td style="white-space:nowrap"><span class="chev">' + (open ? '▾' : '▸') + '</span> <b>' + monthLabel(k) + '</b></td>' +
        '<td class="num">' + (v ? '<b>' + money(v) + '</b>' : '<span class="muted">₹0</span>') + '</td>' +
        '<td class="num">' + (cnt[k] || '—') + '</td>' +
        '<td class="num">' + (base > 0 && v ? (v / base * 100).toFixed(1) + '%' : '—') + '</td>' +
      '</tr>' +
      '<tr class="tax-detail"' + (open ? '' : ' hidden') + ' data-for="' + k + '"><td colspan="4">' +
        (open ? catMonthDetail(k) : '') + '</td></tr>';
  }).join("");

  var tiles = '<div class="grid k4" style="margin-bottom:16px">' +
      '<div class="tile"><div class="lbl">' + yNow + ' so far</div><div class="val">' + money(now.sum) + '</div>' +
        '<div class="sub">over ' + nOf(now.n, 'month') + '</div></div>' +
      '<div class="tile"><div class="lbl">A month in ' + yNow + '</div><div class="val">' + money(now.avg) + '</div>' +
        (change === null ? '<div class="sub muted">no ' + yPrev + ' to compare</div>'
          : '<div class="sub ' + ((change >= 0) === isInc ? 'up' : 'down') + '">' + (change >= 0 ? '↑ ' : '↓ ') +
            Math.abs(change).toFixed(0) + '% vs ' + money(prev.avg) + ' in ' + yPrev + '</div>') + '</div>' +
      '<div class="tile"><div class="lbl">' + yPrev + '</div><div class="val">' + money(prev.sum) + '</div>' +
        '<div class="sub">' + (prev.n ? 'over ' + nOf(prev.n, 'month') : 'nothing recorded') + '</div></div>' +
      '<div class="tile"><div class="lbl">Highest month</div><div class="val">' + money(peak ? per[peak] : 0) + '</div>' +
        '<div class="sub">' + (peak ? monthLabel(peak) : '—') + '</div></div>' +
    '</div>';

  return tiles +
    '<div class="card"><h2>' + esc(name) + ' each month</h2><p class="cap">' +
      (STATE.mYear || 'All years') + '. Tap a bar to open that month below.</p><div id="m-cat-chart"></div></div>' +
    '<div class="card"><h2>' + esc(name) + (sub ? ' <span class="muted" style="font-weight:500">· ' + esc(cat) + '</span>' : '') + ' month by month</h2>' +
    '<p class="cap">Newest first, from the first month it appears. Share is of that month\'s ' + (isInc ? 'income' : 'spending') +
      '. Tap a month for the transactions.</p>' +
    (body
      ? '<div class="tbl-scroll"><table><thead><tr><th>Month</th><th class="num">' + (isInc ? 'Received' : 'Spent') + '</th>' +
          '<th class="num">Transactions</th><th class="num">Share</th></tr></thead><tbody>' + body +
          '<tr class="m-total"><td><b>' + (STATE.mYear ? STATE.mYear + ' total' : 'All months') + '</b></td>' +
            '<td class="num"><b>' + money(tot) + '</b></td><td class="num"><b>' + totN + '</b></td><td></td></tr>' +
          '</tbody></table></div>'
      : '<div class="empty">Nothing recorded' + (STATE.mYear ? ' in ' + STATE.mYear : '') + '.</div>') +
    '</div>';
}

/* Category and sub-category pickers. Spending first, then income, A to Z. */
function catPickers() {
  // A category goes under Spending if it has any spending, and under Income only
  // if it is income alone -- the odd credit typed Income under a spending
  // category (a friend paying back their share) must not list it twice.
  var groups = { Expense: {}, Income: {} };
  ["Expense", "Income"].forEach(function (typ) {
    DATA.txns.forEach(function (t) {
      if (!charted(t) || t.t !== typ || !t.c) return;
      if (typ === "Income" && groups.Expense[t.c]) return;
      var g = groups[typ]; (g[t.c] = g[t.c] || {})[t.s || ""] = 1;
    });
  });
  if (STATE.mCat && !groups.Expense[STATE.mCat] && !groups.Income[STATE.mCat]) { STATE.mCat = ""; STATE.mSub = ""; }
  function opts(g) {
    return Object.keys(g).sort().map(function (c) {
      return '<option value="' + esc(c) + '"' + (c === STATE.mCat ? ' selected' : '') + '>' + esc(c) + '</option>';
    }).join("");
  }
  var html = '<div class="f"><label for="m-cat">Show</label><select id="m-cat">' +
    '<option value="">Income vs expenses</option>' +
    '<optgroup label="Spending">' + opts(groups.Expense) + '</optgroup>' +
    '<optgroup label="Income">' + opts(groups.Income) + '</optgroup></select></div>';
  if (STATE.mCat) {
    var subs = Object.keys(groups.Expense[STATE.mCat] || groups.Income[STATE.mCat]).filter(Boolean).sort();
    if (STATE.mSub && subs.indexOf(STATE.mSub) < 0) STATE.mSub = "";
    html += '<div class="f"><label for="m-sub">Sub-category</label><select id="m-sub">' +
      '<option value="">All of ' + esc(STATE.mCat) + '</option>' +
      subs.map(function (x) { return '<option value="' + esc(x) + '"' + (x === STATE.mSub ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join("") +
      '</select></div>';
  }
  return html;
}

function renderMonthly() {
  var idx = monthsIndex(DATA.txns), keys = idx.keys, map = idx.map;
  var years = [];
  keys.forEach(function (k) { var y = k.slice(0, 4); if (years.indexOf(y) < 0) years.push(y); });
  if (STATE.mYear && years.indexOf(STATE.mYear) < 0) STATE.mYear = "";
  var shown = keys.filter(function (k) { return !STATE.mYear || k.slice(0, 4) === STATE.mYear; }).reverse();

  var oo = oneOffByMonth(), OO = !!STATE.mOneOff, totOO = 0;
  var tot = blankAgg();
  var body = shown.map(function (k) {
    var a = shownAgg(k, map[k], oo), open = !!STATE.mOpen[k], ns = net(a);
    tot.income += a.income; tot.expense += a.expense; tot.invest += a.invest;
    totOO += oo[k] ? oo[k].sum : 0;
    return '<tr class="tax-row" data-key="' + k + '" id="m-row-' + k + '" tabindex="0" role="button" aria-expanded="' + open + '">' +
        '<td style="white-space:nowrap"><span class="chev">' + (open ? '▾' : '▸') + '</span> <b>' + monthLabel(k) + '</b></td>' +
        '<td class="num">' + money(a.income) + '</td>' +
        '<td class="num">' + money(a.expense) + '</td>' +
        (OO ? '<td class="num">' + (oo[k] ? money(oo[k].sum) : '<span class="muted">—</span>') + '</td>' : '') +
        '<td class="num">' + signed(a.invest) + '</td>' +
        '<td class="num"><b class="' + (ns < 0 ? 'neg' : '') + '">' + signed(ns) + '</b></td>' +
        '<td class="num">' + (a.income > 0 ? (rate(a) * 100).toFixed(1) + '%' : '—') + '</td>' +
      '</tr>' +
      '<tr class="tax-detail"' + (open ? '' : ' hidden') + ' data-for="' + k + '"><td colspan="' + (OO ? 7 : 6) + '">' +
        (open ? monthDetail(k) : '') + '</td></tr>';
  }).join("");

  var yearOpts = '<option value="">All years</option>' + years.slice().reverse().map(function (y) {
    return '<option value="' + y + '"' + (y === STATE.mYear ? ' selected' : '') + '>' + y + '</option>';
  }).join("");

  var host = el("tab-monthly");
  var filters = '<div class="filters">' + catPickers() +
      (STATE.mCat ? '' : '<div class="f"><label for="m-oneoff">One-off costs</label><select id="m-oneoff">' +
        '<option value=""' + (OO ? '' : ' selected') + '>Included</option>' +
        '<option value="1"' + (OO ? ' selected' : '') + '>Set aside</option></select></div>') +
      '<div class="f"><label for="m-year">Year</label><select id="m-year">' + yearOpts + '</select></div>' +
    '</div>';
  host.innerHTML = filters + (STATE.mCat ? catMonthlyCard(keys) :
    '<div class="card"><h2>Income vs expenses</h2><p class="cap">' + (STATE.mYear || 'All years') +
      (OO ? '. Everyday expenses only: one-off costs are set aside' : '. All expenses, one-off costs included') +
      '. Tap a month to open it below.</p>' +
      '<div id="m-ie"></div></div>' +
    '<div class="card"><h2>Month by month</h2>' +
      '<p class="cap">Newest first. Net saved is income minus expenses minus new money invested. Tap a month for its detail.' +
        (OO ? ' <b>One-off costs are set aside</b>: Expenses and Net saved leave out moving costs, insurance premiums of ' +
          money(ONE_OFF_INSURANCE_MIN) + ' or more, and any other single expense of ' + money(ONE_OFF_MIN) +
          ' or more (rent and home-loan EMIs excepted). Open a month to see what was set aside.' : '') + '</p>' +
      '<div class="tbl-scroll"><table><thead><tr><th>Month</th><th class="num">Income</th><th class="num">' +
        (OO ? 'Everyday expenses' : 'Expenses') + '</th>' + (OO ? '<th class="num">One-off</th>' : '') +
        '<th class="num">Invested</th><th class="num">Net saved</th><th class="num">Savings rate</th></tr></thead>' +
      '<tbody>' + body +
        '<tr class="m-total"><td><b>' + (STATE.mYear ? STATE.mYear + ' total' : 'All months') + '</b></td>' +
          '<td class="num"><b>' + money(tot.income) + '</b></td><td class="num"><b>' + money(tot.expense) + '</b></td>' +
          (OO ? '<td class="num"><b>' + money(totOO) + '</b></td>' : '') +
          '<td class="num"><b>' + signed(tot.invest) + '</b></td><td class="num"><b>' + signed(net(tot)) + '</b></td>' +
          '<td class="num"><b>' + (tot.income > 0 ? (rate(tot) * 100).toFixed(1) + '%' : '—') + '</b></td></tr>' +
      '</tbody></table></div></div>');

  function wireDetail(scope) {
    scope.querySelectorAll(".m-txns").forEach(function (b) {
      b.addEventListener("click", function (e) {
        e.stopPropagation();
        STATE.tMonth = b.getAttribute("data-m"); STATE.tq = ""; STATE.tAcct = ""; STATE.tCat = STATE.mCat;
        STATE.tSub = STATE.mSub; STATE.tType = ""; STATE.tLimit = 200;
        switchTab("txns");
      });
    });
  }
  host.querySelectorAll("tr.tax-row").forEach(function (tr) {
    function toggle() {
      var k = tr.getAttribute("data-key"), seen = STATE.mCat ? STATE.mcOpen : STATE.mOpen, open = !seen[k];
      seen[k] = open;
      var d = host.querySelector('tr.tax-detail[data-for="' + k + '"]');
      if (open && !d.firstChild.innerHTML) { d.firstChild.innerHTML = STATE.mCat ? catMonthDetail(k) : monthDetail(k); wireDetail(d); }
      d.hidden = !open;
      tr.setAttribute("aria-expanded", open);
      tr.querySelector(".chev").textContent = open ? "▾" : "▸";
    }
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  });
  wireDetail(host);
  if (el("m-ie")) {
    var ik = shown.slice().reverse(), im = {};
    ik.forEach(function (k) { im[k] = shownAgg(k, map[k], oo); });
    // Set aside: the bars carry everyday spending only, so the chart visibly
    // drops the one-offs and rescales (Vinod: "the graph should change")
    chartIncomeExpense(el("m-ie"), ik, im, STATE.fitScale, {
      everyday: OO,
      rerender: renderMonthly,
      onPick: function (k) {
        STATE.mOpen[k] = true; renderMonthly();
        var r = el("m-row-" + k);
        if (r) r.scrollIntoView({ block: "start" });
      }
    });
  }
  if (el("m-cat-chart")) {
    var ck = keys.filter(function (k) { return !STATE.mYear || k.slice(0, 4) === STATE.mYear; });
    var cr = catRows(STATE.mCat, STATE.mSub), cv = {};
    cr.forEach(function (t) { var k = monthKey(t.d); cv[k] = (cv[k] || 0) + catAmt(t); });
    var firstK = Object.keys(cv).sort()[0];
    ck = ck.filter(function (k) { return firstK && k >= firstK; });
    chartSubTrend(el("m-cat-chart"), ck, ck.map(function (k) { return cv[k] || 0; }), STATE.mSub || STATE.mCat, function (k) {
      STATE.mcOpen[k] = true; renderMonthly();
      var r = host.querySelector('tr.tax-row[data-key="' + k + '"]');
      if (r) r.scrollIntoView({ block: "start" });
    });
  }
  el("m-year").addEventListener("change", function () { STATE.mYear = this.value; renderMonthly(); });
  if (el("m-oneoff")) el("m-oneoff").addEventListener("change", function () {
    STATE.mOneOff = !!this.value;
    try { localStorage.setItem("ft.mOneOff", STATE.mOneOff ? "1" : ""); } catch (e) { /* private mode */ }
    // opened months rebuild with or without their one-off box
    renderMonthly();
  });
  el("m-cat").addEventListener("change", function () { STATE.mCat = this.value; STATE.mSub = ""; STATE.mcOpen = {}; renderMonthly(); });
  if (el("m-sub")) el("m-sub").addEventListener("change", function () { STATE.mSub = this.value; STATE.mcOpen = {}; renderMonthly(); });
}

/* Overview tile -> Monthly tab, with that month open and scrolled to. */
function openMonth(k) {
  STATE.mOpen[k] = true; STATE.mCat = ""; STATE.mSub = "";
  if (STATE.mYear && STATE.mYear !== k.slice(0, 4)) STATE.mYear = "";
  switchTab("monthly");
  var r = el("m-row-" + k);
  if (r) r.scrollIntoView({ block: "start" });
}

/* =====================================================================
   6. Shell wiring
   ===================================================================== */

function switchTab(name) {
  STATE.tab = name;
  document.querySelectorAll("nav.tabs button").forEach(function (b) {
    b.setAttribute("aria-selected", String(b.dataset.tab === name));
  });
  ["overview", "monthly", "salary", "tax", "spending", "txns", "accounts", "assets", "bills", "insurance", "amma", "invest"].forEach(function (t) {
    el("tab-" + t).classList.toggle("hide", t !== name);
  });
  if (name === "overview") renderOverview();
  if (name === "monthly")  renderMonthly();
  if (name === "spending") renderSpending();
  if (name === "txns")     renderTxns();
  if (name === "accounts" || name === "assets") renderAssets();
  if (name === "bills")     renderBills();
  if (name === "insurance") renderInsurance();
  if (name === "salary")    renderSalary();
  if (name === "tax")       renderTax();
  if (name === "amma")      renderAmma();
  if (name === "invest")    renderInvest();
  window.scrollTo(0, 0);
}

/* Charts size themselves when drawn, so resizing a Mac window has to redraw
   them. Only when the window is, or was, wide: an iPad rotating between
   portrait and landscape never reaches 1400px and is left alone. Scroll
   position is kept, since switchTab jumps to the top. */
var lastWidth = window.innerWidth, resizeTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    var w = window.innerWidth;
    if (DATA && (w >= 1400 || lastWidth >= 1400) && w !== lastWidth) {
      var y = window.scrollY;
      switchTab(STATE.tab);
      window.scrollTo(0, y);
    }
    lastWidth = w;
  }, 200);
});

function boot(data, fromCache) {
  DATA = data;
  el("gate").classList.add("hide");
  el("app").classList.remove("hide");

  var gen = DATA.generated ? new Date(DATA.generated) : null;
  el("stamp").textContent = (fromCache ? "Offline copy · " : "") +
    (gen ? "Data to " + gen.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "");

  el("foot").textContent = DATA.txns.length + " transactions · " +
    monthLabel(monthKey(DATA.txns[0].d)) + " to " + monthLabel(monthKey(DATA.txns[DATA.txns.length - 1].d));

  switchTab(STATE.tab);
}

document.querySelectorAll("nav.tabs button").forEach(function (b) {
  b.addEventListener("click", function () { switchTab(b.dataset.tab); });
});

/* Refresh used to reload only the data, so a new version of the app itself (a
   renamed or added tab) never arrived on a device that stayed open. It now asks
   the server which build is current first, and if that is not the one running,
   drops the saved app copy and reloads the page before anything else. */
function newerAppAvailable() {
  return fetch("sw.js", { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; })
    .then(function (t) {
      var m = t.match(/var CACHE = "([^"]+)"/);
      return !!(m && m[1] !== APP_BUILD);
    }).catch(function () { return false; });
}

function reloadApp() {
  var steps = [];
  if (window.caches) steps.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
  if (navigator.serviceWorker) steps.push(navigator.serviceWorker.getRegistration().then(function (r) { return r && r.update(); }));
  Promise.all(steps).catch(function () {}).then(function () { location.reload(); });
}

el("refresh").addEventListener("click", function () {
  var owner = localStorage.getItem(LS.owner), repo = localStorage.getItem(LS.repo), token = localStorage.getItem(LS.token);
  var btn = this; btn.textContent = "Refreshing…";
  newerAppAvailable().then(function (newer) {
    if (newer || !owner) { reloadApp(); return; }
    return fetchGitHub(owner, repo, token).then(function (d) {
      cacheSave(d); boot(d, false); btn.textContent = "Refresh";
    });
  }).catch(function (e) {
    btn.textContent = "Refresh"; alert(e.message);
  });
});

el("signout").addEventListener("click", function () {
  if (!confirm("Remove the saved key and cached data from this device?")) return;
  [LS.owner, LS.repo, LS.token, LS.cache].forEach(function (k) { localStorage.removeItem(k); });
  location.reload();
});

function gateError(msg) {
  var e = el("gate-err"); e.textContent = msg; e.classList.remove("hide");
}

el("g-go").addEventListener("click", function () {
  var owner = el("g-owner").value.trim();
  var repo  = el("g-repo").value.trim();
  var token = el("g-token").value.trim();
  if (!owner || !repo || !token) { gateError("Fill in all three fields."); return; }

  var btn = this; btn.disabled = true; btn.textContent = "Checking…";
  el("gate-err").classList.add("hide");

  fetchGitHub(owner, repo, token).then(function (d) {
    localStorage.setItem(LS.owner, owner);
    localStorage.setItem(LS.repo, repo);
    localStorage.setItem(LS.token, token);
    cacheSave(d);
    boot(d, false);
  }).catch(function (e) {
    gateError(e.message);
    btn.disabled = false; btn.textContent = "Unlock";
  });
});

el("g-token").addEventListener("keydown", function (e) { if (e.key === "Enter") el("g-go").click(); });

/* Startup: local file (development) -> GitHub (saved key) -> offline cache -> unlock screen. */
(function start() {
  fetchLocal().then(function (d) {
    boot(d, false);
  }).catch(function () {
    var owner = localStorage.getItem(LS.owner);
    var repo = localStorage.getItem(LS.repo);
    var token = localStorage.getItem(LS.token);
    if (owner && repo && token) {
      fetchGitHub(owner, repo, token).then(function (d) {
        cacheSave(d); boot(d, false);
      }).catch(function (err) {
        var c = cacheLoad();
        if (c) { boot(c, true); }
        else { el("g-owner").value = owner; el("g-repo").value = repo; gateError(err.message); }
      });
    }
  });
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    // updateViaCache "none": always fetch sw.js itself fresh when checking for a new version
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(function () { /* offline support is optional */ });
    // opening the app also checks, so a new version needs no Refresh tap at all
    // at most once a minute: if the two build strings were ever left out of step,
    // this would otherwise reload for ever
    newerAppAvailable().then(function (newer) {
      var last = 0;
      try { last = +sessionStorage.getItem("ft.appReload") || 0; } catch (e) {}
      if (!newer || Date.now() - last < 60000) return;
      try { sessionStorage.setItem("ft.appReload", String(Date.now())); } catch (e) {}
      reloadApp();
    });
  });
}
</script>
