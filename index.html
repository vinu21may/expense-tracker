         account, not a rise in what the holding is worth. */
      '<td class="num">' + (i.interest
        ? '<b class="up">+' + money(i.interest) + '</b>' +
          '<div class="muted" style="font-size:12px">interest received' +
          (i.gain ? ' · ' + (up ? "+" : "") + money(i.gain) + ' value' : '') + '</div>'
        : '<b class="' + (up ? "up" : "down") + '">' + (up ? "+" : "") + money(i.gain) + '</b>' +
          '<div class="muted" style="font-size:12px">' + (up ? "+" : "") + i.gainPct.toFixed(1) + '%</div>') +
      '</td>' +
      '<td>' + (i.matures ? dayLabel(i.matures) + " " + i.matures.slice(0, 4) : "—") + '</td>' +
    '</tr>';
  }).join("") : "";

  // Fixed deposits at principal rather than maturity value, so the total is
  // money actually put in rather than money hoped for.
  //
  // Savings balances replaced "goals set aside" here. Goal money is not a
  // separate pot -- it sits in an account already counted, so adding it
  // double-counted. A savings balance is real money that is genuinely yours.
  //
  // Only STATED balances count. A balance cannot be derived from opening
  // balance plus ledger movement: for HDFC-3245 that arithmetic gives 7,04,025
  // against a real 5,79,797, because the ledger carries entries that never
  // touched the bank (cash, opening balances, the net-share row of a split
  // bill). An account with no stated balance is left out of the total and
  // called out below, rather than being guessed at.
  var savingsAccts = banks.map(function (a) {
    var stated = (a.balance !== null && a.balance !== undefined);
    if (!stated) return { name: a.name, known: false, value: 0 };
    var since = movementSince(a.name, a.balanceAsOf);
    return { name: a.name, known: true, value: a.balance + since.in - since.out };
  });
  var savingsTotal = savingsAccts.reduce(function (s, a) { return s + a.value; }, 0);
  var savingsMissing = savingsAccts.filter(function (a) { return !a.known; });
  // Savings-account cash is shown on the Cash in Bank tab, not counted here:
  // Total invested is money put into FDs and holdings (Vinod, 29 Sep 2026).
  var totalInvested = fdTotal + invValue;

  var emiP = activeEmis.reduce(function (s, e) { return s + e.balP; }, 0);
  var emiI = activeEmis.reduce(function (s, e) { return s + e.balI; }, 0);

  /* The monthly instalment per loan.
     The statement's Loan Summary gives balances and tenure but never the
     instalment itself, so it is read off the card postings: each month a loan
     charges one "OFFUS EMI,PRIN" and one "OFFUS EMI,INT" line carrying its loan
     number, and the two together are that month's EMI. Take the latest month
     posted, since the instalment changes as a loan is part-prepaid. */
  var emiMonthly = {};
  (function () {
    var seen = {};
    DATA.cc.forEach(function (c) {
      // the loan number is split by a stray space in some statement layouts
      var m = /OFFUSEMI,(?:PRIN|INT)[A-Z]*:?\d*,(\d+)\(Ref#/.exec(String(c.ds).replace(/\s+/g, ""));
      if (!m) return;
      var loan = m[1].replace(/^0+/, "");
      if (!seen[loan] || c.d > seen[loan]) { seen[loan] = c.d; emiMonthly[loan] = 0; }
      if (c.d === seen[loan]) emiMonthly[loan] += c.amt;
    });
  })();

  var emiHtml = activeEmis.length ? activeEmis.map(function (e) {
    var monthly = emiMonthly[String(e.loanNo).replace(/^0+/, "")];
    return '<tr>' +
      '<td><b>' + esc(e.type) + '</b><div class="muted" style="font-size:12px">Card ' + esc(e.card) + " · " + esc(e.loanNo) + '</div></td>' +
      '<td class="num">' + money(e.amount) + '</td>' +
      '<td class="num">' + (monthly ? '<b>' + money(monthly) + '</b>' : '<span class="muted">—</span>') + '</td>' +
      '<td class="num">' + money(e.balP) + '</td>' +
      '<td class="num">' + money(e.balI) + '</td>' +
      '<td>' + esc(e.balT) + '<div class="muted" style="font-size:12px">of ' + esc(e.tenure) + " at " + esc(e.rate) + '</div></td>' +
    '</tr>';
  }).join("") : "";

  /* Accounts: money in the bank and what is owed on the cards (card EMI loans
     are card debt, so they sit here too). Assets: what has been put away --
     FDs, investments, goals. Both tabs are drawn from the one set of figures
     above, so they can never disagree. */
  var cardsDue = cards.filter(function (a) { return a.due !== null && a.due !== undefined; });
  var dueTotal = cardsDue.reduce(function (s, a) { return s + a.due; }, 0);

  el("tab-accounts").innerHTML =
    '<div class="card"><div class="total">' +
      '<div class="headline"><div class="lbl">Cash in bank accounts</div>' +
        '<div class="val">' + money(savingsTotal) + '</div></div>' +
      '<div class="parts">' +
        '<div class="part"><div class="p-lbl">Credit cards to pay</div>' +
          '<div class="p-val">' + money(dueTotal) + '</div></div>' +
        '<div class="part"><div class="p-lbl">Card EMI loans left</div>' +
          '<div class="p-val">' + money(emiP + emiI) + '</div></div>' +
        '<div class="part"><div class="p-lbl">Cash after card bills</div>' +
          '<div class="p-val">' + money(savingsTotal - dueTotal) + '</div></div>' +
      '</div>' +
    '</div>' +
    '<p class="cap" style="margin:14px 0 0">Bank balances as you last recorded them, adjusted for anything the ' +
      'ledger has seen since; card amounts from the latest statements' +
      (cards.length > cardsDue.length ? ' (' + (cards.length - cardsDue.length) + ' card' +
        (cards.length - cardsDue.length > 1 ? 's have' : ' has') + ' no statement amount yet)' : '') + '.' +
      (savingsMissing.length
        ? ' <b>' + savingsMissing.map(function (a) { return esc(a.name); }).join(" and ") +
          (savingsMissing.length > 1 ? ' have ' : ' has ') +
          'no balance recorded yet, so ' + (savingsMissing.length > 1 ? 'they are' : 'it is') +
          ' not in this total.</b>'
        : '') +
      '</p>' +
    '</div>' +

    '<div class="card"><h2>Bank accounts</h2>' +
      '<p class="cap">' + (anyBalance
        ? 'Balance as you stated it, plus everything recorded since, giving the balance now.'
        : 'No balances have been entered yet. Add <b>Current Balance</b> and <b>Balance As Of</b> ' +
          'columns to the Account Details sheet and they will appear here.') + '</p>' +
      '<div class="tbl-scroll"><table><thead><tr><th>Account</th>' +
      '<th class="num">Stated balance</th><th class="num">Movement since</th>' +
      '<th class="num">Balance now</th><th class="num">Last txn</th></tr></thead>' +
      '<tbody>' + bankHtml + '</tbody></table></div></div>' +

    '<div class="card"><h2>Credit cards</h2>' +
      '<p class="cap">Amount due comes from your card statement. Each card purchase is also in ' +
      'the ledger: on Transactions, pick the card in the Account filter to see them. ' +
      DATA.cc.length + ' card transactions on file.</p>' +
      '<div class="tbl-scroll"><table><thead><tr><th>Card</th>' +
      '<th class="num">Amount due</th><th class="num">Minimum due</th>' +
      '<th class="num">Statement</th><th class="num">Due date</th>' +
      '<th class="num">EMI outstanding</th></tr></thead>' +
      '<tbody>' + cardHtml + '</tbody></table></div></div>' +

    '<div class="card"><h2>Credit card EMI loans</h2>' +
      '<p class="cap">Latest statement position for each loan. ' + money(emiP) + ' principal plus ' + money(emiI) + ' interest still to pay.</p>' +
      (emiHtml
        ? '<div class="tbl-scroll"><table><thead><tr><th>Loan</th><th class="num">Original</th><th class="num">Monthly EMI</th><th class="num">Principal left</th><th class="num">Interest left</th><th>Remaining</th></tr></thead><tbody>' + emiHtml + '</tbody></table></div>'
        : '<div class="empty">No active EMI loans.</div>') +
    '</div>';

  /* What each holding pays if cashed in today, and at maturity, with the
     taxable part of each. Worked out in the workbook's Exit Values sheet, which
     states its reasoning per holding. A fixed deposit's early-exit figure
     changes daily, so it is recomputed here from its terms: interest for the
     days run at the contract rate less the usual 1-point penalty -- an upper
     bound, since the bank uses its lower short-period rate. */
  var FD_PENALTY = 1;
  var exits = (DATA.exitValues || []).map(function (x) {
    var y = {};
    for (var k in x) y[k] = x[k];
    if (x.rate && x.start && x.principal) {
      var days = Math.max(0, Math.round((new Date(today) - new Date(x.start)) / 86400000));
      var early = x.principal * (x.rate - FD_PENALTY) / 100 * days / 365;
      y.today = Math.round(x.principal + early);
      y.todayTaxable = Math.round(early);
      y.todayWhy = "Breaking it early pays interest only for the " + days + " days it has run, at the " +
        "shorter-period rate less a " + FD_PENALTY + "% penalty. Shown at " + (x.rate - FD_PENALTY).toFixed(2) +
        "%, so this is the most you would get.";
    }
    return y;
  });
  /* Tax at the rate the workbook states (its slab plus cess); the code names
     no rate of its own. Without it, only taxable amounts are shown. */
  var tx = DATA.exitTax || null;
  var taxMult = tx ? tx.slab / 100 * (1 + tx.cess / 100) : null;
  var taxLbl = tx ? tx.slab + "% slab + " + tx.cess + "% cess" : "";
  function taxOn(v) { return (taxMult === null || v === null || v === undefined) ? null : Math.round(v * taxMult); }
  var nowTotal = exits.reduce(function (t, x) { return t + (x.today || 0); }, 0);
  var nowTax = exits.reduce(function (t, x) { return t + (x.todayTaxable || 0); }, 0);
  var nowTaxDue = taxOn(nowTax);
  var holdTaxDue = taxOn(exits.reduce(function (t, x) {
    return t + (x.maturityTaxable || 0) + (x.beforeTaxable || 0);
  }, 0));
  var locked = exits.filter(function (x) { return x.today === null; });
  var lockedTotal = locked.reduce(function (t, x) { return t + (x.book || 0); }, 0);

  function exitBox(label, value, note, taxable, why, when, before) {
    var known = !(taxable === null || taxable === undefined);
    return '<div class="exit-box"><div class="lbl">' + label + (when ? ' · ' + esc(when) : '') + '</div>' +
      (value !== null && value !== undefined
        ? '<div class="v">' + money(value) + '</div>' +
          '<div class="t">Taxable: <b>' + (known ? money(taxable) : '<span class="muted">not known</span>') + '</b>' +
            (known && taxMult !== null ? ' · tax <b>' + money(taxOn(taxable)) + '</b>' : '') + '</div>' +
          (before ? '<div class="t">Plus ' + money(before) + ' taxable before then · tax <b>' +
                    money(taxOn(before)) + '</b></div>' : '')
        : '<div class="v muted">' + esc(note || "—") + '</div>') +
      '<div class="why">' + esc(why) + '</div></div>';
  }
  var exitHtml = exits.map(function (x) {
    return '<div class="exit"><div class="exit-head"><b>' + esc(x.name) + '</b>' +
        '<span class="muted" style="font-size:12.5px">' + esc(x.kind) + ' · book value ' + money(x.book) + '</span></div>' +
      '<div class="exit-pair">' +
        exitBox("If cashed in today", x.today, x.todayNote, x.todayTaxable, x.todayWhy, "") +
        exitBox("At maturity", x.maturity, x.maturityNote, x.maturityTaxable, x.maturityWhy, x.matures,
                x.beforeTaxable) +
      '</div>' +
      '<div class="tax"><b>Tax:</b> ' + esc(x.tax) + '</div></div>';
  }).join("");

  el("tab-assets").innerHTML =
    '<div class="card"><div class="total">' +
      '<div class="headline"><div class="lbl">Total invested</div>' +
        '<div class="val">' + money(totalInvested) + '</div></div>' +
      '<div class="parts">' +
        '<div class="part"><div class="p-lbl">Fixed deposits</div>' +
          '<div class="p-val">' + money(fdTotal) + '</div></div>' +
        '<div class="part"><div class="p-lbl">Investments</div>' +
          '<div class="p-val">' + money(invValue) + '</div></div>' +
      '</div>' +
    '</div>' +
    '<p class="cap" style="margin:14px 0 0">Fixed deposits at principal and investments at their last stated value. ' +
      'Cash in savings accounts is not counted here; it is on the Cash in Bank tab.</p>' +
    '</div>' +

    (exits.length
      ? '<div class="card"><h2>Cash in today, or hold to maturity</h2>' +
          '<p class="cap">What each holding would pay if you cashed it in today, and what it pays at ' +
          'maturity, with the part that counts as taxable income. Estimates to plan with, not tax advice.' +
          (exits[0].asOf ? ' Worked out on ' + esc(exits[0].asOf.split("-").reverse().join("/")) +
            '; fixed deposits are recalculated each day.' : '') + '</p>' +
          '<div class="grid k4" style="margin-bottom:6px">' +
            '<div class="exit-box"><div class="lbl">You could get today</div><div class="v">' + money(nowTotal) + '</div>' +
              '<div class="t">of which taxable ' + money(nowTax) + '</div></div>' +
            (taxMult !== null
              ? '<div class="exit-box"><div class="lbl">Tax if cashed in today</div><div class="v">' + money(nowTaxDue) + '</div>' +
                  '<div class="t">at ' + esc(taxLbl) + '</div></div>'
              : '') +
            '<div class="exit-box"><div class="lbl">Locked until maturity</div><div class="v">' + money(lockedTotal) + '</div>' +
              '<div class="t">' + locked.map(function (x) { return esc(x.name.split(" - ")[0]); }).join(", ") + '</div></div>' +
            (taxMult !== null
              ? '<div class="exit-box"><div class="lbl">Tax if all held to maturity</div><div class="v">' + money(holdTaxDue) + '</div>' +
                  '<div class="t">spread over the years it falls due; holdings not yet known excluded</div></div>'
              : '') +
          '</div>' +
          exitHtml +
        '</div>'
      : '') +

    '<div class="grid k4" style="margin-bottom:16px">' +
      '<div class="tile"><div class="lbl">In fixed deposits</div><div class="val">' + money(fdTotal) + '</div>' +
        '<div class="sub">' + DATA.fds.length + ' deposits · ' + money(fdInt) + ' interest due</div></div>' +
      '<div class="tile"><div class="lbl">Investments value</div><div class="val">' + money(invValue) + '</div>' +
        '<div class="sub">' + (invs.length
          ? '<span class="' + (invGain >= 0 ? "up" : "down") + '">' + (invGain >= 0 ? "+" : "") + money(invGain) + '</span> on ' + money(invCost)
          : 'none tracked') + '</div></div>' +
      '<div class="tile"><div class="lbl">Invested in holdings</div><div class="val">' + money(invCost) + '</div>' +
        '<div class="sub">' + invs.length + ' holdings</div></div>' +
      '<div class="tile"><div class="lbl">Goals progress</div><div class="val">' +
        (DATA.goals.length
          ? (DATA.goals.reduce(function (s, g) { return s + g.saved; }, 0) /
             DATA.goals.reduce(function (s, g) { return s + g.target; }, 0) * 100).toFixed(0) + "%"
          : "—") + '</div>' +
        '<div class="sub">' + DATA.goals.length + ' goals tracked</div></div>' +
    '</div>' +

    '<div class="card"><h2>Fixed deposits</h2><p class="cap">' + money(fdTotal) + ' invested.</p>' +
      (fdHtml
        ? '<div class="tbl-scroll"><table><thead><tr><th>FD</th><th class="num">Principal</th><th class="num">At maturity</th><th>Matures</th><th>Status</th></tr></thead><tbody>' + fdHtml + '</tbody></table></div>'
        : '<div class="empty">No fixed deposits.</div>') +
    '</div>' +

    '<div class="card"><h2>Investments</h2>' +
      '<p class="cap">Market-linked holdings, valued at a date rather than promised at maturity — ' +
      'the value moves, so these figures are only as current as the statement they came from.</p>' +
      (invHtml
        ? '<div class="tbl-scroll"><table><thead><tr><th>Holding</th><th class="num">Invested</th>' +
          '<th class="num">Value now</th><th class="num">Gain</th><th>Matures</th></tr></thead>' +
          '<tbody>' + invHtml + '</tbody></table></div>'
        : '<div class="empty">No investments tracked.</div>') +
    '</div>' +

    '<div class="card"><h2>Savings goals</h2><p class="cap">From the Savings Goals sheet.</p>' + goalHtml + '</div>';
}

/* The next premium date for a policy, and the days until it. A dated renewal
   is used as is. Otherwise the renewal cell describes a rhythm: "24th monthly"
   (the next 24th) or "21 Jan / 21 Jul" (whichever of those comes next). Text
   like "From issue date" has no date yet and returns null. */
function nextPremium(p, today) {
  var t = new Date(today + "T00:00:00");
  function out(d, amount, every) {
    var iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
              String(d.getDate()).padStart(2, "0");
    return { date: iso, days: Math.round((d - t) / 86400000), amount: amount, every: every };
  }
  if (p.renewal) return out(new Date(p.renewal + "T00:00:00"), p.premium, "");
  var txt = p.renewalText || "";
  var m = txt.match(/(\d{1,2})(?:st|nd|rd|th)?\s+monthly/i);
  if (m) {
    var d = new Date(t.getFullYear(), t.getMonth(), +m[1]);
    if (d < t) d = new Date(t.getFullYear(), t.getMonth() + 1, +m[1]);
    return out(d, p.premium / 12, "monthly");
  }
  var dates = [], re = /(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/gi, x;
  while ((x = re.exec(txt))) dates.push([+x[1], MONTH_NAMES.indexOf(x[2].slice(0, 1).toUpperCase() + x[2].slice(1, 3).toLowerCase())]);
  if (dates.length) {
    var best = null;
    dates.forEach(function (dm) {
      var c = new Date(t.getFullYear(), dm[1], dm[0]);
      if (c < t) c = new Date(t.getFullYear() + 1, dm[1], dm[0]);
      if (!best || c < best) best = c;
    });
    return out(best, p.premium / dates.length,
               dates.length === 2 ? "half-yearly" : dates.length === 4 ? "quarterly" : "");
  }
  return null;
}

function renderInsurance() {
  var today = new Date().toISOString().slice(0, 10);

  // Insurance is cover, not capital: it stays out of every asset total below.
  // Older data.json files predate the Insurance Policies sheet.
  var pols = (DATA.insurance || []).slice().sort(function (a, b) {
    // soonest real renewal first; the ones with no renewal date sink to the end
    if (!a.renewal && !b.renewal) return a.name.localeCompare(b.name);
    if (!a.renewal) return 1;
    if (!b.renewal) return -1;
    return a.renewal < b.renewal ? -1 : a.renewal > b.renewal ? 1 : 0;
  });
  var polPrem = pols.reduce(function (s, p) { return s + p.premium; }, 0);
  pols.forEach(function (p) { p.next = nextPremium(p, today); });
  // soonest premium first; policies with no date yet (awaiting issue) go last
  pols.sort(function (a, b) {
    if (!a.next && !b.next) return a.name.localeCompare(b.name);
    if (!a.next) return 1;
    if (!b.next) return -1;
    return a.next.days - b.next.days;
  });
  var polSoon = pols.filter(function (p) { return p.next && p.next.days <= 45; }).length;
  function longDate(d) { return dayLabel(d) + " " + d.slice(0, 4); }

  /* Health, Life and Vehicle each get their own box.

     Mapped from the sheet's Type explicitly rather than by guessing from the
     text, and anything unrecognised falls through to "Other cover" so a policy
     type added later shows up somewhere instead of silently vanishing.

     Personal Accident sits under Vehicle: it is the compulsory owner-driver
     cover that the car policy deliberately omits because this standalone one
     exists, and the two renew on the same day. */
  var GROUPS = [
    { key: "health",  title: "Health",  kinds: ["Health"] },
    { key: "life",    title: "Life",    kinds: ["Life", "Life (ULIP)"] },
    { key: "vehicle", title: "Motor",   kinds: ["Motor", "Personal Accident"] },
    { key: "other",   title: "Others",  kinds: [] }
  ];

  function groupOf(kind) {
    for (var i = 0; i < GROUPS.length; i++) {
      if (GROUPS[i].kinds.indexOf(kind) >= 0) return GROUPS[i].key;
    }
    // any "Life (...)" variant -- ULIP, savings, term -- is life cover
    if (/^life\b/i.test(kind || "")) return "life";
    return "other";
  }

  function polBlock(p) {
    var n = p.next;
    var status = !n
      ? '<span class="pill">no date yet</span>'
      : n.days < 0 ? '<span class="pill bad">overdue ' + (-n.days) + ' days</span>'
      : '<span class="pill' + (n.days <= 45 ? " warn" : "") + '">' +
          (n.days === 0 ? 'due today' : n.days + (n.days === 1 ? ' day' : ' days')) + '</span>';

    // a policy that renews on a date has a period with two ends; one that just
    // runs on has a start and a rhythm, so say the rhythm rather than invent an end
    var period = p.renewal && p.start ? longDate(p.start) + " → " + longDate(p.renewal)
      : p.renewal ? "to " + longDate(p.renewal)
      : p.start ? "from " + longDate(p.start) +
                  (p.renewalText ? " · renews " + esc(p.renewalText) : "")
      : esc(p.renewalText || "—");

    function field(label, value) {
      return '<div><dt>' + label + '</dt><dd>' + value + '</dd></div>';
    }

    return '<div class="pol">' +
      '<div class="pol-head"><span class="p-name">' + esc(p.name) + '</span>' + status +
        '<span class="p-meta">' + esc(p.kind) +
        (p.insurer ? " · " + esc(p.insurer) : "") + '</span></div>' +
      '<dl class="pol-fields">' +
        field("Covers", p.covers ? esc(p.covers) : '<span class="muted">not stated</span>') +
        field("Sum Insured", p.sum === null
          ? '<span class="muted">not stated</span>' : '<b>' + money(p.sum) + '</b>') +
        field("Annual Premium", money(p.premium) +
          (p.paidFrom ? ' <span class="muted">· ' + esc(p.paidFrom) + '</span>' : "")) +
        field("Next Premium", n
          ? '<b>' + longDate(n.date) + '</b> <span class="muted">· ' + money(n.amount) +
            (n.every ? ' (' + n.every + ')' : '') + '</span>'
          : '<span class="muted">' + esc(p.renewalText || "not stated") + '</span>') +
        field("Cover Period", period) +
      '</dl>' +
    '</div>';
  }

  var expired = pols.filter(function (p) {
    return p.renewal && p.renewal < today;
  }).length;

  el("tab-insurance").innerHTML =
    '<div class="grid k5" style="margin-bottom:16px">' +
      '<div class="tile"><div class="lbl">Policies in force</div><div class="val">' + pols.length + '</div>' +
        '<div class="sub">' + (expired ? expired + ' expired' : 'none expired') + '</div></div>' +
      '<div class="tile"><div class="lbl">Premium a year</div><div class="val">' + money(polPrem) + '</div>' +
        '<div class="sub">across all policies</div></div>' +
      '<div class="tile"><div class="lbl">Premiums due soon</div><div class="val">' + polSoon + '</div>' +
        '<div class="sub">within 45 days</div></div>' +
    '</div>' +

    '<p class="cap" style="margin:0 0 16px">What is covered and when it lapses. This is cover, not money you ' +
      'hold, so it counts towards no asset total — and the premiums are already in your spending, so nothing ' +
      'here is a second record of them.</p>' +

    // one box per kind of cover; a group with no policies is left out entirely
    (pols.length
      ? GROUPS.map(function (g) {
          var mine = pols.filter(function (p) { return groupOf(p.kind) === g.key; });
          if (!mine.length) return "";
          var prem = mine.reduce(function (s, p) { return s + p.premium; }, 0);
          var soon = mine.filter(function (p) { return p.next && p.next.days <= 45; }).length;
          var first = mine[0].next;          // mine is already soonest-first
          return '<div class="card"><h2>' + g.title + '</h2>' +
            '<p class="cap">' + mine.length + (mine.length === 1 ? ' policy' : ' policies') +
              ' · ' + money(prem) + ' a year' +
              (first ? ' · next premium in <b>' + first.days + (first.days === 1 ? ' day' : ' days') + '</b>' : '') +
              (soon ? ' · <b>' + soon + ' due within 45 days</b>' : '') + '</p>' +
            mine.map(polBlock).join("") +
          '</div>';
        }).join("")
      : '<div class="card"><h2>Insurance cover</h2>' +
        '<div class="empty">No policies tracked.</div></div>');
}

/* =====================================================================
   Salary -- every payslip found in email, from the Salary History sheet.

   Each slip's gross is split (in the workbook) into regular pay + bonus +
   arrears + one-offs. Pay rises are measured on REGULAR pay only, so a bonus
   month or a month of back pay never reads as a raise. Older data.json files
   have no salary array, hence the || [].
   ===================================================================== */

/* Employers keep a fixed colour wherever they appear, handed out in the order
   they employed you. The slot order keeps the two warm hues (yellow, orange)
   apart, since consecutive employers sit side by side in the chart. Names and
   notes come from data.json (salaryMeta) -- this code is public. */
var EMPLOYER_SLOTS = ["var(--series-4)", "var(--series-1)", "var(--series-3)", "var(--series-2)",
                      "#e87ba4", "#008300", "#4a3aa7"];

function employerStyle(company, cache, meta) {
  if (!cache[company]) {
    var used = Object.keys(cache).length;
    cache[company] = { short: (meta.short && meta.short[company]) || company.split(" (")[0],
                       colour: EMPLOYER_SLOTS[used % EMPLOYER_SLOTS.length] };
  }
  return cache[company];
}

/* Whole percent for the chart's label row, where bars are too narrow for a
   decimal; under 1% keeps one decimal so a small rise never reads as 0%.
   The tooltip keeps pctLabel's detail. */
function pctShort(p) {
  var v = Math.abs(p * 100);
  return (p >= 0 ? "+" : "−") + (v < 1 ? v.toFixed(1) : v.toFixed(0)) + "%";
}

function pctLabel(p) {
  var v = Math.abs(p * 100);
  if (v < 0.05) return "0%";
  // whole numbers from 10% up keep adjacent labels from running into each other
  return (p >= 0 ? "+" : "−") + (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + "%";
}

/* A round tick step (₹10k, ₹20k, ₹25k, ₹50k, ₹1L ...) giving at most five
   gridlines, so the axis reads ₹50k / ₹1L / ₹1.5L rather than ₹63k / ₹1.3L. */
function roundTicks(max) {
  var steps = [1, 2, 2.5, 5];
  for (var mag = 1000; ; mag *= 10) {
    for (var i = 0; i < steps.length; i++) {
      var st = steps[i] * mag;
      if (max / st <= 5) return { step: st, top: Math.max(st, Math.ceil(max / st) * st) };
    }
  }
}

/* Average regular monthly pay per employer per year, each employer's bars
   grouped together, labelled with the change on the previous year. */
function chartPayRise(container, groups) {
  // offer-letter bars carry a single value and no % label, so they take less
  // width than payslip bars, leaving the payslip bars room for their labels
  var LETTER_W = 0.6, bars = 0;
  groups.forEach(function (g) { bars += g.years.length * (g.letter ? LETTER_W : 1); });
  var gapBands = 0.45;                          // space between employers, in bars
  var W = chartWidth(container), H = 326, PL = 62, PR = 12, PT = 24, PB = 82;
  var iw = W - PL - PR, ih = H - PT - PB;
  var band = iw / (bars + gapBands * (groups.length - 1));
  var bw = Math.max(6, Math.min(34, band - 8));
  var ticks = roundTicks(Math.max.apply(null, groups.map(function (g) {
    return Math.max.apply(null, g.years.map(function (y) { return y.avg; }));
  })));
  var top = ticks.top;

  var s = "";
  for (var v = 0; v <= top; v += ticks.step) {
    var gy = PT + ih - (v / top) * ih;
    s += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy +
         '" stroke="var(--grid)" stroke-width="1"/>' +
         '<text x="' + (PL - 9) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11.5" fill="var(--muted)">' +
         moneyShort(v) + '</text>';
  }

  var x = PL;
  // narrow bars: alternate the % labels between two heights so neighbours never touch
  groups.forEach(function (g, gi) {
    var gx0 = x, noInr = false;
    g.years.forEach(function (y, yi) {
      var bandHere = band * (g.letter ? LETTER_W : 1);
      var bwHere = Math.min(bw, bandHere - 4);
      var bx = x + (bandHere - bwHere) / 2, h = (y.avg / top) * ih, by = PT + ih - h;
      if (y.avg > 0) s += '<path d="' + barUp(bx, by, bwHere, Math.max(h, 2), 2) + '" fill="' + g.colour + '"/>';
      if (y.letter) {
        // one figure from the offer letter: label it with its value; a job with no
        // rupee monthly figure gets one note across its group, after the loop
        if (y.avg > 0) {
          s += '<text x="' + (bx + bwHere / 2) + '" y="' + (by - 6) + '" text-anchor="middle" ' +
               'font-size="10" fill="var(--text-secondary)" font-variant-numeric="tabular-nums">' +
               moneyShort(y.avg) + '</text>';
        } else noInr = true;
      }
      // the change on the year before, in its own row under the year labels, so
      // steeply rising neighbours can never put two labels on top of each other
      if (!y.letter && y.change !== null && Math.abs(y.change) >= 0.0005) {
        s += '<text x="' + (x + band / 2) + '" y="' + (PT + ih + 30) + '" text-anchor="middle" font-size="9" ' +
             'font-weight="700" fill="var(--text-secondary)" font-variant-numeric="tabular-nums">' +
             pctShort(y.change) + '</text>';
      }
      s += '<text x="' + (x + bandHere / 2) + '" y="' + (PT + ih + 16) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' +
           "’" + String(y.y).slice(2) + '</text>';
      var tip = y.letter
        ? '<div class="t-title">' + esc(g.full || g.short) + ' · joined ' + y.y + '</div>' +
          '<div class="t-row">' + esc(y.role || "") + '</div>' +
          '<div class="t-row"><i class="swatch" style="background:' + g.colour + '"></i>Pay at joining<b>' +
            (y.avg > 0 ? money(y.avg) + '/mo' : 'no ₹ monthly figure') + '</b></div>' +
          '<div class="t-row muted" style="font-size:12px">' + esc(y.pay || "") + '</div>' +
          '<div class="t-row muted" style="font-size:12px">From the offer or appointment letter</div>'
        : '<div class="t-title">' + esc(g.short) + ' · ' + y.y + '</div>' +
        '<div class="t-row"><i class="swatch" style="background:' + g.colour + '"></i>Regular pay<b>' + money(y.avg) + '/mo</b></div>' +
        '<div class="t-row">Change on ' + (y.y - 1) + '<b>' + (y.change === null ? "first year here" : pctLabel(y.change)) + '</b></div>' +
        '<div class="t-row">Bonus in the year<b>' + (y.bonus ? money(y.bonus) : "none") + '</b></div>' +
        '<div class="t-row">Payslips<b>' + y.n + '</b></div>';
      s += '<rect class="hit" x="' + x + '" y="' + PT + '" width="' + bandHere + '" height="' + ih +
           '" data-tip="' + esc(tip) + '"/>';
      x += bandHere;
    });
    // employer name under its own bars, with a bracket showing the span; names
    // alternate between two rows so single-bar employers side by side never collide
    var mid = (gx0 + x) / 2, ny = PT + ih + (gi % 2 ? 72 : 56);
    if (noInr) {
      s += '<text x="' + mid + '" y="' + (PT + ih - 6) + '" text-anchor="middle" font-size="10" ' +
           'fill="var(--muted)">no ₹</text>';
    }
    s += '<line x1="' + (gx0 + 3) + '" y1="' + (PT + ih + 40) + '" x2="' + (x - 3) + '" y2="' + (PT + ih + 40) +
         '" stroke="' + g.colour + '" stroke-width="2" stroke-linecap="round"/>' +
         '<text x="' + mid + '" y="' + ny + '" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-secondary)">' +
         esc(g.short) + '</text>';
    x += band * gapBands;
  });
  s += '<line x1="' + PL + '" y1="' + (PT + ih) + '" x2="' + (W - PR) + '" y2="' + (PT + ih) +
       '" stroke="var(--baseline)" stroke-width="1"/>';

  container.innerHTML =
    '<div class="legend">' + groups.filter(function (g) { return !g.letter; }).map(function (g) {
      return '<span><i class="swatch" style="background:' + g.colour + '"></i>' + esc(g.short) + '</span>';
    }).join("") +
    (groups.some(function (g) { return g.letter; })
      ? '<span><i class="swatch" style="background:var(--muted)"></i>Pay at joining, from the offer letter</span>' : '') +
    '</div>' +
    '<div class="chartwrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H +
    '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Average regular monthly pay by year, per employer">' +
    s + '</svg></div>';
  var wrap = container.querySelector(".chartwrap");
  attachTip(wrap, wrap.querySelector("svg"));
}

/* One bar per bonus payout, coloured by employer, each labelled with its amount. */
function chartBonus(container, payouts, styles) {
  var W = chartWidth(container), H = 230, PL = 62, PR = 12, PT = 26, PB = 36;
  var iw = W - PL - PR, ih = H - PT - PB;
  var band = iw / payouts.length;
  var bw = Math.max(8, Math.min(46, band - 18));
  var ticks = roundTicks(Math.max.apply(null, payouts.map(function (p) { return p.bonus; })));
  var top = ticks.top;

  var s = "";
  for (var v = 0; v <= top; v += ticks.step) {
    var gy = PT + ih - (v / top) * ih;
    s += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy +
         '" stroke="var(--grid)" stroke-width="1"/>' +
         '<text x="' + (PL - 9) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11.5" fill="var(--muted)">' +
         moneyShort(v) + '</text>';
  }
  payouts.forEach(function (p, i) {
    var st = styles[p.company];
    var bx = PL + band * i + (band - bw) / 2, h = (p.bonus / top) * ih, by = PT + ih - h;
    s += '<path d="' + barUp(bx, by, bw, h, 4) + '" fill="' + st.colour + '"/>';
    s += '<text x="' + (bx + bw / 2) + '" y="' + (by - 7) + '" text-anchor="middle" font-size="11" font-weight="700" ' +
         'fill="var(--text-primary)" font-variant-numeric="tabular-nums">' + moneyShort(p.bonus) + '</text>';
    s += '<text x="' + (PL + band * i + band / 2) + '" y="' + (PT + ih + 16) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' +
         (p.extra ? p.m.slice(0, 4) + " †" : monthShort(p.m) + ' ’' + p.m.slice(2, 4)) + '</text>';
    s += '<text x="' + (PL + band * i + band / 2) + '" y="' + (PT + ih + 30) + '" text-anchor="middle" font-size="10.5" fill="var(--text-secondary)">' +
         esc(st.short) + '</text>';
    var tip = '<div class="t-title">' + esc(p.label || monthLabel(p.m)) + ' · ' + esc(st.short) + '</div>' +
      '<div class="t-row"><i class="swatch" style="background:' + st.colour + '"></i>Bonus<b>' + money(p.bonus) + '</b></div>' +
      (p.bonusNotes ? '<div class="t-row muted" style="font-size:12px">' + esc(p.bonusNotes) + '</div>' : '') +
      (p.extra ? '<div class="t-row muted" style="font-size:12px">No payslip on file for this month</div>'
               : '<div class="t-row">Gross that month<b>' + money(p.gross) + '</b></div>');
    s += '<rect class="hit" x="' + (PL + band * i) + '" y="' + PT + '" width="' + band + '" height="' + ih +
         '" data-tip="' + esc(tip) + '"/>';
  });
  s += '<line x1="' + PL + '" y1="' + (PT + ih) + '" x2="' + (W - PR) + '" y2="' + (PT + ih) +
       '" stroke="var(--baseline)" stroke-width="1"/>';

  var seen = {};
  container.innerHTML =
    '<div class="legend">' + payouts.filter(function (p) {
      return seen[p.company] ? false : (seen[p.company] = true);
    }).map(function (p) {
      return '<span><i class="swatch" style="background:' + styles[p.company].colour + '"></i>' +
             esc(styles[p.company].short) + '</span>';
    }).join("") + '</div>' +
    '<div class="chartwrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H +
    '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bonus payouts">' + s + '</svg></div>';
  var wrap = container.querySelector(".chartwrap");
  attachTip(wrap, wrap.querySelector("svg"));
}

function renderSalary() {
  var slips = (DATA.salary || []).slice().sort(function (a, b) { return a.m < b.m ? -1 : a.m > b.m ? 1 : 0; });
  var box = el("tab-salary");
  if (!slips.length) {
    box.innerHTML = '<div class="card"><h2>Salary</h2><div class="empty">No payslips in the spreadsheet yet.</div></div>';
    return;
  }
  var meta = DATA.salaryMeta || {}, notes = meta.notes || {};
  var styles = {};
  slips.forEach(function (p) { employerStyle(p.company, styles, meta); });
  function sum(rs, k) { return rs.reduce(function (t, r) { return t + (r[k] || 0); }, 0); }
  function span(rs) { return monthLabel(rs[0].m) + " – " + monthLabel(rs[rs.length - 1].m); }

  /* Bonuses known from a bonus statement or tax sheet, paid in a month whose
     slip is not on file. They count in every bonus figure, never in pay. */
  var extra = (DATA.salaryExtraBonus || []).map(function (b) {
    var mi = -1;
    MONTH_NAMES.forEach(function (n, i) { if (mi < 0 && b.label.indexOf(n) >= 0) mi = i; });
    employerStyle(b.company, styles, meta);
    return { company: b.company, m: b.year + "-" + String(mi < 0 ? 1 : mi + 1).padStart(2, "0"),
             label: b.label, bonus: b.bonus, bonusNotes: b.notes.split("; source")[0], extra: true };
  });
  function extraFor(company, year) {
    return extra.filter(function (b) {
      return b.company === company && (year === undefined || +b.m.slice(0, 4) === year);
    }).reduce(function (t, b) { return t + b.bonus; }, 0);
  }


  // employers in the order they employed you; a stint is consecutive slips
  var groups = [];
  slips.forEach(function (p) {
    var g = groups[groups.length - 1];
    if (!g || g.company !== p.company) {
      g = { company: p.company, short: styles[p.company].short, colour: styles[p.company].colour, slips: [] };
      groups.push(g);
    }
    g.slips.push(p);
  });
  groups.forEach(function (g) {
    var byYear = {};
    g.slips.forEach(function (p) { (byYear[p.m.slice(0, 4)] = byYear[p.m.slice(0, 4)] || []).push(p); });
    var prev = null;
    g.years = Object.keys(byYear).sort().map(function (y) {
      var rs = byYear[y], a = sum(rs, "regular") / rs.length;
      var row = { y: +y, avg: a, n: rs.length, bonus: sum(rs, "bonus") + extraFor(g.company, +y),
                  change: prev ? a / prev - 1 : null };
      prev = a;
      return row;
    });
  });

  var first = slips[0], last = slips[slips.length - 1];
  var payouts = slips.filter(function (p) { return p.bonus > 0; }).concat(extra)
    .sort(function (a, b) { return a.m < b.m ? -1 : a.m > b.m ? 1 : 0; });
  var oneOffs = slips.filter(function (p) { return p.oneOff > 0; });
  var bonusTotal = sum(payouts, "bonus");
  var cur = groups[groups.length - 1];

  var empRows = groups.map(function (g) {
    var n = g.slips.length;
    return '<tr><td><i class="swatch" style="background:' + g.colour + ';display:inline-block;margin-right:8px"></i>' + esc(g.company) + '</td>' +
      '<td>' + span(g.slips) + '</td><td class="num">' + n + '</td>' +
      '<td class="num">' + money(sum(g.slips, "gross") / n) + '</td>' +
      '<td class="num">' + money(sum(g.slips, "tax") / n) + '</td>' +
      '<td class="num">' + money(sum(g.slips, "net") / n) + '</td>' +
      '<td class="num">' + (sum(g.slips, "bonus") + extraFor(g.company)
        ? money(sum(g.slips, "bonus") + extraFor(g.company)) : '<span class="muted">none</span>') + '</td></tr>';
  }).join("");

  /* Every job, from offer and relieving letters. For employers with payslips,
     regular monthly pay at the first and last slip stands in for the
     letter's figure. */
  var career = DATA.salaryCareer || [];
  var careerRows = career.map(function (j) {
    // average regular pay in the first and last calendar year of slips: a
    // single slip can be a part-month or a set-up month, a year's average isn't
    var g = groups.filter(function (x) { return x.company === j.employer; })[0];
    var pay = g
      ? (j.monthly
          ? money(j.monthly) + ' at joining → ' + money(g.years[g.years.length - 1].avg) +
            '<div class="muted" style="font-size:12px">joining pay from the letter; then average regular monthly pay in ' +
              g.years[g.years.length - 1].y + ' from payslips</div>'
          : money(g.years[0].avg) + ' → ' + money(g.years[g.years.length - 1].avg) +
            '<div class="muted" style="font-size:12px">average regular monthly pay, ' + g.years[0].y + ' → ' +
              g.years[g.years.length - 1].y + ', from payslips</div>')
      : j.monthly
        ? money(j.monthly) + '<div class="muted" style="font-size:12px">' + esc(j.pay) + '</div>'
        : '<span class="muted">' + esc(j.pay) + '</span>';
    return '<tr><td><b>' + esc(j.employer) + '</b><div class="muted" style="font-size:12px">' + esc(j.role) + '</div></td>' +
      '<td style="white-space:nowrap">' + esc(j.from) + ' – ' + esc(j.to) + '</td>' +
      '<td class="desc">' + pay + '</td></tr>';
  }).join("");

  var slipRows = slips.slice().reverse().map(function (p) {
    var extra = [];
    if (p.bonus)   extra.push("bonus " + money(p.bonus));
    if (p.arrears) extra.push("arrears " + money(p.arrears));
    if (p.oneOff)  extra.push("one-off " + money(p.oneOff));
    if (p.rebuilt) extra.push("no slip on file — rebuilt from Form 16");
    return '<tr><td>' + monthLabel(p.m) + '</td><td>' + esc(styles[p.company].short) + '</td>' +
      '<td class="num">' + money(p.gross) + '</td><td class="num">' + money(p.tax) + '</td>' +
      '<td class="num">' + money(p.pf) + '</td><td class="num">' + money(p.ded) + '</td>' +
      '<td class="num"><b>' + money(p.net) + '</b></td>' +
      '<td class="muted" style="font-size:12.5px">' + extra.join(" · ") + '</td></tr>';
  }).join("");

  var oneOffRows = oneOffs.map(function (p) {
    return '<tr><td>' + monthLabel(p.m) + '</td><td>' + esc(styles[p.company].short) + '</td>' +
      '<td class="desc">' + esc(p.oneOffNotes || "") + '</td><td class="num">' + money(p.oneOff) + '</td></tr>';
  }).join("");

  box.innerHTML =
    '<div class="grid k4" style="margin-bottom:16px">' +
      '<div class="tile"><div class="lbl">Regular pay now</div><div class="val">' + money(last.regular) + '</div>' +
        '<div class="sub">a month, gross · ' + esc(styles[last.company].short) + ', ' + monthLabel(last.m) + '</div></div>' +
      '<div class="tile"><div class="lbl">Take-home now</div><div class="val">' + money(last.net) + '</div>' +
        '<div class="sub">after ' + money(last.ded) + ' deductions</div></div>' +
      '<div class="tile"><div class="lbl">Bonuses received</div><div class="val">' + money(bonusTotal) + '</div>' +
        '<div class="sub">' + payouts.length + ' payouts since ' + (payouts.length ? payouts[0].m.slice(0, 4) : "—") + '</div></div>' +
      '<div class="tile"><div class="lbl">Growth since ' + first.m.slice(0, 4) + '</div><div class="val">' +
        (last.regular / first.regular).toFixed(1) + '×</div>' +
        '<div class="sub">regular pay ' + moneyShort(first.regular) + ' → ' + moneyShort(last.regular) + ' a month</div></div>' +
    '</div>' +

    '<div class="card"><h2>Year-on-year pay rise</h2>' +
      '<p class="cap">Every job since you started. Coloured bars: average regular monthly pay each year from ' +
        'payslips; the % under each year is the change on the year before at the same employer (bonus, arrears and ' +
        'one-offs left out). Grey bars: pay at joining from the offer letter. Tap a bar for detail.</p>' +
      '<div id="sal-rise"></div>' +
      '<p class="cap" style="margin:12px 0 0">First and last years at a firm are part-years.' +
        (notes.rise ? ' ' + esc(notes.rise) : '') + '</p>' +
    '</div>' +

    '<div class="card"><h2>Bonuses</h2>' +
      '<p class="cap">Bonus lines on the payslips, one bar per payout.' +
        (notes.bonus ? ' ' + esc(notes.bonus) : '') + '</p>' +
      (payouts.length ? '<div id="sal-bonus"></div>' : '<div class="empty">No bonus lines on any slip.</div>') +
      (oneOffs.length
        ? '<h2 style="margin-top:22px">Other one-off payments</h2>' +
          '<p class="cap">Other one-off lines on the payslips, not counted as bonus.' +
            (notes.oneOff ? ' ' + esc(notes.oneOff) : '') +
            ' Back pay after a raise (arrears) is left out of both.</p>' +
          '<div class="tbl-scroll"><table><thead><tr><th>Month</th><th>Employer</th><th>What</th>' +
          '<th class="num">Amount</th></tr></thead><tbody>' + oneOffRows + '</tbody></table></div>'
        : '') +
    '</div>' +

    '<div class="card"><h2>By employer</h2>' +
      '<p class="cap">Averages per payslip. Months with no payslip on file are simply missing, not counted as zero.</p>' +
      '<div class="tbl-scroll"><table><thead><tr><th>Employer</th><th>Period</th><th class="num">Slips</th>' +
      '<th class="num">Avg gross</th><th class="num">Avg tax</th><th class="num">Avg take-home</th>' +
      '<th class="num">Bonus total</th></tr></thead><tbody>' + empRows + '</tbody></table></div>' +
    '</div>' +

    (career.length
      ? '<div class="card"><h2>Career since ' + esc(career[0].from.slice(-4)) + '</h2>' +
          '<p class="cap">Every job, from offer, appointment and relieving letters. Pay is as stated ' +
          'when you joined; where payslips exist, the average regular monthly pay in the first and last year.</p>' +
          '<div class="tbl-scroll"><table><thead><tr><th>Employer</th><th>Period</th><th>Pay</th></tr></thead>' +
          '<tbody>' + careerRows + '</tbody></table></div></div>'
      : '') +

    '<div class="card"><h2>Every payslip</h2>' +
      '<p class="cap">' + slips.length + ' slips, newest first.</p>' +
      '<div class="tbl-scroll"><table><thead><tr><th>Month</th><th>Employer</th><th class="num">Gross</th>' +
      '<th class="num">Income tax</th><th class="num">PF</th><th class="num">Deductions</th>' +
      '<th class="num">Take-home</th><th></th></tr></thead><tbody>' + slipRows + '</tbody></table></div>' +
    '</div>';

  /* The chart follows the whole career in date order: employers with payslips
     keep their year-by-year bars; the others show one grey bar, the joining
     pay from their offer letter (or a note where it isn't a rupee monthly). */
  var riseGroups = [], used = {};
  (DATA.salaryCareer || []).forEach(function (j) {
    var g = groups.filter(function (x) { return x.company === j.employer; })[0];
    if (g) {
      if (!used[g.company]) { riseGroups.push(g); used[g.company] = true; }
      return;
    }
    var yr = +(j.from.slice(-4)) || 0;
    var last = riseGroups[riseGroups.length - 1];
    var bar = { y: yr, avg: j.monthly || 0, n: 0, change: null, bonus: 0, letter: true, role: j.role, pay: j.pay };
    if (last && last.letter && last.company === j.employer) { last.years.push(bar); return; }
    // one word under a narrow grey bar (the tooltip carries the full name)
    riseGroups.push({ company: j.employer, short: j.employer.split(" (")[0].split(" ")[0], full: j.employer,
                      colour: "var(--muted)", letter: true, years: [bar] });
  });
  groups.forEach(function (g) { if (!used[g.company]) riseGroups.push(g); });
  chartPayRise(el("sal-rise"), riseGroups.length ? riseGroups : groups);
  if (payouts.length) chartBonus(el("sal-bonus"), payouts, styles);
}

/* Money fronted for Amma and repaid over the following months. Both legs are
   tagged Transfer / Amma Receivable in the spreadsheet and excluded from the
   charts, so they appear nowhere else in this app -- which is exactly why this
   tab exists: without it the arrangement is invisible. */
function renderAmma() {
  var rows = DATA.txns.filter(function (t) { return t.s === "Amma Receivable"; })
                      .slice()
                      .sort(function (a, b) { return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; });

  var paid   = rows.reduce(function (s, t) { return s + t.db; }, 0);
  var repaid = rows.reduce(function (s, t) { return s + t.cr; }, 0);
  var out    = paid - repaid;
  var owed   = out >= 0;

  var body = rows.length ? rows.map(function (t) {
    var isPaid = t.db > 0;
    return '<tr>' +
      '<td>' + dayLabel(t.d) + ' ' + t.d.slice(0, 4) + '</td>' +
      '<td>' + esc(t.ds) + (t.n ? '<div class="muted" style="font-size:12px">' + esc(t.n) + '</div>' : '') + '</td>' +
      '<td class="num">' + (isPaid ? money(t.db) : '') + '</td>' +
      '<td class="num">' + (isPaid ? '' : money(t.cr)) + '</td>' +
    '</tr>';
  }).join("") : "";

  el("tab-amma").innerHTML =
    '<div class="card"><div class="total">' +
      '<div class="headline"><div class="lbl">' + (owed ? 'She owes' : 'She is ahead by') + '</div>' +
        '<div class="val">' + money(Math.abs(out)) + '</div></div>' +
      '<div class="parts">' +
        '<div class="part"><div class="p-lbl">Paid on her behalf</div>' +
          '<div class="p-val">' + money(paid) + '</div></div>' +
        '<div class="part"><div class="p-lbl">Repaid by her</div>' +
          '<div class="p-val">' + money(repaid) + '</div></div>' +
      '</div>' +
    '</div>' +
    '<p class="cap" style="margin:14px 0 0">' +
      (owed
        ? 'What you have fronted, less what she has sent back.'
        : 'She has sent back more than the spending tagged so far. That usually means bills ' +
          'she has reimbursed are not yet tagged in the spreadsheet rather than that she has overpaid.') +
      ' None of this counts as your income or your expense, so it appears on no other tab.</p>' +
    '</div>' +

    '<div class="card"><h2>Every tagged transaction</h2>' +
      '<p class="cap">' + rows.length + ' rows, newest first.</p>' +
      (body
        ? '<div class="tbl-scroll"><table><thead><tr><th>Date</th><th>Description</th>' +
          '<th class="num">Paid out</th><th class="num">Repaid</th></tr></thead>' +
          '<tbody>' + body + '</tbody></table></div>'
        : '<div class="empty">Nothing tagged yet.</div>') +
    '</div>';
}

/* =====================================================================
   6. Shell wiring
   ===================================================================== */

function switchTab(name) {
  STATE.tab = name;
  document.querySelectorAll("nav.tabs button").forEach(function (b) {
    b.setAttribute("aria-selected", String(b.dataset.tab === name));
  });
  ["overview", "salary", "spending", "txns", "accounts", "assets", "insurance", "amma"].forEach(function (t) {
    el("tab-" + t).classList.toggle("hide", t !== name);
  });
  if (name === "overview") renderOverview();
  if (name === "spending") renderSpending();
  if (name === "txns")     renderTxns();
  if (name === "accounts" || name === "assets") renderAssets();
  if (name === "insurance") renderInsurance();
  if (name === "salary")    renderSalary();
  if (name === "amma")      renderAmma();
  window.scrollTo(0, 0);
}

/* Charts size themselves when drawn, so resizing a Mac window has to redraw
   them. Only when the window is, or was, wide: an iPad rotating between
   portrait and landscape never reaches 1400px and is left alone. Scroll
   position is kept, since switchTab jumps to the top. */
var lastWidth = window.innerWidth, resizeTimer = null;
window.addEventListener("resize", function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function () {
    var w = window.innerWidth;
    if (DATA && (w >= 1400 || lastWidth >= 1400) && w !== lastWidth) {
      var y = window.scrollY;
      switchTab(STATE.tab);
      window.scrollTo(0, y);
    }
    lastWidth = w;
  }, 200);
});

function boot(data, fromCache) {
  DATA = data;
  el("gate").classList.add("hide");
  el("app").classList.remove("hide");

  var gen = DATA.generated ? new Date(DATA.generated) : null;
  el("stamp").textContent = (fromCache ? "Offline copy · " : "") +
    (gen ? "Data to " + gen.toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "");

  el("foot").textContent = DATA.txns.length + " transactions · " +
    monthLabel(monthKey(DATA.txns[0].d)) + " to " + monthLabel(monthKey(DATA.txns[DATA.txns.length - 1].d));

  switchTab(STATE.tab);
}

document.querySelectorAll("nav.tabs button").forEach(function (b) {
  b.addEventListener("click", function () { switchTab(b.dataset.tab); });
});

el("refresh").addEventListener("click", function () {
  var owner = localStorage.getItem(LS.owner), repo = localStorage.getItem(LS.repo), token = localStorage.getItem(LS.token);
  if (!owner) { location.reload(); return; }
  var btn = this; btn.textContent = "Refreshing…";
  fetchGitHub(owner, repo, token).then(function (d) {
    cacheSave(d); boot(d, false); btn.textContent = "Refresh";
  }).catch(function (e) {
    btn.textContent = "Refresh"; alert(e.message);
  });
});

el("signout").addEventListener("click", function () {
  if (!confirm("Remove the saved key and cached data from this device?")) return;
  [LS.owner, LS.repo, LS.token, LS.cache].forEach(function (k) { localStorage.removeItem(k); });
  location.reload();
});

function gateError(msg) {
  var e = el("gate-err"); e.textContent = msg; e.classList.remove("hide");
}

el("g-go").addEventListener("click", function () {
  var owner = el("g-owner").value.trim();
  var repo  = el("g-repo").value.trim();
  var token = el("g-token").value.trim();
  if (!owner || !repo || !token) { gateError("Fill in all three fields."); return; }

  var btn = this; btn.disabled = true; btn.textContent = "Checking…";
  el("gate-err").classList.add("hide");

  fetchGitHub(owner, repo, token).then(function (d) {
    localStorage.setItem(LS.owner, owner);
    localStorage.setItem(LS.repo, repo);
    localStorage.setItem(LS.token, token);
    cacheSave(d);
    boot(d, false);
  }).catch(function (e) {
    gateError(e.message);
    btn.disabled = false; btn.textContent = "Unlock";
  });
});

el("g-token").addEventListener("keydown", function (e) { if (e.key === "Enter") el("g-go").click(); });

/* Startup: local file (development) -> GitHub (saved key) -> offline cache -> unlock screen. */
(function start() {
  fetchLocal().then(function (d) {
    boot(d, false);
  }).catch(function () {
    var owner = localStorage.getItem(LS.owner);
    var repo = localStorage.getItem(LS.repo);
    var token = localStorage.getItem(LS.token);
    if (owner && repo && token) {
      fetchGitHub(owner, repo, token).then(function (d) {
        cacheSave(d); boot(d, false);
      }).catch(function (err) {
        var c = cacheLoad();
        if (c) { boot(c, true); }
        else { el("g-owner").value = owner; el("g-repo").value = repo; gateError(err.message); }
      });
    }
  });
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () { /* offline support is optional */ });
  });
}
</script>
