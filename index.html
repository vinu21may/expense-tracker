<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finances">
<meta name="theme-color" content="#f9f9f7">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Finances</title>
<style>
/* ---------------------------------------------------------- design tokens */
:root {
  color-scheme: light;
  --surface-1:      #fcfcfb;
  --plane:          #f9f9f7;
  --text-primary:   #0b0b0b;
  --text-secondary: #52514e;
  --muted:          #898781;
  --grid:           #e1e0d9;
  --baseline:       #c3c2b7;
  --border:         rgba(11,11,11,0.10);
  --series-1:       #2a78d6;   /* income  */
  --series-2:       #eb6834;   /* expense */
  --series-3:       #1baf7a;   /* categorical slot 3 (Salary: employers) */
  --series-4:       #eda100;   /* categorical slot 4 */
  --seq-500:        #256abf;
  --seq-450:        #2a78d6;
  --seq-400:        #3987e5;
  --seq-350:        #5598e7;
  --seq-300:        #6da7ec;
  --seq-250:        #86b6ef;
  --good:           #0ca30c;
  --good-text:      #006300;
  --warning:        #fab219;
  --critical:       #d03b3b;
  --shadow:         0 1px 2px rgba(11,11,11,.05), 0 4px 14px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --plane:          #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --muted:          #898781;
    --grid:           #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);
    --series-1:       #3987e5;
    --series-2:       #d95926;
    --series-3:       #199e70;
    --series-4:       #c98500;
    --seq-500:        #3987e5;
    --seq-450:        #2a78d6;
    --seq-400:        #256abf;
    --seq-350:        #1c5cab;
    --seq-300:        #184f95;
    --seq-250:        #104281;
    --good-text:      #0ca30c;
    --shadow:         0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--plane);
  color: var(--text-primary);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
.hide { display: none !important; }

/* ---------------------------------------------------------------- unlock */
#gate {
  min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px calc(24px + env(safe-area-inset-left)) 24px calc(24px + env(safe-area-inset-right));
}
.gate-card {
  width: 100%; max-width: 440px;
  background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 18px;
  padding: 28px; box-shadow: var(--shadow);
}
.gate-card h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
.gate-card p.sub { margin: 0 0 22px; color: var(--text-secondary); font-size: 14px; line-height: 1.5; }
label { display: block; font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--text-secondary); }
input[type=text], input[type=password], select {
  width: 100%; padding: 12px 14px; font-size: 16px; font-family: inherit;
  color: var(--text-primary); background: var(--plane);
  border: 1px solid var(--border); border-radius: 10px; margin-bottom: 16px;
  min-height: 44px;
}
input:focus, select:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }
select:disabled { color: var(--muted); background: var(--surface-1); cursor: not-allowed; opacity: 1; }
button {
  font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); border-radius: 10px;
  background: var(--surface-1); color: var(--text-primary);
  padding: 12px 18px; min-height: 44px;
}
button.primary { background: var(--series-1); color: #fff; border-color: transparent; width: 100%; }
button.primary:disabled { opacity: .55; cursor: default; }
.err {
  background: color-mix(in srgb, var(--critical) 12%, transparent);
  border: 1px solid var(--critical); color: var(--text-primary);
  padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; line-height: 1.45;
}
.hint { font-size: 12px; color: var(--muted); margin: -10px 0 18px; line-height: 1.5; }

/* ----------------------------------------------------------------- shell */
header.app {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--plane) 88%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border);
  padding: max(10px, env(safe-area-inset-top)) 20px 0;
}
.hrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding-bottom: 10px; }
.brand { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin-right: auto; }
.stamp { font-size: 12px; color: var(--muted); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs button {
  border: none; background: none; border-radius: 0; padding: 10px 14px 12px;
  font-size: 15px; font-weight: 600; color: var(--muted);
  border-bottom: 2.5px solid transparent; white-space: nowrap; min-height: 44px;
}
nav.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--series-1); }
main { padding: 20px calc(20px + env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-right)); max-width: 1280px; margin: 0 auto; }

/* ----------------------------------------------------------------- cards */
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 16px;
}
.card h2 { margin: 0 0 2px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.card p.cap { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
.grid { display: grid; gap: 16px; }
/* A grid item defaults to min-width:auto, so it refuses to shrink below its
   own content: a card holding a wide table then pushed the whole page sideways
   on a phone instead of letting the table scroll inside its own box. */
.grid > * { min-width: 0; }
@media (min-width: 700px)  { .grid.k2 { grid-template-columns: 1fr 1fr; } .grid.k4 { grid-template-columns: repeat(4,1fr); } .grid.k3 { grid-template-columns: repeat(3,1fr); } }
@media (max-width: 699px)  { .grid.k4, .grid.k5, .grid.k6 { grid-template-columns: 1fr 1fr; } }
@media (min-width: 700px) and (max-width: 1039px) { .grid.k6 { grid-template-columns: repeat(3,1fr); } }
@media (min-width: 1040px) { .grid.k6 { grid-template-columns: repeat(6,1fr); } }
@media (min-width: 700px) and (max-width: 1039px) { .grid.k5 { grid-template-columns: repeat(3,1fr); } }
@media (min-width: 1040px) { .grid.k5 { grid-template-columns: repeat(5,1fr); } }
@media (min-width: 1000px) { .grid.split { grid-template-columns: 1.35fr 1fr; align-items: start; } }
/* A Mac on a 32" 4K monitor (BenQ EW3290U, "looks like" 1920x1080). Below
   1500px nothing changes, so the iPad -- 1366px at its widest -- is untouched. */
@media (min-width: 1500px) {
  main { max-width: 1840px; }
  .desc { max-width: 720px; }
}
/* Ledger row number on the Transactions tab -- the same number the workbook
   and the monthly review file use. Wide screens only, so the iPad keeps its
   columns. */
.rowno { display: none; }
@media (min-width: 1500px) {
  .rowno { display: table-cell; color: var(--muted); font-variant-numeric: tabular-nums;
           font-size: 12.5px; white-space: nowrap; }
}

/* ---------------------------------------------- exit values (Assets tab) */
.tax-row { cursor: pointer; }
.tax-row:hover td { background: var(--plane); }
.tax-row .chev { display: inline-block; width: 12px; color: var(--muted); }
.tax-detail td { background: var(--plane); }
#tab-monthly tr.tax-row { scroll-margin-top: 110px; }
/* on a phone the table scrolls sideways; keep the opened detail to the screen */
@media (max-width: 699px) { .m-detail { position: sticky; left: 0; max-width: calc(100vw - 96px); } }
.m-line { align-items: flex-start; padding: 5px 0; border-top: 1px solid var(--grid); }
.m-line:first-of-type { border-top: none; }
.m-line > span { min-width: 0; }
.m-note { color: var(--text-primary); font-weight: 600; }
.m-desc { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; margin-top: 2px; }
.m-total td { border-top: 2px solid var(--grid); }
.neg { color: var(--critical); }
.tax-lines { max-width: 460px; margin: 0 0 4px 16px; }
/* Assets: the today-vs-maturity box is wider than the three tax boxes beside it */
.grid.k4w { grid-template-columns: 1fr 1fr; }
.grid.k4w .cmp-box { grid-column: 1 / -1; }
@media (max-width: 499px) { .grid.k4w { grid-template-columns: 1fr; } }
@media (min-width: 700px) { .grid.k4w { grid-template-columns: 1.6fr 1fr 1fr 1fr; } .grid.k4w .cmp-box { grid-column: auto; } }
.cmp { display: grid; grid-template-columns: 1fr auto auto; column-gap: 12px; row-gap: 5px; margin-top: 6px;
       font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; align-items: baseline; }
.cmp b { color: var(--text-primary); font-weight: 600; text-align: right; white-space: nowrap; }
.cmp .h { font-size: 11px; color: var(--muted); text-align: right; text-transform: uppercase; letter-spacing: .04em; }
.cmp small { display: block; font-size: 11.5px; color: var(--muted); }
.cmp .tot { border-top: 1px solid var(--grid); padding-top: 6px; color: var(--text-primary); font-weight: 600; }
.exit { border-top: 1px solid var(--grid); padding: 14px 0; }
.exit:first-of-type { border-top: none; }
.exit-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
.exit-head b { font-size: 15px; }
.exit-pair { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .exit-pair { grid-template-columns: 1fr 1fr; } }
.exit-box { background: var(--plane); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.exit-box .lbl { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.exit-box .v { font-size: 20px; font-weight: 700; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.exit-box .t { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.exit-box .why { font-size: 12.5px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
.exit .tax { font-size: 12.5px; color: var(--text-secondary); margin-top: 8px; line-height: 1.4; }

/* ------------------------------------------------------------ stat tiles */
/* Bank accounts and credit cards as cards rather than table rows (Vinod,
   1 Oct 2026). A row of six columns made every balance a squint on the iPad;
   a card gives the number the room it deserves and keeps the supporting
   figures underneath it. */
.acct-cards { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 620px)  { .acct-cards { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1100px) { .acct-cards { grid-template-columns: repeat(3,1fr); } }
.acct-card { border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; background: var(--plane); }
.acct-card .ac-name { font-weight: 700; font-size: 15px; }
.acct-card .ac-sub  { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.45; }
.acct-card .ac-val  { font-size: clamp(21px, 2.6vw, 27px); font-weight: 700; letter-spacing: -0.025em; margin: 12px 0 1px; line-height: 1.1; }
.acct-card .ac-val-lbl { font-size: 12px; color: var(--muted); }
.acct-card .ac-rows { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 9px; display: grid; gap: 5px; }
.acct-card .ac-row  { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12.5px; }
.acct-card .ac-row > span:first-child { color: var(--muted); }
.acct-card .ac-row > span:last-child  { text-align: right; }
.tile {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow);
}
.tile .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.tile .val { font-size: clamp(22px, 3.4vw, 30px); font-weight: 700; letter-spacing: -0.025em; margin-top: 6px; line-height: 1.1; }
.tile .sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 5px; }
/* a tile laid out as a small statement: one item per line, amount on the right */
.tile .kv, .exit-box .kv, .tax-lines .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 13px;
            color: var(--text-secondary); margin-top: 5px; font-variant-numeric: tabular-nums; }
.tile .kv b, .exit-box .kv b, .tax-lines .kv b { color: var(--text-primary); font-weight: 600; white-space: nowrap; }
.tile .kv.total, .exit-box .kv.total, .tax-lines .kv.total { border-top: 1px solid var(--grid); padding-top: 6px; margin-top: 7px; color: var(--text-primary); font-weight: 600; }
.tile .kv.note, .exit-box .kv.note, .tax-lines .kv.note { color: var(--muted); font-size: 12px; }
/* a tile that filters the list below it (Insurance, Upcoming Bills) */
.tile.click { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
              transition: border-color .15s, box-shadow .15s; }
.tile.click:hover { border-color: color-mix(in srgb, var(--series-1) 45%, var(--border)); }
.tile.click:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.tile.click.on { border-color: var(--series-1); box-shadow: 0 0 0 1px var(--series-1), var(--shadow); }
.tile.click .lbl::after { content: " ›"; color: var(--series-1); }
.filterbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 16px;
             font-size: 13.5px; color: var(--text-secondary); }
.filterbar button { font: inherit; font-weight: 600; color: var(--series-1); background: none; border: 0;
                    padding: 4px 0; cursor: pointer; }
.card.flash { box-shadow: 0 0 0 2px var(--series-1), var(--shadow); transition: box-shadow .4s; }
.up { color: var(--good-text); } .down { color: var(--critical); }

/* Account numbers: 14 digits that get read off and compared against a bank
   document, so they need even digit widths and a little letter-spacing. */
.acct {
  margin-top: 2px; font-size: 11.5px; color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums; letter-spacing: .02em;
}

/* Lead summary: one headline figure with the parts that make it up. Wider
   than a stat tile because the breakdown has to sit beside it, otherwise the
   total reads as a number from nowhere. */
.total { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 40px; }
.total .headline .lbl { font-size: 12.5px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .04em; }
.total .headline .val { font-size: clamp(28px, 4.6vw, 40px); font-weight: 700;
  letter-spacing: -0.03em; margin-top: 4px; line-height: 1.05; }
.total .parts { display: flex; flex-wrap: wrap; gap: 8px 28px; }
.total .part { min-width: 118px; }
.total .part .p-lbl { font-size: 12px; color: var(--muted); }
.total .part .p-val { font-size: 16.5px; font-weight: 650; margin-top: 2px;
  letter-spacing: -0.01em; }
.total .part .p-val.muted-val { color: var(--text-secondary); font-weight: 600; }
@media (max-width: 560px) { .total .parts { gap: 8px 20px; } .total .part { min-width: 96px; } }

/* ---------------------------------------------------------------- charts */
.chartwrap { position: relative; width: 100%; }
svg.chart { display: block; width: 100%; height: auto; overflow: visible; }
.tip {
  position: absolute; pointer-events: none; z-index: 30; opacity: 0;
  transition: opacity .1s; background: var(--surface-1);
  border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--shadow); padding: 9px 11px; font-size: 13px;
  min-width: 148px; transform: translate(-50%, -100%);
}
.tip .t-title { font-weight: 700; margin-bottom: 5px; }
.tip .t-row { display: flex; align-items: center; gap: 7px; margin-top: 3px; color: var(--text-secondary); }
.tip .t-row b { margin-left: auto; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 12px; font-size: 13px; color: var(--text-secondary); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.hit { fill: transparent; cursor: pointer; touch-action: manipulation; }

/* ---------------------------------------------------- where to invest */
.inv-in .f { flex: 1 1 170px; }
.inv-in input[type=text], .inv-in select { min-width: 0; }
.inv-quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.inv-quick button { padding: 8px 14px; min-height: 38px; font-size: 14px; }
.inv-quick button[aria-pressed="true"] { border-color: var(--series-1); box-shadow: 0 0 0 1px var(--series-1); }
.inv-pills { margin: 5px 0 0 16px; display: flex; gap: 5px; flex-wrap: wrap; }
.inv-barcell { min-width: 110px; }
.inv-tbl td:first-child { min-width: 240px; }
.inv-tbl td:nth-child(3) { min-width: 90px; }
.inv-bar { height: 6px; border-radius: 3px; background: var(--grid); margin-top: 6px; overflow: hidden; }
.inv-bar span { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }
.inv-detail { margin-left: 16px; font-size: 13px; color: var(--text-secondary); line-height: 1.5; max-width: 760px; }
.inv-detail .tax-lines { margin: 0 0 8px; }
.inv-detail p { margin: 6px 0; }
.inv-off td { color: var(--muted); font-size: 13px; }
.inv-sep { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding-top: 18px; }
.inv-rules td { font-size: 13px; min-width: 120px; }
.inv-rules td:first-child { min-width: 170px; }
.inv-notes { margin: 0; padding-left: 18px; font-size: 13px; color: var(--text-secondary); line-height: 1.55; }
/* ---------------------------------------------------------------- tables */
.tbl-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
     color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.desc { max-width: 380px; overflow-wrap: anywhere; }
.pill { display: inline-block; font-size: 11.5px; padding: 2.5px 8px; border-radius: 999px;
        background: color-mix(in srgb, var(--muted) 16%, transparent); color: var(--text-secondary); white-space: nowrap; }
.pill.warn { background: color-mix(in srgb, var(--warning) 24%, transparent); color: var(--text-primary); }
.pill.ok   { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--text-primary); }
.pill.bad  { background: color-mix(in srgb, var(--critical) 16%, transparent); color: var(--text-primary); }

/* --------------------------------------------------------------- filters */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.filters .f { display: flex; flex-direction: column; }
.filters label { margin-bottom: 5px; }
.filters select, .filters input[type=text] { margin-bottom: 0; min-width: 150px; }
.filters input[type=text] { min-width: 220px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.seg button { border: none; border-radius: 0; padding: 10px 16px; font-size: 14px; background: var(--surface-1); color: var(--text-secondary); }
.seg button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
.seg button + button { border-left: 1px solid var(--border); }

/* -------------------------------------------------------------- progress */
.pol + .pol { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; }
.pol-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.pol-head .p-name { font-weight: 600; }
.pol-head .p-meta { color: var(--muted); font-size: 12.5px; margin-left: auto; }
/* label/value pairs: two columns where there is room, stacked when there is not */
.pol-fields { display: grid; gap: 2px 24px; margin: 9px 0 0; font-size: 13.5px; }
@media (min-width: 620px) { .pol-fields { grid-template-columns: 1fr 1fr; } }
.pol-fields > div { display: grid; grid-template-columns: 116px 1fr; gap: 8px; padding: 2px 0; }
.pol-fields dt { color: var(--muted); font-size: 12.5px; }
.pol-fields dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.goal + .goal { margin-top: 18px; }
.goal-head { display: flex; align-items: baseline; gap: 10px; font-size: 14px; margin-bottom: 8px; }
.goal-head .g-name { font-weight: 600; }
.goal-head .g-amt { margin-left: auto; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--grid); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--series-1); border-radius: 999px; }

/* Asset mix: one ranked bar per holding. A single measure (what each is worth)
   so it is one series in one hue — shading by rank would colour by position
   rather than by the thing itself, and say nothing extra that length doesn't. */
.amix { display: flex; flex-direction: column; gap: 14px; }
.amix-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; }
.amix-name { font-weight: 650; font-size: 14.5px; }
.amix-val { font-weight: 700; font-size: 14.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.amix-sub, .amix-pct { font-size: 12px; color: var(--muted); }
.amix-pct { text-align: right; font-variant-numeric: tabular-nums; }
.amix-track { grid-column: 1 / -1; height: 9px; background: var(--grid);
  border-radius: 999px; overflow: hidden; margin-top: 3px; }
.amix-track > i { display: block; height: 100%; background: var(--seq-450);
  border-radius: 999px; transition: width .5s ease; }
.amix-row:hover .amix-track > i { background: var(--seq-500); }
.amix-foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--grid);
  display: flex; justify-content: space-between; font-size: 13.5px; }
.amix-foot b { font-variant-numeric: tabular-nums; }

/* Maturity timeline: one lane per holding on a shared date axis, so the bar
   length is time-to-maturity and the lanes are comparable down the column.
   Dates sit in the row heading rather than floating on the lane — two
   maturities two months apart would otherwise overlap their own labels. */
.mat { display: flex; flex-direction: column; gap: 13px; }
.mat-axis { position: relative; height: 16px; margin-bottom: 2px; }
.mat-axis > span { position: absolute; top: 0; transform: translateX(-50%);
  font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mat-row { display: grid; grid-template-columns: 1fr auto; gap: 1px 12px; align-items: baseline; }
.mat-name { font-weight: 650; font-size: 14px; }
.mat-when { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mat-sub, .mat-left { font-size: 12px; color: var(--muted); }
.mat-left { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mat-lane { grid-column: 1 / -1; position: relative; height: 10px; margin-top: 4px; }
.mat-grid { position: absolute; inset: 0; }
.mat-grid > u { position: absolute; top: -2px; bottom: -2px; width: 1px;
  background: var(--grid); text-decoration: none; }
.mat-track { position: absolute; inset: 0; background: var(--grid); border-radius: 999px; }
.mat-fill { position: absolute; left: 0; top: 0; bottom: 0; min-width: 4px;
  background: var(--seq-350); border-radius: 999px; }
.mat-dot { position: absolute; top: 50%; width: 10px; height: 10px; border-radius: 50%;
  background: var(--seq-500); transform: translate(-50%, -50%);
  box-shadow: 0 0 0 2px var(--surface-1); }
.mat-row.soon .mat-fill { background: var(--warning); }
.mat-row.soon .mat-dot { background: var(--warning); }
.mat-note { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--grid);
  font-size: 12.5px; color: var(--muted); }
.muted { color: var(--muted); }
.empty { padding: 28px 4px; text-align: center; color: var(--muted); font-size: 14px; }
.foot { text-align: center; font-size: 12px; color: var(--muted); padding: 8px 0 4px; }
.linkish { background: none; border: none; color: var(--series-1); font-size: 13px; padding: 6px; text-decoration: underline; min-height: 0; }
</style>
</head>
<body>

<!-- ======================================================== unlock screen -->

</div>

<!-- =============================================================== the app -->
<div id="app" class="hide">

  <main>

<script>
"use strict";

/* =====================================================================
   1. Small utilities
   ===================================================================== */

var LS = { owner: "ft.owner", repo: "ft.repo", token: "ft.token", cache: "ft.cache" };

/* Must equal CACHE in sw.js -- bump both together. Refresh compares them. */
var APP_BUILD = "finances-shell-v49";

var inr0 = new Intl.NumberFormat("en-IN", { maximumFractionDigits: 0 });
var inr2 = new Intl.NumberFormat("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function money(n)      { return "₹" + inr0.format(Math.round(n || 0)); }
function moneyExact(n) { return "₹" + inr2.format(n || 0); }

/* Indian short scale for axis ticks: 1,00,000 -> 1L ; 1,00,00,000 -> 1Cr */
function moneyShort(n) {
  var a = Math.abs(n);
  if (a >= 1e7) return "₹" + (n / 1e7).toFixed(a >= 1e8 ? 0 : 1) + "Cr";
  if (a >= 1e5) return "₹" + (n / 1e5).toFixed(a >= 1e6 ? 0 : 1) + "L";
  if (a >= 1e3) return "₹" + Math.round(n / 1e3) + "k";
  return "₹" + Math.round(n);
}

var MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monthKey(d)   { return d.slice(0, 7); }                       // "2026-08"
function monthLabel(k) { return MONTH_NAMES[+k.slice(5, 7) - 1] + " " + k.slice(0, 4); }
function monthShort(k) { return MONTH_NAMES[+k.slice(5, 7) - 1]; }
function dayLabel(d)   { return d.slice(8, 10) + " " + MONTH_NAMES[+d.slice(5, 7) - 1]; }

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function el(id) { return document.getElementById(id); }

/* =====================================================================
   2. Data loading — local file in dev, GitHub API on the iPad
   ===================================================================== */

var DATA = null;

function fetchLocal() {
  return fetch("data.json", { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("no local data");
    return r.json();
  });
}

function fetchGitHub(owner, repo, token) {
  var url = "https://api.github.com/repos/" + encodeURIComponent(owner) +
            "/" + encodeURIComponent(repo) + "/contents/data.json";
  return fetch(url, {
    cache: "no-store",
    headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github.raw" }
  }).then(function (r) {
    if (r.status === 401) throw new Error("That token was rejected. Check you pasted it whole, and that it has not expired.");
    if (r.status === 403) throw new Error("Access refused. The token needs Contents: Read-only permission on this repository.");
    if (r.status === 404) throw new Error("Could not find data.json in " + owner + "/" + repo + ". Check the username and repository name, and that the converter has run at least once.");
    if (!r.ok) throw new Error("GitHub returned an error (" + r.status + ").");
    return r.json();
  });
}

function cacheSave(d) {
  try { localStorage.setItem(LS.cache, JSON.stringify(d)); } catch (e) { /* quota — memory only */ }
}
function cacheLoad() {
  try { var s = localStorage.getItem(LS.cache); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}

/* =====================================================================
   3. Aggregation — every dashboard number is derived here
   -----------------------------------------------------------------
   Matches the workbook's own definitions:
     Net Savings = Income - Expenses - Investments
     Savings Rate = Net Savings / Income
   Rows flagged "exclude from charts" are dropped from every total but
   remain visible in the transactions ledger.
   ===================================================================== */

function charted(t) { return !t.x; }

function blankAgg() {
  return { income: 0, expense: 0, invest: 0, transfer: 0, count: 0 };
}
function addTo(a, t) {
  if (t.t === "Income")        a.income   += t.cr;
  else if (t.t === "Expense")  a.expense  += t.db;
  // Invested is NEW money only: an FD redemption (a Savings-typed credit)
  // offsets the placements it funds, so a rollover shows as the interest
  // reinvested rather than the whole deposit. Can go negative in a month that
  // drew savings down. Matches the workbook's own dashboards.
  else if (t.t === "Savings")  a.invest   += t.db - t.cr;
  else if (t.t === "Transfer") a.transfer += t.db;
  a.count++;
  return a;
}
function net(a)  { return a.income - a.expense - a.invest; }
function rate(a) { return a.income > 0 ? net(a) / a.income : 0; }

function monthsIndex(txns) {
  var map = {};
  txns.forEach(function (t) {
    if (!charted(t)) return;
    var k = monthKey(t.d);
    if (!map[k]) map[k] = blankAgg();
    addTo(map[k], t);
  });
  var keys = Object.keys(map).sort();
  return { map: map, keys: keys };
}

function categoryTotals(txns, monthK) {
  var map = {};
  txns.forEach(function (t) {
    if (!charted(t) || t.t !== "Expense") return;
    if (monthK && monthKey(t.d) !== monthK) return;
    map[t.c] = (map[t.c] || 0) + t.db;
  });
  return Object.keys(map).map(function (k) { return { name: k, value: map[k] }; })
                         .sort(function (a, b) { return b.value - a.value; });
}

function subCategoryTotals(txns, cat, monthK) {
  var map = {};
  txns.forEach(function (t) {
    if (!charted(t) || t.t !== "Expense" || t.c !== cat) return;
    if (monthK && monthKey(t.d) !== monthK) return;
    map[t.s] = (map[t.s] || 0) + t.db;
  });
  return Object.keys(map).map(function (k) { return { name: k, value: map[k] }; })
                         .sort(function (a, b) { return b.value - a.value; });
}

/* Month-by-month spend for one sub-category, across the whole ledger. */
function subMonthlyTotals(txns, cat, sub, keys) {
  var map = {};
  keys.forEach(function (k) { map[k] = 0; });
  txns.forEach(function (t) {
    if (!charted(t) || t.t !== "Expense" || t.c !== cat || t.s !== sub) return;
    var k = monthKey(t.d);
    if (k in map) map[k] += t.db;
  });
  return keys.map(function (k) { return map[k]; });
}

/*
 * Net movement per account: everything in, minus everything out, across the
 * whole ledger. This is NOT a closing balance — the sheet's opening balances
 * are all zero, so a true balance cannot be derived. Labelled honestly in the
 * Accounts table.
 */
function accountMovement(txns) {
  var m = {};
  txns.forEach(function (t) {
    if (!m[t.ac]) m[t.ac] = { in: 0, out: 0, n: 0, first: t.d, last: t.d };
    var a = m[t.ac];
    a.in += t.cr; a.out += t.db; a.n++;
    if (t.d < a.first) a.first = t.d;
    if (t.d > a.last) a.last = t.d;
  });
  return m;
}

/* =====================================================================
   4. Chart primitives (hand-rolled SVG — no external libraries)
   ===================================================================== */

/* Rounded corners on the data end only, anchored to the baseline. */
function barUp(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  if (h <= 0.6) return "";
  return "M" + x + "," + (y + h) +
         "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y +
         "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
         "V" + (y + h) + "Z";
}
function barRight(x, y, w, h, r) {
  r = Math.min(r, h / 2, w);
  if (w <= 0.6) return "";
  return "M" + x + "," + y +
         "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
         "V" + (y + h - r) + "Q" + (x + w) + "," + (y + h) + " " + (x + w - r) + "," + (y + h) +
         "H" + x + "Z";
}

function niceMax(v) {
  if (v <= 0) return 1;
  var mag = Math.pow(10, Math.floor(Math.log10(v)));
  var f = v / mag;
  var steps = [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10];
  for (var i = 0; i < steps.length; i++) if (f <= steps[i] + 1e-9) return steps[i] * mag;
  return 10 * mag;
}

/*
 * A couple of one-off property transfers are 20x a normal month. On a plain
 * linear axis they flatten every other bar into a sliver. So the axis is
 * capped near the top of the *typical* range; anything above is drawn to the
 * cap, given a break mark, and labelled with its real value — nothing is
 * hidden, and the ordinary months stay readable. "Full scale" restores the
 * true axis.
 */
function axisCap(values) {
  var v = values.filter(function (x) { return x > 0; }).sort(function (a, b) { return a - b; });
  if (v.length < 4) return { cap: niceMax(v[v.length - 1] || 1), any: false };
  var max = v[v.length - 1];
  var p80 = v[Math.floor(v.length * 0.8)];
  var cap = niceMax(p80 * 1.3);
  return { cap: cap, any: max > cap * 1.15 };
}

/* Break mark: two hairlines across a clipped bar, just below the axis top. */
function breakMark(x, w, yTop) {
  var s = "";
  for (var i = 0; i < 2; i++) {
    var y = yTop + 7 + i * 5;
    s += '<path d="M' + x + ',' + (y + 3) + ' L' + (x + w / 2) + ',' + (y - 2) + ' L' + (x + w) + ',' + (y + 3) +
         '" fill="none" stroke="var(--surface-1)" stroke-width="2.5" stroke-linejoin="round"/>';
  }
  return s;
}

/* Tooltip plumbing shared by every chart. */
function attachTip(wrap, svg) {
  var tip = document.createElement("div");
  tip.className = "tip";
  wrap.appendChild(tip);

  function hide() { tip.style.opacity = 0; }

  svg.querySelectorAll("[data-tip]").forEach(function (node) {
    function show(ev) {
      tip.innerHTML = node.getAttribute("data-tip");
      tip.style.opacity = 1;
      var wr = wrap.getBoundingClientRect();
      var nr = node.getBoundingClientRect();
      var x = nr.left + nr.width / 2 - wr.left;
      var y = nr.top - wr.top - 8;
      // keep the tooltip inside the card
      var half = tip.offsetWidth / 2;
      x = Math.max(half + 2, Math.min(wr.width - half - 2, x));
      if (y < tip.offsetHeight + 4) y = nr.bottom - wr.top + tip.offsetHeight + 12;
      tip.style.left = x + "px";
      tip.style.top = y + "px";
    }
    node.addEventListener("mouseenter", show);
    node.addEventListener("mousemove", show);
    // Touch: show the tooltip, but never preventDefault here — iOS only
    // synthesises the follow-up click when the touch is left alone, and that
    // click is what opens the sub-category breakdown.
    node.addEventListener("touchstart", show, { passive: true });
    node.addEventListener("mouseleave", hide);
  });
  wrap.addEventListener("mouseleave", hide);
  // On touch there is no mouseleave, so dismiss when the next tap lands elsewhere.
  document.addEventListener("touchstart", function (ev) {
    if (!svg.contains(ev.target)) hide();
  }, { passive: true });
}

/*
 * Grouped vertical bars — income vs expenses by month.
 * Two series, so a legend is always present (identity is never colour-alone).
 */
/* Every chart has a 760-unit design width and is stretched to fill its card,
   so on a wide monitor each label and bar grew with the card -- at 1,840px the
   income chart alone filled the screen. Past WIDE_FROM px of card width the
   design width grows with the card instead, holding the on-screen scale at
   WIDE_SCALE; heights stay as designed, so charts get wider, not taller. At or
   below WIDE_FROM every chart draws exactly as before -- the iPad's widest card
   is about 1,240px. */
var WIDE_FROM = 1300, WIDE_SCALE = 1.35;
function chartWidth(container) {
  var cw = (container && container.clientWidth) || 0;
  return cw > WIDE_FROM ? Math.round(cw / WIDE_SCALE) : 760;
}

/* opts (Monthly tab): oneOff {month: amount} stacks set-aside one-off costs on
   top of the everyday expense bar in a lighter shade; onPick(month) runs when a
   month is tapped; rerender redraws the owning tab when the scale is switched. */
function chartIncomeExpense(container, keys, map, fit, opts) {
  opts = opts || {};
  var oo = opts.oneOff || {};
  var W = chartWidth(container), H = 300, PL = 62, PR = 12, PT = 34, PB = 34;
  var iw = W - PL - PR, ih = H - PT - PB;

  var all = [];
  keys.forEach(function (k) { all.push(map[k].income, map[k].expense + (oo[k] || 0)); });
  var ac = axisCap(all);
  var trueMax = Math.max.apply(null, all);
  var top = (fit && ac.any) ? ac.cap : niceMax(trueMax);

  var band = iw / keys.length;
  var gap = 2;                          // 2px surface gap between adjacent bars
  var bw = Math.max(4, Math.min(22, (band - 14 - gap) / 2));

  var s = "";
  // recessive gridlines + axis ticks
  for (var g = 0; g <= 4; g++) {
    var v = top * g / 4, y = PT + ih - (v / top) * ih;
    s += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y +
         '" stroke="var(--grid)" stroke-width="1"/>' +
         '<text x="' + (PL - 9) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11.5" fill="var(--muted)">' +
         moneyShort(v) + '</text>';
  }

  keys.forEach(function (k, i) {
    var a = map[k];
    var cx = PL + band * i + band / 2;
    var x1 = cx - bw - gap / 2, x2 = cx + gap / 2;
    var base = PT + ih;

    var extra = oo[k] || 0;
    var pair = [[a.income, x1, "var(--series-1)"], [a.expense + extra, x2, "var(--series-2)"]];
    var bothOver = a.income > top && a.expense + extra > top;
    pair.forEach(function (b, j) {
      var val = b[0], bx = b[1];
      var over = val > top;
      var h = Math.min(val, top) / top * ih;
      if (j === 1 && extra > 0) {
        // everyday part solid, the one-off part stacked on top and faded
        var he = Math.min(a.expense, top) / top * ih;
        s += '<path d="' + barUp(bx, base - h, bw, h, 4) + '" fill="' + b[2] + '" fill-opacity="0.32"/>' +
             '<rect x="' + bx + '" y="' + (base - he) + '" width="' + bw + '" height="' + he + '" fill="' + b[2] + '"/>';
      } else {
        s += '<path d="' + barUp(bx, base - h, bw, h, 4) + '" fill="' + b[2] + '"/>';
      }
      if (over) {
        s += breakMark(bx, bw, PT);
        // When both bars overflow their labels would collide, so stagger them.
        var ly = bothOver ? (j === 0 ? PT - 19 : PT - 6) : PT - 7;
        s += '<text x="' + (bx + bw / 2) + '" y="' + ly + '" text-anchor="middle" font-size="10.5" ' +
             'fill="var(--text-secondary)" font-weight="700">' + moneyShort(val) + '</text>';
      }
    });

    var tip = '<div class="t-title">' + monthLabel(k) + '</div>' +
      '<div class="t-row"><i class="swatch" style="background:var(--series-1)"></i>Income<b>' + money(a.income) + '</b></div>' +
      '<div class="t-row"><i class="swatch" style="background:var(--series-2)"></i>' + (opts.oneOff || opts.everyday ? 'Everyday expenses' : 'Expenses') + '<b>' + money(a.expense) + '</b></div>' +
      (extra ? '<div class="t-row"><i class="swatch" style="background:var(--series-2);opacity:.32"></i>One-off costs<b>' + money(extra) + '</b></div>' : '') +
      (a.invest ? '<div class="t-row"><i class="swatch" style="background:var(--muted)"></i>Invested (net)<b>' + money(a.invest) + '</b></div>' : '') +
      '<div class="t-row">Net<b>' + money(net(a)) + '</b></div>' +
      '<div class="t-row">Transactions<b>' + a.count + '</b></div>';

    // hit target wider than the marks
    s += '<rect class="hit" x="' + (PL + band * i) + '" y="' + PT + '" width="' + band + '" height="' + ih +
         '" data-k="' + k + '" data-tip="' + esc(tip) + '"' + (opts.onPick ? ' style="cursor:pointer"' : '') + '/>';

    // every other month once they get tight, so the labels do not collide
    if (band >= 30 || i % 2 === (keys.length - 1) % 2)
      s += '<text x="' + cx + '" y="' + (PT + ih + 19) + '" text-anchor="middle" font-size="11.5" fill="var(--muted)">' +
           monthShort(k) + '</text>';
    if (k.slice(5, 7) === "01" || i === 0) {
      s += '<text x="' + cx + '" y="' + (PT + ih + 32) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' +
           k.slice(0, 4) + '</text>';
    }
  });

  s += '<line x1="' + PL + '" y1="' + (PT + ih) + '" x2="' + (W - PR) + '" y2="' + (PT + ih) +

/*
 * Horizontal bars — spend by category. This encodes magnitude of a single
 * measure, so it takes one sequential hue rather than categorical colours.
 * Values are direct-labelled, which also satisfies the contrast relief rule.
 */
function chartCategories(container, rows, total, onPick, highlight) {
  if (!rows.length) { container.innerHTML = '<div class="empty">No spending recorded in this period.</div>'; return; }

  var shown = rows.slice(0, 12);
  var rest = rows.slice(12);
  if (rest.length) {
    shown.push({ name: "Other (" + rest.length + " categories)", value: rest.reduce(function (s, r) { return s + r.value; }, 0), lump: true });
  }

  var rowH = 30, W = chartWidth(container), PL = 172, PR = 96, PT = 4;
  var H = PT + shown.length * rowH + 4;
  var iw = W - PL - PR;
  var max = shown.reduce(function (m, r) { return Math.max(m, r.value); }, 0) || 1;
  var ramp = ["var(--seq-500)", "var(--seq-450)", "var(--seq-400)", "var(--seq-350)", "var(--seq-300)", "var(--seq-250)"];

  var s = "";
  shown.forEach(function (r, i) {
    var y = PT + i * rowH;
    var bh = 16;
    var by = y + (rowH - bh) / 2 - 1;
    var w = Math.max(1, (r.value / max) * iw);
    var colour = ramp[Math.min(ramp.length - 1, Math.floor(i / Math.max(1, shown.length / ramp.length)))];
    var pct = total > 0 ? (r.value / total * 100) : 0;

    // The picked row is marked by a caret and weight as well as colour, so it
    // never depends on colour alone to be identifiable.
    var picked = highlight && r.name === highlight;
    if (picked) colour = "var(--series-2)";

    var label = r.name.length > 24 ? r.name.slice(0, 23) + "…" : r.name;
    s += '<text x="' + (PL - 12) + '" y="' + (by + 12) + '" text-anchor="end" font-size="12.5" fill="' +
         (picked ? "var(--text-primary)" : "var(--text-secondary)") + '"' +
         (picked ? ' font-weight="700"' : "") + '>' +
         esc(picked ? "▸ " + label : label) + '</text>';
    s += '<path d="' + barRight(PL, by, w, bh, 4) + '" fill="' + colour + '"/>';
    s += '<text x="' + (PL + w + 10) + '" y="' + (by + 12) + '" font-size="12.5" fill="var(--text-primary)" font-variant-numeric="tabular-nums">' +
         moneyShort(r.value) + '</text>';
    s += '<text x="' + (W - 6) + '" y="' + (by + 12) + '" text-anchor="end" font-size="11.5" fill="var(--muted)" font-variant-numeric="tabular-nums">' +
         pct.toFixed(1) + '%</text>';

    var tip = '<div class="t-title">' + esc(r.name) + '</div>' +
      '<div class="t-row">Spent<b>' + money(r.value) + '</b></div>' +
      '<div class="t-row">Share<b>' + pct.toFixed(1) + '%</b></div>' +
      (r.lump ? '' : '<div class="t-row muted" style="font-size:12px">Tap for sub-categories</div>');
    s += '<rect class="hit" x="0" y="' + y + '" width="' + W + '" height="' + rowH +
         '" data-tip="' + esc(tip) + '"' + (r.lump ? '' : ' data-cat="' + esc(r.name) + '"') + '/>';
  });

  container.innerHTML = '<div class="chartwrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H +
    '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Spending by category">' + s + '</svg></div>';

  var wrap = container.querySelector(".chartwrap");
  var svg = wrap.querySelector("svg");
  attachTip(wrap, svg);
  if (onPick) {
    svg.querySelectorAll("[data-cat]").forEach(function (n) {
      n.addEventListener("click", function () { onPick(n.getAttribute("data-cat")); });
    });
  }
}

/* One sub-category's spend, month by month. Single series, so no legend.
   onPick, if given, is called with the month of a tapped bar. */
function chartSubTrend(container, keys, vals, label, onPick) {
  if (!keys.length) { container.innerHTML = '<div class="empty">No months to chart.</div>'; return; }

  var W = chartWidth(container), H = 186, PL = 62, PR = 12, PT = 20, PB = 42;
  var iw = W - PL - PR, ih = H - PT - PB;
  var top = niceMax(Math.max.apply(null, vals.concat([0])));
  var band = iw / keys.length;
  var bw = Math.max(3, Math.min(26, band - 8));

  var s = "";
  for (var g = 0; g <= 3; g++) {
    var v = top * g / 3, y = PT + ih - (v / top) * ih;
    s += '<line x1="' + PL + '" y1="' + y + '" x2="' + (W - PR) + '" y2="' + y +
         '" stroke="var(--grid)" stroke-width="1"/>' +
         '<text x="' + (PL - 9) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11.5" fill="var(--muted)">' +
         moneyShort(v) + '</text>';
  }

  keys.forEach(function (k, i) {
    var val = vals[i];
    var x = PL + band * i + (band - bw) / 2;
    var h = (val / top) * ih;
    var y = PT + ih - h;
    if (val > 0) s += '<path d="' + barUp(x, y, bw, h, 4) + '" fill="var(--series-2)"/>';

    var tip = '<div class="t-title">' + monthLabel(k) + '</div>' +
      '<div class="t-row">' + esc(label) + '<b>' + money(val) + '</b></div>';
    s += '<rect class="hit" x="' + (PL + band * i) + '" y="' + PT + '" width="' + band + '" height="' + ih +
         '" data-k="' + k + '" data-tip="' + esc(tip) + '"' + (onPick ? ' style="cursor:pointer"' : '') + '/>';
    // Only every other label once the months get tight, to stop them colliding.
    if (band > 34 || i % 2 === 0) {
      s += '<text x="' + (PL + band * i + band / 2) + '" y="' + (H - 22) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' +
           monthShort(k) + '</text>';
    }
    // The months repeat across years, so mark where each new year starts.
    if (i === 0 || k.slice(0, 4) !== keys[i - 1].slice(0, 4)) {
      s += '<line x1="' + (PL + band * i) + '" y1="' + PT + '" x2="' + (PL + band * i) + '" y2="' + (PT + ih + 6) +
           '" stroke="var(--baseline)" stroke-width="1"/>' +
           '<text x="' + (PL + band * i + 4) + '" y="' + (H - 6) + '" font-size="11" font-weight="600" fill="var(--text-secondary)">' +
           k.slice(0, 4) + '</text>';
    }
  });

  container.innerHTML = '<div class="chartwrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H +
    '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="' + esc(label) + ' spending each month">' + s + '</svg></div>';
  var wrap = container.querySelector(".chartwrap");
  attachTip(wrap, wrap.querySelector("svg"));
  if (onPick) wrap.querySelectorAll("rect.hit").forEach(function (r) {
    r.addEventListener("click", function () { onPick(r.getAttribute("data-k")); });
  });
}

/* Net-position sparkline: monthly net, above/below zero. */
function chartNet(container, keys, map, fit) {
  var W = chartWidth(container), H = 150, PL = 62, PR = 12, PT = 18, PB = 26;
  var iw = W - PL - PR, ih = H - PT - PB;
  var vals = keys.map(function (k) { return net(map[k]); });
  var ac = axisCap(vals.map(Math.abs));
  var hiTrue = niceMax(Math.max.apply(null, vals.concat([0])));
  var hi = (fit && ac.any) ? Math.min(ac.cap, hiTrue) : hiTrue;
  var lo = -niceMax(Math.abs(Math.min.apply(null, vals.concat([0]))));
  var span = (hi - lo) || 1;
  var zeroY = PT + ih - ((0 - lo) / span) * ih;
  var band = iw / keys.length;
  var bw = Math.max(4, Math.min(26, band - 8));

  var s = '<line x1="' + PL + '" y1="' + zeroY + '" x2="' + (W - PR) + '" y2="' + zeroY +
          '" stroke="var(--baseline)" stroke-width="1"/>' +
          '<text x="' + (PL - 9) + '" y="' + (zeroY + 4) + '" text-anchor="end" font-size="11.5" fill="var(--muted)">₹0</text>' +
          '<text x="' + (PL - 9) + '" y="' + (PT + 10) + '" text-anchor="end" font-size="11.5" fill="var(--muted)">' + moneyShort(hi) + '</text>';

  keys.forEach(function (k, i) {
    var v = vals[i];
    var over = v > hi;
    var vClamped = Math.min(v, hi);
    var x = PL + band * i + (band - bw) / 2;
    var y = PT + ih - ((vClamped - lo) / span) * ih;
    var h = Math.abs(zeroY - y);
    // Diverging polarity: blue above zero, red below.
    var colour = v >= 0 ? "var(--series-1)" : "var(--critical)";
    var d;
    if (v >= 0) {
      d = barUp(x, y, bw, h, 4);
    } else {
      // mirrored: rounded end at the bottom, anchored to the zero line
      d = "M" + x + "," + zeroY + "V" + (y - 4) + "Q" + x + "," + y + " " + (x + 4) + "," + y +
          "H" + (x + bw - 4) + "Q" + (x + bw) + "," + y + " " + (x + bw) + "," + (y - 4) +
          "V" + zeroY + "Z";
    }
    s += '<path d="' + d + '" fill="' + colour + '"/>';
    if (over) {
      s += breakMark(x, bw, PT);
      s += '<text x="' + (x + bw / 2) + '" y="' + (PT - 6) + '" text-anchor="middle" font-size="10" ' +
           'fill="var(--text-secondary)" font-weight="600">' + moneyShort(v) + '</text>';
    }
    var tip = '<div class="t-title">' + monthLabel(k) + '</div>' +
      '<div class="t-row">Net saved<b>' + money(v) + '</b></div>' +
      '<div class="t-row">Savings rate<b>' + (rate(map[k]) * 100).toFixed(1) + '%</b></div>';
    s += '<rect class="hit" x="' + (PL + band * i) + '" y="' + PT + '" width="' + band + '" height="' + ih +
         '" data-tip="' + esc(tip) + '"/>';
    s += '<text x="' + (PL + band * i + band / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' +
         monthShort(k) + '</text>';
  });

  container.innerHTML = '<div class="chartwrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H +
    '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Net saved each month">' + s + '</svg></div>';
  var wrap = container.querySelector(".chartwrap");
  attachTip(wrap, wrap.querySelector("svg"));
}

var STATE = { ovTaxOpen: {}, mOneOff: (function () { try { return !!localStorage.getItem("ft.mOneOff"); } catch (e) { return false; } })(), mOpen: {}, mYear: "", mCat: "", mSub: "", mcOpen: {}, tab: "overview", month: null, salMonth: null, spendScope: "month", spendCat: null, spendSub: null, fitScale: true,

/* A summary tile that can be tapped. `key` is what it filters to; the tile
   the list is currently filtered by is drawn as selected. Tapping it again
   goes back to everything (see wireTiles). */
function tile(key, current, label, value, sub, title) {
  return '<div class="tile click' + (key && key === current ? ' on' : '') + '" role="button" tabindex="0"' +
    ' data-f="' + esc(key) + '"' + (title ? ' title="' + esc(title) + '"' : '') + '>' +
    '<div class="lbl">' + label + '</div><div class="val">' + value + '</div>' +
    '<div class="sub">' + sub + '</div></div>';

/* Tap or Enter/Space on a tile calls onPick with its key, or with "" when the
   tile is already the active filter. */
function wireTiles(root, current, onPick) {
  root.querySelectorAll(".tile.click").forEach(function (t) {
    function go() { var k = t.getAttribute("data-f"); onPick(k === current ? "" : k); }
    t.addEventListener("click", go);
    t.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); }
    });
  });
}

/* Banks deduct TDS at 10% on FD interest once a bank's interest to you passes
   Rs 50,000 in a financial year (used by the year's tax card's estimate). */
var FD_TDS_RATE = 10, FD_TDS_LIMIT = 50000;



/* The year's income tax, worked out the way Vinod's tax calculator (the
   Nithya TaxCalc he downloads each year) does it under the new regime: total
   taxable income through the slabs, rebate, surcharge and cess -- then less the
   tax already deducted at source. The slabs and limits come from data.json
   (exitTax.regime), copied out of the calculator file by add_exit_values.py, so
   this code holds no rates of its own.

   Income for the financial year:
     salary   - payslips so far, plus the remaining months at the latest month
                without a bonus (employers re-balance tax after a raise or a
                bonus, so this part is an estimate)
     interest - credits already in the ledger this year (Interest sub-category),
                savings interest for quarters not yet credited at the latest
                quarter's rate, and FD interest still building up on FDs held
                now (taxed as it accrues), less anything those FDs already paid.
   Without the regime rules (an older data.json) it falls back to tax on
   interest at the marginal rate. */
/* Overview's one-glance tax summary: per source, the year's tax, what has been
   taken at source, what is still pending, and that spread over the months left.
   Salary's pending part is deducted by the employer month by month; the rest is
   the taxpayer's (advance tax). Full workings live on the Tax Planning tab. */
function taxOverviewCard() {
  var m = yearTaxCard("model");
  if (!m || typeof m !== "object") return "";
  var tTax = 0, tTaken = 0, tPend = 0, mine = 0;
  var body = m.rows.filter(function (r) { return r.tax > 0.5 || r.taken > 0; }).map(function (r) {
    var pend = r.tax - r.taken;
    tTax += r.tax; tTaken += r.taken; tPend += pend;
    if (r.pendingBy === "you") mine += Math.max(0, pend);
    var open = !!STATE.ovTaxOpen[r.key];
    var detail = '<tr class="tax-detail"' + (open ? '' : ' hidden') + ' data-for="' + r.key + '"><td colspan="5">' +
      '<div class="tax-lines">' + (r.lines || []).map(function (l) { return kv(esc(l[0]), Math.round(l[1]), l[2]); }).join('') +
      '</div></td></tr>';
    return '<tr class="tax-row" data-key="' + r.key + '" tabindex="0" role="button" aria-expanded="' + open + '">' +
      '<td><span class="chev">' + (open ? '▾' : '▸') + '</span> ' + esc(r.label) + '<div class="muted" style="font-size:12px;margin-left:16px">' + esc(r.note) + '</div></td>' +
      '<td class="num">' + money(r.tax) + '</td><td class="num">' + money(r.taken) + '</td>' +
      '<td class="num"><b>' + money(pend) + '</b><div class="muted" style="font-size:12px">' +
        (r.pendingBy === "you" ? 'you pay' : 'employer deducts') + '</div></td>' +
      '<td class="num">' + money(Math.max(0, pend) / m.monthsLeft) + '</td></tr>' + detail;
  }).join("");
  return '<div class="card"><h2>Tax · ' + m.fyName + '</h2>' +
    '<p class="cap">Estimated under the new regime. <b>' + money(mine) + '</b> of the pending tax is yours to pay ' +
      '(about ' + money(mine / m.monthsLeft) + ' a month, ' + m.spanLbl + '); the rest your employer deducts from salary. ' +
      'Tap a row to see how it is worked out. ' +
      '<button class="linkish" id="ov-taxlink" style="padding:0">Full workings on Tax Planning →</button></p>' +
    '<div class="tbl-scroll"><table><thead><tr><th>Source</th><th class="num">Tax for the year</th>' +
      '<th class="num">Taken so far</th><th class="num">Pending</th><th class="num">Per month · ' + esc(m.spanLbl) + '</th></tr></thead><tbody>' +
      body +
      '<tr><td><b>Total</b></td><td class="num"><b>' + money(tTax) + '</b></td><td class="num"><b>' + money(tTaken) +
        '</b></td><td class="num"><b>' + money(tPend) + '</b></td><td class="num"><b>' + money(tPend / m.monthsLeft) + '</b></td></tr>' +
    '</tbody></table></div></div>';
}

/* One statement line: label on the left, amount on the right (Salary tiles, tax and cash-in boxes). */
function kv(label, amount, cls) {
  return '<div class="kv' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span>' +
    (amount === null ? '' : '<b>' + (amount < 0 ? '− ' + money(-amount) : money(amount)) + '</b>') + '</div>';
}
function kvText(label, text, cls) {               // a line whose right side is words, not money
  return '<div class="kv' + (cls ? ' ' + cls : '') + '"><span>' + label + '</span><b>' + text + '</b></div>';
}
function yearTaxCard(compact) {         // compact: title and the four boxes only (Overview)
  var tx = DATA.exitTax;
  if (!tx) return "";
  var rg = tx.regime;
  var now = new Date(), y0 = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear() - 1;
  var fyFrom = y0 + "-04", fyTo = (y0 + 1) + "-03";
  var dFrom = y0 + "-04-01", dTo = (y0 + 1) + "-03-31";
  var today = now.toISOString().slice(0, 10);
  var fyName = "FY " + y0 + "-" + String(y0 + 1).slice(2);

  // --- salary
  var slips = (DATA.salary || []).filter(function (p) { return p.m >= fyFrom && p.m <= fyTo; });
  var salGrossSoFar = slips.reduce(function (t, p) { return t + (p.gross || 0); }, 0);
  var salSoFar = slips.reduce(function (t, p) { return t + (p.tax || 0); }, 0);
  var lastSlip = slips[slips.length - 1];
  var left = 0;
  if (lastSlip) {
    var ly = +lastSlip.m.slice(0, 4), lm = +lastSlip.m.slice(5, 7);
    left = (y0 + 1 - ly) * 12 + (3 - lm);                 // months after the last slip to March
  }
  // project at an ordinary month: a bonus or arrears month will not repeat
  var plain = slips.filter(function (p) { return !p.bonus && !p.arrears && !p.oneOff; });
  var rateSlip = plain.length ? plain[plain.length - 1] : lastSlip;
  var salGross = salGrossSoFar + (rateSlip ? left * rateSlip.gross : 0);
  var salYear = salSoFar + (rateSlip ? left * rateSlip.tax : 0);

  // --- interest
  var MONTHS = { JAN: 0, FEB: 1, MAR: 2, APR: 3, MAY: 4, JUN: 5, JUL: 6, AUG: 7, SEP: 8, OCT: 9, NOV: 10, DEC: 11 };
  function tillDate(ds) {                                  // "INTEREST PAID TILL 30-SEP-2026"
    var m = /TILL (\d{2})-([A-Z]{3})-(\d{4})/.exec(ds || "");
    return m ? m[3] + "-" + String(MONTHS[m[2]] + 1).padStart(2, "0") + "-" + m[1] : null;
  }
  var credits = (DATA.txns || []).filter(function (t) { return t.s === "Interest" && t.cr > 0; });
  var sb = credits.filter(function (t) { var d = tillDate(t.ds); return d && d >= dFrom && d <= dTo; });
  var other = credits.filter(function (t) { return !tillDate(t.ds) && t.d >= dFrom && t.d <= dTo; });
  var sbSoFar = sb.reduce(function (s, t) { return s + t.cr; }, 0);
  var lastTill = sb.reduce(function (m, t) { var d = tillDate(t.ds); return d > m ? d : m; }, "");
  var lastQ = sb.filter(function (t) { return tillDate(t.ds) === lastTill; }).reduce(function (s, t) { return s + t.cr; }, 0);
  var qEnds = [y0 + "-06-30", y0 + "-09-30", y0 + "-12-31", (y0 + 1) + "-03-31"];
  var qLeft = qEnds.filter(function (q) { return q > (lastTill || dFrom); }).length;
  var sbProj = lastQ * qLeft;
  var otherSoFar = other.reduce(function (s, t) { return s + t.cr; }, 0);
  // FDs held now: their share of interest for this year, less what they already paid out
  var DAY = 86400000, fdRest = 0;
  (DATA.fds || []).forEach(function (f) {
    if (!f.maturity || f.maturity <= today) return;        // matured: its interest is in the ledger
    var a = new Date(f.start + "T00:00:00"), b = new Date(f.maturity + "T00:00:00");
    var days = Math.round((b - a) / DAY);
    if (!(days > 0)) return;
    var lo = Math.max(a, new Date(y0, 3, 1)), hi = Math.min(b, new Date(y0 + 1, 3, 1));
    var share = hi > lo ? f.interest * Math.round((hi - lo) / DAY) / days : 0;
    var paid = credits.filter(function (t) {
      return f.acct && t.ds.indexOf(f.acct) >= 0 && t.d >= f.start;
    }).reduce(function (s, t) { return s + t.cr; }, 0);
    fdRest += Math.max(0, share - paid);
  });
  var interest = otherSoFar + sbSoFar + sbProj + fdRest;
  // bank TDS: 10% once FD interest from the bank passes the limit (same rule as the FD card)
  var fdInterest = other.filter(function (t) { return /INTEREST CREDIT/.test(t.ds); })
                        .reduce(function (s, t) { return s + t.cr; }, 0) + fdRest;
  var bankTds = fdInterest > FD_TDS_LIMIT ? fdInterest * FD_TDS_RATE / 100 : 0;

  if (!rg) return "";                                       // older data: the interest cards still show

  // --- tax, new regime
  var std = Math.min(rg.std || 0, salGross);
  function taxFor(inc) {                                 // slabs -> rebate -> surcharge -> cess
    var slabTax = 0, rows = [];
    rg.slabs.forEach(function (b) {
      var lo = b.from > 0 ? b.from - 1 : 0, part = Math.max(0, Math.min(inc, b.to) - lo);
      var t = part * b.rate / 100;
      slabTax += t;
      if (part > 0 && b.rate > 0) rows.push([moneyShort(lo) + '–' + (b.to > 1e9 ? '' : moneyShort(b.to)) + ' at ' + b.rate + '%', t]);
    });
    var reb = 0;
    if (inc <= rg.rebateLimit) reb = slabTax;
    else if (inc <= rg.reliefTo) reb = Math.max(0, slabTax - (inc - rg.rebateLimit));
    var after = slabTax - reb, sr = 0;
    (rg.surcharge || []).forEach(function (sc) { if (inc > sc.above) sr = sc.rate; });
    var sur = after * sr / 100, ce = (after + sur) * (rg.cess || 0) / 100;
    return { slabTax: slabTax, rows: rows, rebate: reb, surRate: sr, surcharge: sur, cess: ce, total: after + sur + ce };
  }
  var income = Math.round(Math.max(0, salGross - std) + interest);
  var tf = taxFor(income);
  var slabRows = tf.rows, rebate = tf.rebate, surRate = tf.surRate, surcharge = tf.surcharge, cess = tf.cess;
  var total = tf.total;
  // salary's share = the tax on salary alone; interest's share = what it adds on top
  var salaryTax = taxFor(Math.round(Math.max(0, salGross - std))).total;
  var interestTax = total - salaryTax;
  var paidAtSource = salYear + bankTds;
  var toPay = total - paidAtSource;
  // spread over the months left in the financial year, counting this one (Oct -> Mar = 6)
  var monthsLeft = Math.max(1, (y0 + 1 - now.getFullYear()) * 12 + (2 - now.getMonth()) + 1);
  var perMonth = toPay > 0 ? toPay / monthsLeft : 0;
  var spanLbl = MONTH_NAMES[now.getMonth()] + '–Mar';
  if (compact === "model") {
    var share = function (amt) { return interest > 0 ? interestTax * amt / interest : 0; };
    var fdAmt = fdInterest, sbAmt = sbSoFar + sbProj, otherAmt = Math.max(0, interest - fdAmt - sbAmt);
    var paidOutNames = (DATA.exitValues || []).filter(function (x) { return x.yearlyInterest > 0; })
                                              .map(function (x) { return x.name; });
    // the breakup each Overview row opens into: [label, amount, class]
    var salTaxable = Math.round(Math.max(0, salGross - std)), st = taxFor(salTaxable);
    var rate = interest > 0 ? Math.round(interestTax / interest * 1000) / 10 : 0;
    var rateLine = 'Tax at ' + rate + '% (your top slab + cess)';
    var intLines = function (amtLines, amt, taken, takenLbl) {
      var t = share(amt);
      return amtLines.concat([[rateLine, t], ['Tax for the year', t, 'total'],
        [takenLbl, -taken], ['Pending, you pay', t - taken, 'total']]);
    };
    var fdPaid = Math.max(0, fdAmt - fdRest);
    return { fyName: fyName, monthsLeft: monthsLeft, spanLbl: spanLbl, total: total,
      rows: [
        { key: "salary", label: "Salary", income: salGross, tax: salaryTax, taken: salSoFar,
          pendingBy: "employer", note: "deducted by your employer each month",
          lines: [['Salary for the year', salGross], ['Less standard deduction', -std], ['Taxable salary', salTaxable, 'total'],
            ['Tax on the slabs', st.slabTax]].concat(st.rebate > 0 ? [['Less 87A rebate', -st.rebate]] : [])
            .concat(st.surcharge > 0 ? [['Plus ' + st.surRate + '% surcharge', st.surcharge]] : [])
            .concat([['Plus ' + (rg.cess || 0) + '% cess', st.cess], ['Tax for the year', salaryTax, 'total'],
              ['Deducted so far (' + slips.length + ' payslips)', -salSoFar], ['Pending', salaryTax - salSoFar, 'total'],
              ['Employer will deduct, at the current rate', salYear - salSoFar, 'note']]) },
        { key: "fd", label: "Fixed deposit interest", income: fdAmt, tax: share(fdAmt), taken: bankTds,
          pendingBy: "you", note: "bank TDS estimated",
          lines: intLines([['Interest paid so far', fdPaid], ['Interest still accruing', fdRest], ['Interest for the year', fdAmt, 'total']],
                          fdAmt, bankTds, 'Less bank TDS (estimate)') },
        { key: "other", label: (paidOutNames.length ? paidOutNames.join(", ") : "Other") + " interest", income: otherAmt,
          tax: share(otherAmt), taken: 0, pendingBy: "you", note: "no TDS",
          lines: intLines([['Interest for the year', otherAmt, 'total']], otherAmt, 0, 'No TDS deducted') },
        { key: "sb", label: "Savings account interest", income: sbAmt, tax: share(sbAmt), taken: 0,
          pendingBy: "you", note: "no TDS",
          lines: intLines([['Credited so far', sbSoFar], ['Still to come (estimate)', sbProj], ['Interest for the year', sbAmt, 'total']],
                          sbAmt, 0, 'No TDS deducted') }
      ] };
  }

  function line(label, amount, note, strong) {
    return '<tr><td>' + (strong ? '<b>' + label + '</b>' : label) +
      (note ? '<div class="muted" style="font-size:12px">' + note + '</div>' : '') + '</td>' +
      '<td class="num">' + (amount === null ? '' : (function (v) {
        var t = (amount < 0 ? '−' : '') + v;
        return strong ? '<b>' + t + '</b>' : t;
      })(money(Math.abs(amount)))) + '</td></tr>';
  }
  var src = esc(rg.source || "your tax calculator");
  var head = '<div class="card"><h2>Tax for the year · ' + fyName + ' · new regime</h2>';
  var caption =
    '<p class="cap">Worked out the way your tax calculator does it (' + src + '): your whole income for the ' +
      'year through the new-regime slabs, then less the tax already taken at source. A heads-up to plan with, ' +
      'not tax advice — the October raise, any ex-gratia and the rest of the year\'s interest will move it.</p>';
  var plural = function (n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); };
  var salLeft = salYear - salSoFar;
  var boxes =
    '<div class="grid k4">' +
      '<div class="exit-box"><div class="lbl">Tax for the year</div><div class="v">' + money(total) + '</div>' +
        kv('Salary for the year', Math.round(salGross)) +
        kv('Less standard deduction', -std) +
        kv('Plus interest income', Math.round(interest)) +
        kv('Taxable income', income, 'total') +
        kv('Tax on the slabs', Math.round(tf.slabTax)) +
        (rebate > 0 ? kv('Less 87A rebate', -Math.round(rebate)) : '') +
        (surcharge > 0 ? kv('Plus ' + surRate + '% surcharge', Math.round(surcharge)) : '') +
        kv('Plus ' + (rg.cess || 0) + '% cess', Math.round(cess)) +
        kv('Tax for the year', Math.round(total), 'total') +
      '</div>' +
      '<div class="exit-box"><div class="lbl">Taken at source</div><div class="v">' + money(paidAtSource) + '</div>' +
        kv('Salary tax so far', Math.round(salSoFar)) +
        kv('Salary tax to come', Math.round(salLeft)) +
        kv('Bank TDS on FD interest', Math.round(bankTds)) +
        kv('Taken at source', Math.round(paidAtSource), 'total') +
        kvText(plural(slips.length, 'payslip') + ' so far; ' + plural(left, 'month') + ' to come', '', 'note') +
        (bankTds ? '' : kvText('No bank TDS: FD interest under ' + money(FD_TDS_LIMIT), '', 'note')) +
      '</div>' +
      '<div class="exit-box"><div class="lbl">' + (toPay >= 0 ? 'Left for you to pay' : 'Likely refund') + '</div>' +
        '<div class="v">' + money(Math.abs(toPay)) + '</div>' +
        kv('Tax for the year', Math.round(total)) +
        kv('Less taken at source', -Math.round(paidAtSource)) +
        kv(toPay >= 0 ? 'Left for you to pay' : 'Likely refund', Math.round(Math.abs(toPay)), 'total') +
        (toPay >= 0
          ? kv('About this much a month', Math.round(perMonth)) +
            kvText('Over ' + plural(monthsLeft, 'month') + ' (' + spanLbl + ')', '', 'note')
          : kvText('More is being taken at source than is due', '', 'note')) +
      '</div>' +
      '<div class="exit-box"><div class="lbl">Interest income</div><div class="v">' + money(interest) + '</div>' +
        kv('FD & bond interest paid', Math.round(otherSoFar)) +
        kv('Savings interest credited', Math.round(sbSoFar)) +
        kv('Savings interest to come', Math.round(sbProj)) +
        kv('FD interest accruing', Math.round(fdRest)) +
        kv('Interest for the year', Math.round(interest), 'total') +
        kvText(money(otherSoFar + sbSoFar) + ' received so far; the rest is estimated', '', 'note') +
      '</div>' +
    '</div>';
  if (compact) return head + boxes + '</div>';
  return head + caption + boxes +
    '<div class="tbl-scroll" style="margin-top:12px"><table><tbody>' +
      line('Salary', salGross, money(salGrossSoFar) + ' from ' + slips.length + ' payslips' +
        (left ? ' + ' + left + ' months at ' + money(rateSlip.gross) + ' (' + monthLabel(rateSlip.m) + ', the latest month without a bonus)' : '')) +
      line('Less standard deduction', -std, '') +
      line('Interest already received', otherSoFar, other.length + ' credits this year — FDs, bonds and others') +
      line('Savings account interest', sbSoFar + sbProj, money(sbSoFar) + ' credited' +
        (qLeft ? ' + ' + qLeft + ' more quarter' + (qLeft > 1 ? 's' : '') + ' at ' + money(lastQ) + ' (latest quarter)' : '')) +
      line('FD interest still building up', fdRest, 'on the FDs you hold now, taxed as it accrues') +
      line('Taxable income', income, '', true) +
      slabRows.map(function (r) { return line('Tax ' + r[0], r[1], ''); }).join("") +
      (rebate ? line('Less rebate (sec 87A)', -rebate, '') : '') +
      (surcharge ? line('Surcharge ' + surRate + '%', surcharge, '') : '') +
      line('Cess ' + (rg.cess || 0) + '%', cess, '') +
      line('Tax for the year', total, '', true) +
      line('Less salary tax (TDS)', -salYear, money(salSoFar) + ' deducted so far' + (left ? ', ' + money(salYear - salSoFar) + ' expected over ' + left + ' months' : '')) +
      line('Less bank TDS on FD interest', -bankTds, bankTds ? FD_TDS_RATE + '% once FD interest passes ' + money(FD_TDS_LIMIT) + ' (estimate)' : 'under the limit') +
      line(toPay >= 0 ? 'Left for you to pay' : 'Likely refund', Math.abs(toPay),
        toPay >= 0 ? 'about ' + money(perMonth) + ' a month for the ' + monthsLeft + ' months ' + spanLbl +
          '; advance-tax instalments fall due on 15 Dec (75% of the year\'s tax) and 15 Mar (100%)' : '', true) +
    '</tbody></table></div></div>';
}

function renderOverview() {
  var idx = monthsIndex(DATA.txns);
  var keys = idx.keys, map = idx.map;
  if (!STATE.month || keys.indexOf(STATE.month) < 0) STATE.month = keys[keys.length - 1];

  var a = map[STATE.month] || blankAgg();
  var pos = keys.indexOf(STATE.month);
  var prev = pos > 0 ? map[keys[pos - 1]] : null;

  function delta(cur, was, goodWhenUp) {
    if (!was || was === 0) return '<div class="sub muted">no prior month</div>';
    var pct = (cur - was) / Math.abs(was) * 100;
    var up = pct >= 0;
    var good = goodWhenUp ? up : !up;
    var arrow = up ? "↑" : "↓";
    return '<div class="sub ' + (good ? "up" : "down") + '">' + arrow + " " +
           Math.abs(pct).toFixed(1) + "% vs " + monthLabel(keys[pos - 1]) + "</div>";
  }

  var last12 = keys.slice(-12);
  var yr = STATE.month.slice(0, 4);
  var ytd = blankAgg();
  keys.forEach(function (k) {
    if (k.slice(0, 4) === yr && k <= STATE.month) {
      var m = map[k];
      ytd.income += m.income; ytd.expense += m.expense; ytd.invest += m.invest; ytd.count += m.count;
    }
  });

  var cats = categoryTotals(DATA.txns, STATE.month);
  var catTotal = cats.reduce(function (s, r) { return s + r.value; }, 0);

  var html =
    '<div class="filters">' +
      '<div class="f"><label for="ov-month">Month</label>' +
      '<select id="ov-month">' + monthOptions(keys, STATE.month, false) + '</select></div>' +
    '</div>' +

    '<div class="grid k4" id="ov-tiles" style="margin-bottom:16px">' +
      '<div class="tile click" role="button" tabindex="0"><div class="lbl">Income</div><div class="val">' + money(a.income) + '</div>' + delta(a.income, prev && prev.income, true) + '</div>' +
      '<div class="tile click" role="button" tabindex="0"><div class="lbl">Expenses</div><div class="val">' + money(a.expense) + '</div>' + delta(a.expense, prev && prev.expense, false) + '</div>' +
      '<div class="tile click" role="button" tabindex="0"><div class="lbl">Net saved</div><div class="val">' + money(net(a)) + '</div>' +
        '<div class="sub">' + (a.invest > 0 ? "after " + money(a.invest) + " newly invested"
          : a.invest < 0 ? "including " + money(-a.invest) + " drawn from savings"
          : "nothing newly invested this month") + '</div></div>' +
      '<div class="tile click" role="button" tabindex="0"><div class="lbl">Savings rate</div><div class="val">' + (rate(a) * 100).toFixed(1) + '%</div>' +
        '<div class="sub">' + a.count + ' transactions</div></div>' +
    '</div>' +

    taxOverviewCard() +

    '<div class="card"><h2>Income vs expenses</h2><p class="cap">Last ' + last12.length + ' months. Tap a month for detail.</p>' +
      '<div id="c-ie"></div></div>' +

    '<div class="grid split">' +
      '<div class="card"><h2>Where ' + monthLabel(STATE.month) + ' went</h2>' +
        '<p class="cap">' + money(catTotal) + ' across ' + cats.length + ' categories. Tap a bar to open it.</p>' +
        '<div id="c-cat"></div></div>' +
      '<div class="card"><h2>Net saved each month</h2><p class="cap">Income minus expenses and new money invested. An FD that matures and is reinvested counts only its interest.</p>' +
        '<div id="c-net"></div>' +
        '<div style="margin-top:18px;border-top:1px solid var(--grid);padding-top:14px">' +
          '<div style="font-size:13px;font-weight:600;margin-bottom:8px">' + yr + ' year to date</div>' +
          '<table><tbody>' +
            '<tr><td>Income</td><td class="num">' + money(ytd.income) + '</td></tr>' +
            '<tr><td>Expenses</td><td class="num">' + money(ytd.expense) + '</td></tr>' +
            '<tr><td>Invested</td><td class="num">' + money(ytd.invest) + '</td></tr>' +
            '<tr><td><b>Net saved</b></td><td class="num"><b>' + money(net(ytd)) + '</b></td></tr>' +
          '</tbody></table>' +
        '</div>' +
      '</div>' +
    '</div>';

  var host = el("tab-overview");
  host.innerHTML = html;
  // the four tiles open this month on the Monthly tab
  wireTiles(el("ov-tiles"), null, function () { openMonth(STATE.month); });
  var taxLink = el("ov-taxlink");
  if (taxLink) taxLink.addEventListener("click", function () { switchTab("tax"); });
  // tax rows open into their breakup in place; remembered while the app is open
  host.querySelectorAll(".tax-row").forEach(function (tr) {
    function toggle() {
      var key = tr.getAttribute("data-key"), open = !STATE.ovTaxOpen[key];
      STATE.ovTaxOpen[key] = open;
      host.querySelector('.tax-detail[data-for="' + key + '"]').hidden = !open;
      tr.setAttribute("aria-expanded", open);
      tr.querySelector(".chev").textContent = open ? "▾" : "▸";
    }
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  });
  chartIncomeExpense(el("c-ie"), last12, map, STATE.fitScale);
  chartCategories(el("c-cat"), cats, catTotal, function (cat) {
    STATE.spendCat = cat; STATE.spendScope = "month"; switchTab("spending");
  });
  chartNet(el("c-net"), last12, map, STATE.fitScale);

  el("ov-month").addEventListener("change", function () { STATE.month = this.value; renderOverview(); });
}

function renderSpending() {
  var idx = monthsIndex(DATA.txns);
  var keys = idx.keys;
  if (!STATE.month || keys.indexOf(STATE.month) < 0) STATE.month = keys[keys.length - 1];
  var scopeMonth = STATE.spendScope === "month" ? STATE.month : null;

  var cats = categoryTotals(DATA.txns, scopeMonth);
  var total = cats.reduce(function (s, r) { return s + r.value; }, 0);
  if (STATE.spendCat && !cats.some(function (c) { return c.name === STATE.spendCat; })) STATE.spendCat = null;
  if (!STATE.spendCat) STATE.spendSub = null;

  // Sub-categories depend on the chosen category, exactly as on Transactions.
  var subs = STATE.spendCat ? subCategoryTotals(DATA.txns, STATE.spendCat, scopeMonth) : [];
  if (STATE.spendSub && !subs.some(function (r) { return r.name === STATE.spendSub; })) STATE.spendSub = null;

  function pickOpts(list, sel, allLabel) {
    var o = '<option value="">' + allLabel + '</option>';
    list.forEach(function (r) {
      o += '<option value="' + esc(r.name) + '"' + (r.name === sel ? " selected" : "") + '>' + esc(r.name) + '</option>';
    });
    return o;
  }

  var months = scopeMonth ? 1 : keys.length;

  var html =
    '<div class="filters">' +
      '<div class="f"><label>Period</label><div class="seg">' +
        '<button id="sc-month" aria-pressed="' + (STATE.spendScope === "month") + '">Single month</button>' +
        '<button id="sc-all"   aria-pressed="' + (STATE.spendScope === "all") + '">All time</button>' +
      '</div></div>' +
      (STATE.spendScope === "month"
        ? '<div class="f"><label for="sp-month">Month</label><select id="sp-month">' + monthOptions(keys, STATE.month, false) + '</select></div>'
        : "") +
      '<div class="f"><label for="sp-cat">Category</label><select id="sp-cat">' +
        pickOpts(cats, STATE.spendCat, "All categories") + '</select></div>' +
      '<div class="f"><label for="sp-sub">Sub-category</label><select id="sp-sub"' + (STATE.spendCat ? "" : " disabled") + '>' +
        (STATE.spendCat
          ? pickOpts(subs, STATE.spendSub, "All sub-categories")
          : '<option value="">Pick a category first</option>') + '</select></div>' +
    '</div>' +

    '<div class="grid k4" style="margin-bottom:16px">' +
      '<div class="tile"><div class="lbl">Total spent</div><div class="val">' + money(total) + '</div>' +
        '<div class="sub">' + (scopeMonth ? monthLabel(scopeMonth) : keys.length + " months") + '</div></div>' +
      '<div class="tile"><div class="lbl">Categories</div><div class="val">' + cats.length + '</div>' +
        '<div class="sub">' + (cats[0] ? esc(cats[0].name) + " leads" : "—") + '</div></div>' +
      '<div class="tile"><div class="lbl">Monthly average</div><div class="val">' + money(total / months) + '</div>' +
        '<div class="sub">across ' + months + ' month' + (months === 1 ? "" : "s") + '</div></div>' +
      '<div class="tile"><div class="lbl">Biggest category</div><div class="val" style="font-size:19px">' +
        (cats[0] ? money(cats[0].value) : "—") + '</div>' +
        '<div class="sub">' + (cats[0] ? (cats[0].value / (total || 1) * 100).toFixed(1) + "% of spending" : "—") + '</div></div>' +
    '</div>' +

    '<div class="card"><h2>Spending by category</h2>' +
      '<p class="cap">' + (scopeMonth ? monthLabel(scopeMonth) : "All time") + '. Tap a bar to break it down.</p>' +
      '<div id="s-cat"></div></div>' +

    '<div class="card" id="s-sub-card">' +
      (STATE.spendCat
        ? '<h2>' + esc(STATE.spendCat) + '</h2><p class="cap">Sub-categories, ' +
          (scopeMonth ? monthLabel(scopeMonth) : "all time") + '.</p><div id="s-sub"></div>'
        : '<h2>Sub-category detail</h2><p class="cap">Choose a category above — or tap its bar — to break it into sub-categories.</p>') +
    '</div>' +

    (STATE.spendSub
