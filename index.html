      ? '<div class="card"><h2>' + esc(STATE.spendSub) + ' month by month</h2>' +
        '<p class="cap">Every month on record, not just the period chosen above, so the trend is readable.</p>' +
        '<div id="s-trend"></div></div>'
      : "");

  var host = el("tab-spending");
  host.innerHTML = html;

  chartCategories(el("s-cat"), cats, total, function (cat) {
    STATE.spendCat = cat; STATE.spendSub = null; renderSpending();
  }, STATE.spendCat);

  if (STATE.spendCat) {
    var subTotal = subs.reduce(function (s, r) { return s + r.value; }, 0);
    chartCategories(el("s-sub"), subs, subTotal, function (sub) {
      STATE.spendSub = sub; renderSpending();
    }, STATE.spendSub);
  }
  if (STATE.spendSub) {
    chartSubTrend(el("s-trend"), keys, subMonthlyTotals(DATA.txns, STATE.spendCat, STATE.spendSub, keys), STATE.spendSub);
  }

  el("sc-month").addEventListener("click", function () { STATE.spendScope = "month"; renderSpending(); });
  el("sc-all").addEventListener("click", function () { STATE.spendScope = "all"; renderSpending(); });
  var sm = el("sp-month");
  if (sm) sm.addEventListener("change", function () { STATE.month = this.value; renderSpending(); });
  // Changing the category invalidates whatever sub-category sat under it.
  el("sp-cat").addEventListener("change", function () {
    STATE.spendCat = this.value || null; STATE.spendSub = null; renderSpending();
  });
  el("sp-sub").addEventListener("change", function () { STATE.spendSub = this.value || null; renderSpending(); });
}

function filteredTxns() {
  var q = STATE.tq.trim().toLowerCase();
  return DATA.txns.filter(function (t) {
    if (STATE.tAcct && t.ac !== STATE.tAcct) return false;
    if (STATE.tCat && t.c !== STATE.tCat) return false;
    if (STATE.tSub && t.s !== STATE.tSub) return false;
    if (STATE.tType && t.t !== STATE.tType) return false;
    if (STATE.tMonth && monthKey(t.d) !== STATE.tMonth) return false;
    var rowHit = t.row && (q === String(t.row) || q === "#" + t.row);
    if (q && !rowHit && (t.ds + " " + t.c + " " + t.s + " " + t.m + " " + t.n + " " + (t.ref || ""))
               .toLowerCase().indexOf(q) < 0) return false;
    return true;
  }).sort(function (a, b) { return a.d < b.d ? 1 : a.d > b.d ? -1 : 0; });
}

function renderTxns() {
  var idx = monthsIndex(DATA.txns);
  var accts = {}, cats = {};
  DATA.txns.forEach(function (t) { accts[t.ac] = 1; cats[t.c] = 1; });
  var acctList = Object.keys(accts).sort();
  var catList = Object.keys(cats).sort();

  /*
   * Sub-categories depend on the chosen category: the same sub-category name
   * can appear under several categories, so an unscoped list would be
   * ambiguous. With no category picked the select is disabled rather than
   * hidden, so the row of filters does not jump about as you use it.
   */
  var subSet = {};
  if (STATE.tCat) {
    DATA.txns.forEach(function (t) { if (t.c === STATE.tCat && t.s) subSet[t.s] = 1; });
  }
  var subList = Object.keys(subSet).sort();
  if (STATE.tSub && subList.indexOf(STATE.tSub) < 0) STATE.tSub = "";

  var rows = filteredTxns();
  var shown = rows.slice(0, STATE.tLimit);
  var debits = rows.reduce(function (s, t) { return s + (t.t === "Expense" ? t.db : 0); }, 0);
  var credits = rows.reduce(function (s, t) { return s + (t.t === "Income" ? t.cr : 0); }, 0);
  var nExcluded = rows.reduce(function (s, t) { return s + (t.x ? 1 : 0); }, 0);

  function opts(list, sel, allLabel) {
    var o = '<option value="">' + allLabel + "</option>";
    list.forEach(function (v) { o += '<option value="' + esc(v) + '"' + (v === sel ? " selected" : "") + ">" + esc(v) + "</option>"; });
    return o;
  }

  var html =
    '<div class="filters">' +
      '<div class="f"><label for="t-q">Search</label><input id="t-q" type="text" placeholder="Merchant, description, note, reference, row…" value="' + esc(STATE.tq) + '"></div>' +
      '<div class="f"><label for="t-month">Month</label><select id="t-month">' + monthOptions(idx.keys, STATE.tMonth, true) + '</select></div>' +
      '<div class="f"><label for="t-acct">Account</label><select id="t-acct">' + opts(acctList, STATE.tAcct, "All accounts") + '</select></div>' +
      '<div class="f"><label for="t-cat">Category</label><select id="t-cat">' + opts(catList, STATE.tCat, "All categories") + '</select></div>' +
      '<div class="f"><label for="t-sub">Sub-category</label><select id="t-sub"' + (STATE.tCat ? "" : " disabled") + '>' +
        (STATE.tCat
          ? opts(subList, STATE.tSub, "All sub-categories")
          : '<option value="">Pick a category first</option>') + '</select></div>' +
      '<div class="f"><label for="t-type">Type</label><select id="t-type">' + opts(["Expense","Income","Savings","Transfer"], STATE.tType, "All types") + '</select></div>' +
      '<div class="f"><label>&nbsp;</label><button id="t-clear">Clear</button></div>' +
    '</div>' +

    '<div class="grid k4" style="margin-bottom:16px">' +
      '<div class="tile"><div class="lbl">Matching</div><div class="val">' + rows.length + '</div><div class="sub">of ' + DATA.txns.length + ' transactions</div></div>' +
      '<div class="tile"><div class="lbl">Money out</div><div class="val">' + money(debits) + '</div><div class="sub">expenses only</div></div>' +
      '<div class="tile"><div class="lbl">Money in</div><div class="val">' + money(credits) + '</div><div class="sub">income only</div></div>' +
      '<div class="tile"><div class="lbl">Net</div><div class="val">' + money(credits - debits) + '</div><div class="sub">in minus out</div></div>' +
    '</div>' +

    (nExcluded
      ? '<p class="cap" style="margin:-4px 0 16px">These totals cover every row listed below, including the ' + nExcluded +
        ' marked <span class="pill warn">excluded from charts</span> — so they will not always match the Overview tab, which leaves those out.</p>'
      : "") +

    '<div class="card">' +
      (rows.length === 0
        ? '<div class="empty">Nothing matches those filters.</div>'
        : '<div class="tbl-scroll"><table><thead><tr>' +
          '<th class="rowno">Row</th><th>Date</th><th>Description</th><th>Category</th><th>Account</th>' +
          '<th class="num">Out</th><th class="num">In</th><th>Reference</th>' +
          '</tr></thead><tbody>' +
          shown.map(function (t) {
            return '<tr>' +
              '<td class="rowno">' + (t.row || "—") + '</td>' +
              '<td style="white-space:nowrap">' + dayLabel(t.d) + '<div class="muted" style="font-size:11px">' + t.d.slice(0, 4) + '</div></td>' +
              '<td class="desc">' + esc(t.ds) +
                (t.n ? '<div class="muted" style="font-size:12px;margin-top:2px">' + esc(t.n) + '</div>' : "") +
                (t.x ? ' <span class="pill warn">excluded from charts</span>' : "") + '</td>' +
              '<td><span class="pill">' + esc(t.c) + '</span><div class="muted" style="font-size:11.5px;margin-top:3px">' + esc(t.s) + '</div></td>' +
              '<td style="white-space:nowrap">' + esc(t.ac) + '</td>' +
              '<td class="num">' + (t.db ? moneyExact(t.db) : '<span class="muted">—</span>') + '</td>' +
              '<td class="num">' + (t.cr ? '<span class="up">' + moneyExact(t.cr) + '</span>' : '<span class="muted">—</span>') + '</td>' +
              '<td class="muted" style="font-variant-numeric:tabular-nums;font-size:12.5px;white-space:nowrap">' +
                (t.ref ? esc(t.ref) : "—") + '</td>' +
            '</tr>';
          }).join("") +
          '</tbody></table></div>' +
          (rows.length > shown.length
            ? '<div style="text-align:center;padding-top:14px"><button id="t-more">Show 200 more (' + (rows.length - shown.length) + ' remaining)</button></div>'
            : "")) +
    '</div>';

  var host = el("tab-txns");
  host.innerHTML = html;

  var q = el("t-q");
  var timer = null;
  q.addEventListener("input", function () {
    clearTimeout(timer);
    var v = this.value;
    timer = setTimeout(function () {
      STATE.tq = v; STATE.tLimit = 200; renderTxns();
      var f = el("t-q"); f.focus(); f.setSelectionRange(f.value.length, f.value.length);
    }, 250);
  });
  ["t-month:tMonth", "t-acct:tAcct", "t-sub:tSub", "t-type:tType"].forEach(function (pair) {
    var p = pair.split(":");
    el(p[0]).addEventListener("change", function () { STATE[p[1]] = this.value; STATE.tLimit = 200; renderTxns(); });
  });
  // Changing the category invalidates whatever sub-category was chosen under it.
  el("t-cat").addEventListener("change", function () {
    STATE.tCat = this.value; STATE.tSub = ""; STATE.tLimit = 200; renderTxns();
  });
  el("t-clear").addEventListener("click", function () {
    STATE.tq = ""; STATE.tAcct = ""; STATE.tCat = ""; STATE.tSub = "";
    STATE.tType = ""; STATE.tMonth = ""; STATE.tLimit = 200; renderTxns();
  });
  var more = el("t-more");
  if (more) more.addEventListener("click", function () { STATE.tLimit += 200; renderTxns(); });
}

function renderAssets() {
  var mov = accountMovement(DATA.txns);
  var today = new Date().toISOString().slice(0, 10);

  function isCard(a) { return /credit/i.test(a.type || ""); }

  /* Movement recorded after the date the stated balance applies to. */
  function movementSince(name, since) {
    var t = { in: 0, out: 0, n: 0 };
    if (!since) return t;
    DATA.txns.forEach(function (x) {
      if (x.ac !== name || x.d <= since) return;
      t.in += x.cr; t.out += x.db; t.n++;
    });
    return t;
  }

  var banks = DATA.accounts.filter(function (a) { return !isCard(a); });
  var cards = DATA.accounts.filter(isCard);

  var anyBalance = banks.some(function (a) { return a.balance !== null && a.balance !== undefined; });

  /* One card per account. The headline is the balance NOW (stated balance plus
     everything recorded since); the stated figure and its date sit underneath,
     because a balance with no date is the thing that misleads. */
  var bankHtml = banks.map(function (a) {
    var m = mov[a.name];
    var stated = (a.balance !== null && a.balance !== undefined);
    var since = stated ? movementSince(a.name, a.balanceAsOf) : null;
    var projected = stated ? a.balance + since.in - since.out : null;
    var net = since ? since.in - since.out : 0;

    return '<div class="acct-card">' +
      '<div class="ac-name">' + esc(a.name) + '</div>' +
      '<div class="ac-sub">' + esc(a.bank || "") + '</div>' +
      (projected !== null
        ? '<div class="ac-val">' + money(projected) + '</div><div class="ac-val-lbl">balance now</div>'
        : '<div class="ac-val muted">—</div><div class="ac-val-lbl">no balance entered</div>') +
      '<div class="ac-rows">' +
        '<div class="ac-row"><span>Stated balance</span><span>' + (stated
          ? '<b>' + money(a.balance) + '</b>' +
            (a.balanceAsOf ? ' <span class="muted">as of ' + dayLabel(a.balanceAsOf) + " " + a.balanceAsOf.slice(0, 4) + '</span>'
                           : ' <span class="muted">no date given</span>')
          : '<span class="muted">not provided</span>') + '</span></div>' +
        '<div class="ac-row"><span>Movement since</span><span>' + (stated && a.balanceAsOf
          ? (since.n
              ? '<span class="' + (net >= 0 ? "up" : "down") + '">' + money(net) + '</span>' +
                ' <span class="muted">' + since.n + ' txns</span>'
              : '<span class="muted">none</span>')
          : '<span class="muted">—</span>') + '</span></div>' +
        '<div class="ac-row"><span>Last transaction</span><span class="muted">' +
          (m ? dayLabel(m.last) + " " + m.last.slice(0, 4) : "—") + '</span></div>' +
      '</div>' +
    '</div>';
  }).join("");

  /* EMI still owed, per card, from the latest statement of each loan.
     A loan whose principal and interest have both reached zero is paid off, so
     it is dropped everywhere "active" or "still to pay" is meant. */
  var activeEmis = DATA.emis.filter(function (e) { return e.balP > 0 || e.balI > 0; });
  var emiByCard = {};
  activeEmis.forEach(function (e) {
    var k = String(e.card);
    if (!emiByCard[k]) emiByCard[k] = { p: 0, i: 0, n: 0 };
    emiByCard[k].p += e.balP; emiByCard[k].i += e.balI; emiByCard[k].n++;
  });
  /* Match on the account code (XX7339); card names like "HDFC.CC" hold no digits. */
  function emiFor(a) {
    var tail = String(a.code || a.name).replace(/\D/g, "").slice(-4);
    if (!tail) return null;
    for (var k in emiByCard) if (String(k).replace(/\D/g, "").slice(-4) === tail) return emiByCard[k];
    return null;
  }
  function cardTxnCount(a) {
    var tail = String(a.code || a.name).replace(/\D/g, "").slice(-4);
    if (!tail) return 0;
    return DATA.cc.filter(function (c) {
      return String(c.card).replace(/\D/g, "").slice(-4) === tail;
    }).length;
  }

  /* One card per credit card. Amount due is the headline because it is what has
     to be paid; the due date keeps its pill, which turns red once it is past. */
  var cardHtml = cards.map(function (a) {
    var e = emiFor(a);
    var stated = (a.due !== null && a.due !== undefined);
    var overdue = a.dueDate && a.dueDate < today;
    var soon = a.dueDate && !overdue &&
               Math.round((new Date(a.dueDate) - new Date(today)) / 86400000) <= 5;
    return '<div class="acct-card">' +
      '<div class="ac-name">' + esc(a.name) + '</div>' +
      '<div class="ac-sub">' + esc(a.code || "") + (a.notes ? " · " + esc(a.notes) : "") +
        '<br>' + cardTxnCount(a) + ' card txns on file</div>' +
      (stated
        ? '<div class="ac-val">' + money(a.due) + '</div><div class="ac-val-lbl">amount due</div>'
        : '<div class="ac-val muted">—</div><div class="ac-val-lbl">no statement entered</div>') +
      '<div class="ac-rows">' +
        '<div class="ac-row"><span>Due date</span><span>' + (a.dueDate
          ? '<span class="pill' + (overdue ? " bad" : soon ? " warn" : "") + '">' + dayLabel(a.dueDate) + '</span>'
          : '<span class="muted">—</span>') + '</span></div>' +
        '<div class="ac-row"><span>Minimum due</span><span>' +
          (a.minDue !== null && a.minDue !== undefined ? money(a.minDue) : '<span class="muted">—</span>') + '</span></div>' +
        '<div class="ac-row"><span>Statement</span><span class="muted">' +
          (a.stmtDate ? dayLabel(a.stmtDate) + " " + a.stmtDate.slice(0, 4) : "—") + '</span></div>' +
        '<div class="ac-row"><span>EMI outstanding</span><span>' + (e && (e.p + e.i)
          ? money(e.p + e.i) + ' <span class="muted">' + e.n + ' loans</span>'
          : '<span class="muted">none</span>') + '</span></div>' +
      '</div>' +
    '</div>';
  }).join("");

  var goalHtml = DATA.goals.length ? DATA.goals.map(function (g) {
    var pct = Math.max(0, Math.min(100, g.saved / g.target * 100));
    return '<div class="goal">' +
      '<div class="goal-head"><span class="g-name">' + esc(g.name) + '</span>' +
      '<span class="pill">' + pct.toFixed(0) + '%</span>' +
      '<span class="g-amt">' + money(g.saved) + " of " + money(g.target) + '</span></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="muted" style="font-size:12px;margin-top:6px">' +
        (g.date ? "Target " + dayLabel(g.date) + " " + g.date.slice(0, 4) : "No target date") +
        " · " + money(Math.max(0, g.target - g.saved)) + " to go" +
      '</div></div>';
  }).join("") : '<div class="empty">No savings goals set.</div>';

  var fdTotal = DATA.fds.reduce(function (s, f) { return s + f.principal; }, 0);
  var fdInt = DATA.fds.reduce(function (s, f) { return s + f.interest; }, 0);
  var fdHtml = DATA.fds.length ? DATA.fds.map(function (f) {
    var matured = f.maturity && f.maturity < today;
    var days = f.maturity ? Math.round((new Date(f.maturity) - new Date(today)) / 86400000) : null;
    return '<tr>' +
      '<td><b>' + esc(f.id) + '</b><div class="muted" style="font-size:12px">' +
        (f.bank ? esc(f.bank) + " · " : "") + f.rate + '% p.a.</div>' +
        // the account number is what ties this row to an FD advice or a bank
        // statement, so it is worth the second line rather than a tooltip
        (f.acct ? '<div class="acct">' + esc(f.acct) + '</div>' : "") + '</td>' +
      '<td class="num">' + money(f.principal) + '</td>' +
      '<td class="num">' + money(f.matAmt) + '<div class="muted" style="font-size:12px">+' + money(f.interest) + '</div></td>' +
      '<td>' + (f.maturity ? dayLabel(f.maturity) + " " + f.maturity.slice(0, 4) : "—") + '</td>' +
      '<td>' + (matured ? '<span class="pill ok">matured</span>'
                        : '<span class="pill' + (days !== null && days <= 30 ? " warn" : "") + '">' + (days !== null ? days + " days" : "—") + '</span>') + '</td>' +
    '</tr>';
  }).join("") : "";

  // Older data.json files predate the Investments sheet, so this may be absent.
  var invs = DATA.investments || [];
  var invValue = invs.reduce(function (s, i) { return s + i.value; }, 0);
  var invCost  = invs.reduce(function (s, i) { return s + i.invested; }, 0);
  var invGain  = invValue - invCost;
  var invHtml = invs.length ? invs.map(function (i) {
    var up = i.gain >= 0;
    return '<tr>' +
      '<td><b>' + esc(i.name) + '</b><div class="muted" style="font-size:12px">' +
        esc(i.kind) + (i.provider ? " · " + esc(i.provider) : "") + '</div></td>' +
      '<td class="num">' + money(i.invested) + '</td>' +
      '<td class="num">' + money(i.value) +
        '<div class="muted" style="font-size:12px">' +
        (i.valued ? "as at " + dayLabel(i.valued) + " " + i.valued.slice(0, 4) : "—") +
        '</div></td>' +
      /* A holding whose return is paid out rather than accumulating (the 54EC
         bonds) has a permanent gain of zero, so show the interest banked to
         date instead — labelled, because it is income already sitting in a bank
         account, not a rise in what the holding is worth. */
      '<td class="num">' + (i.interest
        ? '<b class="up">+' + money(i.interest) + '</b>' +
          '<div class="muted" style="font-size:12px">interest received' +
          (i.gain ? ' · ' + (up ? "+" : "") + money(i.gain) + ' value' : '') + '</div>'
        : '<b class="' + (up ? "up" : "down") + '">' + (up ? "+" : "") + money(i.gain) + '</b>' +
          '<div class="muted" style="font-size:12px">' + (up ? "+" : "") + i.gainPct.toFixed(1) + '%</div>') +
      '</td>' +
      '<td>' + (i.matures ? dayLabel(i.matures) + " " + i.matures.slice(0, 4) : "—") + '</td>' +
    '</tr>';
  }).join("") : "";

  // Fixed deposits at principal rather than maturity value, so the total is
  // money actually put in rather than money hoped for.
  //
  // Savings balances replaced "goals set aside" here. Goal money is not a
  // separate pot -- it sits in an account already counted, so adding it
  // double-counted. A savings balance is real money that is genuinely yours.
  //
  // Only STATED balances count. A balance cannot be derived from opening
  // balance plus ledger movement: for HDFC-3245 that arithmetic gives 7,04,025
  // against a real 5,79,797, because the ledger carries entries that never
  // touched the bank (cash, opening balances, the net-share row of a split
  // bill). An account with no stated balance is left out of the total and
  // called out below, rather than being guessed at.
  var savingsAccts = banks.map(function (a) {
    var stated = (a.balance !== null && a.balance !== undefined);
    if (!stated) return { name: a.name, known: false, value: 0 };
    var since = movementSince(a.name, a.balanceAsOf);
    return { name: a.name, known: true, value: a.balance + since.in - since.out };
  });
  var savingsTotal = savingsAccts.reduce(function (s, a) { return s + a.value; }, 0);
  var savingsMissing = savingsAccts.filter(function (a) { return !a.known; });
  // Savings-account cash is shown on the Cash in Bank tab, not counted here:
  // Total invested is money put into FDs and holdings (Vinod, 29 Sep 2026).
  var totalInvested = fdTotal + invValue;

  // Every holding on one scale, biggest first. Fixed deposits at principal and
  // investments at their last stated value — the same basis as the total above,
  // so the bars add up to it. Cash is deliberately absent; it lives on Cash in Bank.
  var mix = DATA.fds.map(function (f) {
    return { name: f.id + (f.bank ? " · " + f.bank : ""), kind: "Fixed deposit",
             when: f.maturity ? "matures " + dayLabel(f.maturity) + " " + f.maturity.slice(0, 4) : "",
             value: f.principal };
  }).concat(invs.map(function (i) {
    return { name: i.name, kind: i.kind || "Investment",
             when: i.valued ? "valued " + dayLabel(i.valued) + " " + i.valued.slice(0, 4) : "",
             value: i.value };
  })).sort(function (a, b) { return b.value - a.value; });

  var mixMax = mix.reduce(function (m, x) { return Math.max(m, x.value); }, 0);
  var mixHtml = mix.length ? '<div class="amix">' + mix.map(function (x) {
    var pct = totalInvested ? x.value / totalInvested * 100 : 0;
    return '<div class="amix-row" title="' + esc(x.name) + ' — ' + money(x.value) +
             ', ' + pct.toFixed(1) + '% of ' + money(totalInvested) + '">' +
        '<div class="amix-name">' + esc(x.name) + '</div>' +
        '<div class="amix-val">' + money(x.value) + '</div>' +
        '<div class="amix-sub">' + esc(x.kind) + (x.when ? " · " + esc(x.when) : "") + '</div>' +
        '<div class="amix-pct">' + pct.toFixed(1) + '%</div>' +
        '<div class="amix-track"><i style="width:' +
          (mixMax ? (x.value / mixMax * 100).toFixed(2) : 0) + '%"></i></div>' +
      '</div>';
  }).join("") + '</div>' +
    '<div class="amix-foot"><span>' + mix.length + ' holdings</span>' +
      '<span>Total <b>' + money(totalInvested) + '</b></span></div>'
    : '<div class="empty">Nothing on the Fixed Deposits or Investments sheets yet.</div>';

  // --- maturity timeline -----------------------------------------------
  // Same holdings, asking when rather than how much. Lanes share one date
  // axis running from today to the last maturity, so bar length is the wait.
  var MS_YEAR = 365.25 * 86400000;
  var nowMs = new Date(today).getTime();
  var dated = [], undatedHoldings = [];
  DATA.fds.forEach(function (f) {
    (f.maturity ? dated : undatedHoldings).push({
      name: f.id + (f.bank ? " · " + f.bank : ""), kind: "Fixed deposit",
      value: f.principal, on: f.maturity });
  });
  invs.forEach(function (i) {
    (i.matures ? dated : undatedHoldings).push({
      name: i.name, kind: i.kind || "Investment", value: i.value, on: i.matures });
  });
  dated.sort(function (a, b) { return a.on < b.on ? -1 : a.on > b.on ? 1 : 0; });

  var matHtml = "";
  if (dated.length) {
    var lastMs = new Date(dated[dated.length - 1].on).getTime();
    var span = Math.max(lastMs - nowMs, MS_YEAR / 12);   // never divide by zero
    var pos = function (iso) {
      return Math.max(0, Math.min(100, (new Date(iso).getTime() - nowMs) / span * 100));
    };

    var ticks = "", labels = "";
    for (var y = new Date(today).getFullYear() + 1;
         y <= new Date(lastMs).getFullYear(); y++) {
      var p = pos(y + "-01-01");
      if (p <= 1 || p >= 99) continue;           // skip ticks that sit on an end
      ticks += '<u style="left:' + p.toFixed(2) + '%"></u>';
      // the gridline always goes in, the label only when it clears "Today" --
      // a year starting a few weeks out would print straight through it
      if (p >= 8) labels += '<span style="left:' + p.toFixed(2) + '%">' + y + '</span>';
    }

    matHtml = '<div class="mat"><div class="mat-axis"><span style="left:0;transform:none">Today</span>' +
      labels + '</div>' +
      dated.map(function (x) {
        var p = pos(x.on);
        var years = (new Date(x.on).getTime() - nowMs) / MS_YEAR;
        // round to months first, so 11.6 months reads as a year rather than "12 months"
        var months = Math.max(1, Math.round(years * 12));
        var away = months < 12 ? months + " month" + (months === 1 ? "" : "s")
                               : years.toFixed(1) + " years";
        return '<div class="mat-row' + (years < 0.25 ? " soon" : "") + '" title="' +
            esc(x.name) + ' matures ' + dayLabel(x.on) + ' ' + x.on.slice(0, 4) + '">' +
          '<div class="mat-name">' + esc(x.name) + '</div>' +
          '<div class="mat-when">' + dayLabel(x.on) + " " + x.on.slice(0, 4) + '</div>' +
          '<div class="mat-sub">' + esc(x.kind) + ' · ' + money(x.value) + '</div>' +
          '<div class="mat-left">in ' + away + '</div>' +
          '<div class="mat-lane"><div class="mat-track"></div>' +
            '<div class="mat-grid">' + ticks + '</div>' +
            '<div class="mat-fill" style="width:' + p.toFixed(2) + '%"></div>' +
            '<span class="mat-dot" style="left:' + p.toFixed(2) + '%"></span>' +
          '</div></div>';
      }).join("") + '</div>' +
      (undatedHoldings.length
        ? '<div class="mat-note"><b>Not on the timeline:</b> ' +
            undatedHoldings.map(function (x) { return esc(x.name); }).join(", ") +
            ' — ' + (undatedHoldings.length === 1 ? 'its maturity date is' : 'their maturity dates are') +
            ' not known yet. Add them to the Investments sheet once the policy documents arrive.</div>'
        : "");
  }

  var emiP = activeEmis.reduce(function (s, e) { return s + e.balP; }, 0);
  var emiI = activeEmis.reduce(function (s, e) { return s + e.balI; }, 0);

  /* The monthly instalment per loan.
     The statement's Loan Summary gives balances and tenure but never the
     instalment itself, so it is read off the card postings: each month a loan
     charges one "OFFUS EMI,PRIN" and one "OFFUS EMI,INT" line carrying its loan
     number, and the two together are that month's EMI. Take the latest month
     posted, since the instalment changes as a loan is part-prepaid. */
  var emiMonthly = {};
  (function () {
    var seen = {};
    DATA.cc.forEach(function (c) {
      // the loan number is split by a stray space in some statement layouts
      var m = /OFFUSEMI,(?:PRIN|INT)[A-Z]*:?\d*,(\d+)\(Ref#/.exec(String(c.ds).replace(/\s+/g, ""));
      if (!m) return;
      var loan = m[1].replace(/^0+/, "");
      if (!seen[loan] || c.d > seen[loan]) { seen[loan] = c.d; emiMonthly[loan] = 0; }
      if (c.d === seen[loan]) emiMonthly[loan] += c.amt;
    });
  })();

  var emiHtml = activeEmis.length ? activeEmis.map(function (e) {
    var monthly = emiMonthly[String(e.loanNo).replace(/^0+/, "")];
    return '<tr>' +
      '<td><b>' + esc(e.type) + '</b><div class="muted" style="font-size:12px">Card ' + esc(e.card) + " · " + esc(e.loanNo) + '</div></td>' +
      '<td class="num">' + money(e.amount) + '</td>' +
      '<td class="num">' + (monthly ? '<b>' + money(monthly) + '</b>' : '<span class="muted">—</span>') + '</td>' +
      '<td class="num">' + money(e.balP) + '</td>' +
      '<td class="num">' + money(e.balI) + '</td>' +
      '<td>' + esc(e.balT) + '<div class="muted" style="font-size:12px">of ' + esc(e.tenure) + " at " + esc(e.rate) + '</div></td>' +
    '</tr>';
  }).join("") : "";

  /* Accounts: money in the bank and what is owed on the cards (card EMI loans
     are card debt, so they sit here too). Assets: what has been put away --
     FDs, investments, goals. Both tabs are drawn from the one set of figures
     above, so they can never disagree. */
  var cardsDue = cards.filter(function (a) { return a.due !== null && a.due !== undefined; });
  var dueTotal = cardsDue.reduce(function (s, a) { return s + a.due; }, 0);

  el("tab-accounts").innerHTML =
    '<div class="card"><div class="total">' +
      '<div class="headline"><div class="lbl">Cash in bank accounts</div>' +
        '<div class="val">' + money(savingsTotal) + '</div></div>' +
      '<div class="parts">' +
        '<div class="part"><div class="p-lbl">Credit cards to pay</div>' +
          '<div class="p-val">' + money(dueTotal) + '</div></div>' +
        '<div class="part"><div class="p-lbl">Card EMI loans left</div>' +
          '<div class="p-val">' + money(emiP + emiI) + '</div></div>' +
        '<div class="part"><div class="p-lbl">Cash after card bills</div>' +
          '<div class="p-val">' + money(savingsTotal - dueTotal) + '</div></div>' +
      '</div>' +
    '</div>' +
    '<p class="cap" style="margin:14px 0 0">Bank balances as you last recorded them, adjusted for anything the ' +
      'ledger has seen since; card amounts from the latest statements' +
      (cards.length > cardsDue.length ? ' (' + (cards.length - cardsDue.length) + ' card' +
        (cards.length - cardsDue.length > 1 ? 's have' : ' has') + ' no statement amount yet)' : '') + '.' +
      (savingsMissing.length
        ? ' <b>' + savingsMissing.map(function (a) { return esc(a.name); }).join(" and ") +
          (savingsMissing.length > 1 ? ' have ' : ' has ') +
          'no balance recorded yet, so ' + (savingsMissing.length > 1 ? 'they are' : 'it is') +
          ' not in this total.</b>'
        : '') +
      '</p>' +
    '</div>' +

    '<div class="card"><h2>Bank accounts</h2>' +
      '<p class="cap">' + (anyBalance
        ? 'Balance as you stated it, plus everything recorded since, giving the balance now.'
        : 'No balances have been entered yet. Add <b>Current Balance</b> and <b>Balance As Of</b> ' +
          'columns to the Account Details sheet and they will appear here.') + '</p>' +
      '<div class="acct-cards">' + bankHtml + '</div></div>' +

    '<div class="card"><h2>Credit cards</h2>' +
      '<p class="cap">Amount due comes from your card statement. Each card purchase is also in ' +
      'the ledger: on Transactions, pick the card in the Account filter to see them. ' +
      DATA.cc.length + ' card transactions on file.</p>' +
      '<div class="acct-cards">' + cardHtml + '</div></div>' +

    '<div class="card"><h2>Credit card EMI loans</h2>' +
      '<p class="cap">Latest statement position for each loan. ' + money(emiP) + ' principal plus ' + money(emiI) + ' interest still to pay.</p>' +
      (emiHtml
        ? '<div class="tbl-scroll"><table><thead><tr><th>Loan</th><th class="num">Original</th><th class="num">Monthly EMI</th><th class="num">Principal left</th><th class="num">Interest left</th><th>Remaining</th></tr></thead><tbody>' + emiHtml + '</tbody></table></div>'
        : '<div class="empty">No active EMI loans.</div>') +
    '</div>';

  /* What each holding pays if cashed in today, and at maturity, with the
     taxable part of each. Worked out in the workbook's Exit Values sheet, which
     states its reasoning per holding. A fixed deposit's early-exit figure
     changes daily, so it is recomputed here from its terms: interest for the
     days run at the contract rate less the usual 1-point penalty -- an upper
     bound, since the bank uses its lower short-period rate. */
  var FD_PENALTY = 1;
  var exits = (DATA.exitValues || []).map(function (x) {
    var y = {};
    for (var k in x) y[k] = x[k];
    if (x.rate && x.start && x.principal) {
      var days = Math.max(0, Math.round((new Date(today) - new Date(x.start)) / 86400000));
      var early = x.principal * (x.rate - FD_PENALTY) / 100 * days / 365;
      y.today = Math.round(x.principal + early);
      y.todayTaxable = Math.round(early);
      y.todayWhy = "Breaking it early pays interest only for the " + days + " days it has run, at the " +
        "shorter-period rate less a " + FD_PENALTY + "% penalty. Shown at " + (x.rate - FD_PENALTY).toFixed(2) +
        "%, so this is the most you would get.";
    }
    return y;
  });
  /* Tax at the rate the workbook states (its slab plus cess); the code names
     no rate of its own. Without it, only taxable amounts are shown. */
  var tx = DATA.exitTax || null;
  var taxMult = tx ? tx.slab / 100 * (1 + tx.cess / 100) : null;
  var taxLbl = tx ? tx.slab + "% slab + " + tx.cess + "% cess" : "";
  function taxOn(v) { return (taxMult === null || v === null || v === undefined) ? null : Math.round(v * taxMult); }
  var nowTotal = exits.reduce(function (t, x) { return t + (x.today || 0); }, 0);
  var nowTax = exits.reduce(function (t, x) { return t + (x.todayTaxable || 0); }, 0);
  var nowTaxDue = taxOn(nowTax);
  var holdTaxDue = taxOn(exits.reduce(function (t, x) {
    return t + (x.maturityTaxable || 0) + (x.beforeTaxable || 0);
  }, 0));
  var locked = exits.filter(function (x) { return x.today === null; });
  var lockedTotal = locked.reduce(function (t, x) { return t + (x.book || 0); }, 0);

  var rateLbl = taxMult !== null ? 'Less tax at ' + (Math.round(taxMult * 1000) / 10) + '%' : '';
  function exitBox(label, value, note, taxable, why, when, before) {
    var known = !(taxable === null || taxable === undefined);
    var lines = '';
    if (value !== null && value !== undefined) {
      lines += kv('You would receive', value);
      lines += known ? kv('of which taxable income', taxable, 'note') : kvText('Taxable part', 'not known', 'note');
      if (known && taxMult !== null) {
        lines += kv(rateLbl, -taxOn(taxable));
        lines += kv('In hand after tax', value - taxOn(taxable), 'total');
      }
      if (before) lines += kv('Interest taxed before then', before, 'note') +
                           (taxMult !== null ? kv('Tax on that, over the years', taxOn(before), 'note') : '');
    }
    return '<div class="exit-box"><div class="lbl">' + label + (when ? ' · ' + esc(when) : '') + '</div>' +
      (value !== null && value !== undefined
        ? '<div class="v">' + money(value) + '</div>' + lines
        : '<div class="v muted">' + esc(note || "—") + '</div>') +
      '<div class="why">' + esc(why) + '</div></div>';
  }
  var short = function (x) { return esc(x.name.split(" - ")[0].split(" (")[0]); };
  function monYear(d) {                                  // "20 Sep 2027" -> "Sep-2027"
    var m = /(\d{1,2}) ([A-Za-z]{3})[a-z]* (\d{4})/.exec(d || "");
    return m ? m[2].charAt(0).toUpperCase() + m[2].slice(1).toLowerCase() + '-' + m[3] : (d || '—');
  }
  var matKnown = exits.filter(function (x) { return x.maturity !== null && x.maturity !== undefined; });
  var matTotal = matKnown.reduce(function (t, x) { return t + x.maturity; }, 0);
  // today vs maturity, one line per holding: name + month | today | at maturity
  var cell = function (v, note) { return v !== null && v !== undefined ? money(v) : '<span class="muted">' + esc(note) + '</span>'; };
  var sideBySide = '<div class="exit-box cmp-box"><div class="lbl">Today vs at maturity</div>' +
      '<div class="v">' + money(nowTotal) + '</div>' +
      '<div class="cmp"><span></span><span class="h">Today</span><span class="h">At maturity</span>' +
      exits.map(function (x) {
        return '<span>' + short(x) + '<small>' + esc(monYear(x.matures)) + '</small></span>' +
          '<b>' + cell(x.today, x.today === null ? 'locked' : '—') + '</b>' +
          '<b>' + cell(x.maturity, '—') + '</b>';
      }).join('') +
      '<span class="tot">Total</span><b class="tot">' + money(nowTotal) + '</b><b class="tot">' + money(matTotal) + '</b>' +
      '</div>' +
      '<div class="why">Each total adds only its own column. 54EC yearly interest is paid before maturity and is not in it.</div></div>';

  var cashable = exits.filter(function (x) { return x.today !== null && x.today !== undefined; });
  var matTaxable = exits.reduce(function (t, x) { return t + (x.maturityTaxable || 0); }, 0);
  var beforeTaxable = exits.reduce(function (t, x) { return t + (x.beforeTaxable || 0); }, 0);
  var exitHtml = exits.map(function (x) {
    return '<div class="exit"><div class="exit-head"><b>' + esc(x.name) + '</b>' +
        '<span class="muted" style="font-size:12.5px">' + esc(x.kind) + ' · book value ' + money(x.book) +
          ' · matures ' + esc(monYear(x.matures)) + '</span></div>' +
      '<div class="exit-pair">' +
        exitBox("If cashed in today", x.today, x.todayNote, x.todayTaxable, x.todayWhy, "") +
        exitBox("At maturity", x.maturity, x.maturityNote, x.maturityTaxable, x.maturityWhy, monYear(x.matures),
                x.beforeTaxable) +
      '</div>' +
      '<div class="tax"><b>Tax:</b> ' + esc(x.tax) + '</div></div>';
  }).join("");

  el("tab-assets").innerHTML =
    '<div class="card"><div class="total">' +
      '<div class="headline"><div class="lbl">Total invested</div>' +
        '<div class="val">' + money(totalInvested) + '</div></div>' +
      '<div class="parts">' +
        '<div class="part"><div class="p-lbl">Fixed deposits</div>' +
          '<div class="p-val">' + money(fdTotal) + '</div></div>' +
        '<div class="part"><div class="p-lbl">Investments</div>' +
          '<div class="p-val">' + money(invValue) + '</div></div>' +
      '</div>' +
    '</div>' +
    '<p class="cap" style="margin:14px 0 0">Fixed deposits at principal and investments at their last stated value. ' +
      'Cash in savings accounts is not counted here; it is on the Cash in Bank tab.</p>' +
    '</div>' +

    '<div class="card"><h2>What your money is in</h2>' +
      '<p class="cap">Every holding on one scale, biggest first. Each bar is that holding ' +
      'against the largest; the percentage is its share of ' + money(totalInvested) + '.</p>' +
      mixHtml + '</div>' +

    (matHtml
      ? '<div class="card"><h2>When each one matures</h2>' +
          '<p class="cap">The same holdings, by date. Each bar runs from today to that ' +
          'maturity, so a longer bar is a longer wait. What each pays out is in the next card.</p>' +
          matHtml + '</div>'
      : "") +

    (exits.length
      ? '<div class="card"><h2>Cash in today, or hold to maturity</h2>' +
          '<p class="cap">What each holding would pay if you cashed it in today, and what it pays at ' +
          'maturity, with the part that counts as taxable income. Estimates to plan with, not tax advice.' +
          (exits[0].asOf ? ' Worked out on ' + esc(exits[0].asOf.split("-").reverse().join("/")) +
            '; fixed deposits are recalculated each day.' : '') + '</p>' +
          '<div class="grid k4w" style="margin-bottom:6px">' +
            sideBySide +
            (taxMult !== null
              ? '<div class="exit-box"><div class="lbl">Tax if cashed in today</div><div class="v">' + money(nowTaxDue) + '</div>' +
                  kv('Cash in today', nowTotal) +
                  kv('Taxable part', nowTax) +
                  kv('Tax', nowTaxDue, 'total') +
                  kvText('at ' + esc(taxLbl), '', 'note') +
                  kv('In hand after tax', nowTotal - nowTaxDue) + '</div>'
              : '') +
            '<div class="exit-box"><div class="lbl">Locked until maturity</div><div class="v">' + money(lockedTotal) + '</div>' +
              locked.map(function (x) { return kv(short(x).replace(' Capital Gain Bonds', ' bonds'), x.book); }).join('') +
              kv('Total', lockedTotal, 'total') +
              kvText('At book value; cannot be cashed in early', '', 'note') + '</div>' +
            (taxMult !== null
              ? '<div class="exit-box"><div class="lbl">Tax if all held to maturity</div><div class="v">' + money(holdTaxDue) + '</div>' +
                  kv('At maturity', matTaxable) +
                  kv('Interest before', beforeTaxable) +
                  kv('Taxable', matTaxable + beforeTaxable, 'total') +
                  kv('Tax', holdTaxDue, 'total') +
                  kvText('at ' + esc(taxLbl), '', 'note') +
                  kvText('Spread over the years it falls due', '', 'note') + '</div>'
              : '') +
          '</div>' +
          exitHtml +
        '</div>'
      : '') +

    '<div class="grid k4" style="margin-bottom:16px">' +
      '<div class="tile"><div class="lbl">In fixed deposits</div><div class="val">' + money(fdTotal) + '</div>' +
        '<div class="sub">' + DATA.fds.length + ' deposits · ' + money(fdInt) + ' interest due</div></div>' +
      '<div class="tile"><div class="lbl">Investments value</div><div class="val">' + money(invValue) + '</div>' +
        '<div class="sub">' + (invs.length
          ? '<span class="' + (invGain >= 0 ? "up" : "down") + '">' + (invGain >= 0 ? "+" : "") + money(invGain) + '</span> on ' + money(invCost)
          : 'none tracked') + '</div></div>' +
      '<div class="tile"><div class="lbl">Invested in holdings</div><div class="val">' + money(invCost) + '</div>' +
        '<div class="sub">' + invs.length + ' holdings</div></div>' +
      '<div class="tile"><div class="lbl">Goals progress</div><div class="val">' +
        (DATA.goals.length
          ? (DATA.goals.reduce(function (s, g) { return s + g.saved; }, 0) /
             DATA.goals.reduce(function (s, g) { return s + g.target; }, 0) * 100).toFixed(0) + "%"
          : "—") + '</div>' +
        '<div class="sub">' + DATA.goals.length + ' goals tracked</div></div>' +
    '</div>' +

    '<div class="card"><h2>Fixed deposits</h2><p class="cap">' + money(fdTotal) + ' invested.</p>' +
      (fdHtml
        ? '<div class="tbl-scroll"><table><thead><tr><th>FD</th><th class="num">Principal</th><th class="num">At maturity</th><th>Matures</th><th>Status</th></tr></thead><tbody>' + fdHtml + '</tbody></table></div>'
        : '<div class="empty">No fixed deposits.</div>') +
    '</div>' +

    '<div class="card"><h2>Investments</h2>' +
      '<p class="cap">Market-linked holdings, valued at a date rather than promised at maturity — ' +
      'the value moves, so these figures are only as current as the statement they came from.</p>' +
      (invHtml
        ? '<div class="tbl-scroll"><table><thead><tr><th>Holding</th><th class="num">Invested</th>' +
          '<th class="num">Value now</th><th class="num">Gain</th><th>Matures</th></tr></thead>' +
          '<tbody>' + invHtml + '</tbody></table></div>'
        : '<div class="empty">No investments tracked.</div>') +
    '</div>' +

    '<div class="card"><h2>Savings goals</h2><p class="cap">From the Savings Goals sheet.</p>' + goalHtml + '</div>';
}

/* The next premium date for a policy, and the days until it. A dated renewal
   is used as is. Otherwise the renewal cell describes a rhythm: "24th monthly"
   (the next 24th) or "21 Jan / 21 Jul" (whichever of those comes next). Text
   like "From issue date" has no date yet and returns null. */
function nextPremium(p, today) {
  var t = new Date(today + "T00:00:00");
  function out(d, amount, every) {
    var iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
              String(d.getDate()).padStart(2, "0");
    return { date: iso, days: Math.round((d - t) / 86400000), amount: amount, every: every };
  }
  if (p.renewal) return out(new Date(p.renewal + "T00:00:00"), p.premium, "");
  var txt = p.renewalText || "";
  var m = txt.match(/(\d{1,2})(?:st|nd|rd|th)?\s+monthly/i);
  if (m) {
    var d = new Date(t.getFullYear(), t.getMonth(), +m[1]);
    if (d < t) d = new Date(t.getFullYear(), t.getMonth() + 1, +m[1]);
    return out(d, p.premium / 12, "monthly");
  }
  var dates = [], re = /(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/gi, x;
  while ((x = re.exec(txt))) dates.push([+x[1], MONTH_NAMES.indexOf(x[2].slice(0, 1).toUpperCase() + x[2].slice(1, 3).toLowerCase())]);
  if (dates.length) {
    var best = null;
    dates.forEach(function (dm) {
      var c = new Date(t.getFullYear(), dm[1], dm[0]);
      if (c < t) c = new Date(t.getFullYear() + 1, dm[1], dm[0]);
      if (!best || c < best) best = c;
    });
    return out(best, p.premium / dates.length,
               dates.length === 2 ? "half-yearly" : dates.length === 4 ? "quarterly" : "");
  }
  return null;
}

function renderInsurance() {
  var today = new Date().toISOString().slice(0, 10);

  // Insurance is cover, not capital: it stays out of every asset total below.
  // Older data.json files predate the Insurance Policies sheet.
  var pols = (DATA.insurance || []).slice().sort(function (a, b) {
    // soonest real renewal first; the ones with no renewal date sink to the end
    if (!a.renewal && !b.renewal) return a.name.localeCompare(b.name);
    if (!a.renewal) return 1;
    if (!b.renewal) return -1;
    return a.renewal < b.renewal ? -1 : a.renewal > b.renewal ? 1 : 0;
  });
  var polPrem = pols.reduce(function (s, p) { return s + p.premium; }, 0);
  pols.forEach(function (p) { p.next = nextPremium(p, today); });
  // soonest premium first; policies with no date yet (awaiting issue) go last
  pols.sort(function (a, b) {
    if (!a.next && !b.next) return a.name.localeCompare(b.name);
    if (!a.next) return 1;
    if (!b.next) return -1;
    return a.next.days - b.next.days;
  });
  var polSoon = pols.filter(function (p) { return p.next && p.next.days <= 45; }).length;
  var allCount = pols.length;

  // tile filters: "soon" = premium within 45 days, "premium" = largest premium first
  var F = STATE.insFilter;
  if (F === "soon") pols = pols.filter(function (p) { return p.next && p.next.days <= 45; });
  if (F === "premium") pols = pols.slice().sort(function (a, b) { return b.premium - a.premium; });
  function longDate(d) { return dayLabel(d) + " " + d.slice(0, 4); }

  /* Health, Life and Vehicle each get their own box.

     Mapped from the sheet's Type explicitly rather than by guessing from the
     text, and anything unrecognised falls through to "Other cover" so a policy
     type added later shows up somewhere instead of silently vanishing.

     Personal Accident sits under Vehicle: it is the compulsory owner-driver
     cover that the car policy deliberately omits because this standalone one
     exists, and the two renew on the same day. */
  var GROUPS = [
    { key: "health",  title: "Health",  kinds: ["Health"] },
    { key: "life",    title: "Life",    kinds: ["Life", "Life (ULIP)"] },
    { key: "vehicle", title: "Motor",   kinds: ["Motor", "Personal Accident"] },
    { key: "other",   title: "Others",  kinds: [] }
  ];

  function groupOf(kind) {
    for (var i = 0; i < GROUPS.length; i++) {
      if (GROUPS[i].kinds.indexOf(kind) >= 0) return GROUPS[i].key;
    }
    // any "Life (...)" variant -- ULIP, savings, term -- is life cover
    if (/^life\b/i.test(kind || "")) return "life";
    return "other";
  }

  function polBlock(p) {
    var n = p.next;
    var status = !n
      ? '<span class="pill">no date yet</span>'
      : n.days < 0 ? '<span class="pill bad">overdue ' + (-n.days) + ' days</span>'
      : '<span class="pill' + (n.days <= 45 ? " warn" : "") + '">' +
          (n.days === 0 ? 'due today' : n.days + (n.days === 1 ? ' day' : ' days')) + '</span>';

    // a policy that renews on a date has a period with two ends; one that just
    // runs on has a start and a rhythm, so say the rhythm rather than invent an end
    var period = p.renewal && p.start ? longDate(p.start) + " → " + longDate(p.renewal)
      : p.renewal ? "to " + longDate(p.renewal)
      : p.start ? "from " + longDate(p.start) +
                  (p.renewalText ? " · renews " + esc(p.renewalText) : "")
      : esc(p.renewalText || "—");

    function field(label, value) {
      return '<div><dt>' + label + '</dt><dd>' + value + '</dd></div>';
    }

    return '<div class="pol">' +
      '<div class="pol-head"><span class="p-name">' + esc(p.name) + '</span>' + status +
        '<span class="p-meta">' + esc(p.kind) +
        (p.insurer ? " · " + esc(p.insurer) : "") + '</span></div>' +
      '<dl class="pol-fields">' +
        field("Covers", p.covers ? esc(p.covers) : '<span class="muted">not stated</span>') +
        field("Sum Insured", p.sum === null
          ? '<span class="muted">not stated</span>' : '<b>' + money(p.sum) + '</b>') +
        field("Annual Premium", money(p.premium) +
          (p.paidFrom ? ' <span class="muted">· ' + esc(p.paidFrom) + '</span>' : "")) +
        field("Next Premium", n
          ? '<b>' + longDate(n.date) + '</b> <span class="muted">· ' + money(n.amount) +
            (n.every ? ' (' + n.every + ')' : '') + '</span>'
          : '<span class="muted">' + esc(p.renewalText || "not stated") + '</span>') +
        field("Cover Period", period) +
      '</dl>' +
    '</div>';
  }

  var expired = pols.filter(function (p) {
    return p.renewal && p.renewal < today;
  }).length;

  el("tab-insurance").innerHTML =
    '<div class="grid k5" style="margin-bottom:16px">' +
      tile("all", F || "all", "Policies in force", allCount,
           expired ? expired + ' expired' : 'none expired', "Show every policy") +
      tile("premium", F, "Premium a year", money(polPrem),
           F === "premium" ? 'largest premium first' : 'across all policies', "Sort by premium, largest first") +
      tile("soon", F, "Premiums due soon", polSoon, 'within 45 days', "Show only premiums due within 45 days") +
    '</div>' +
    (F === "soon" ? filterBar('Showing only premiums due within 45 days.', "ins-clear")
     : F === "premium" ? filterBar('Largest premium first, within each group.', "ins-clear") : '') +

    '<p class="cap" style="margin:0 0 16px">What is covered and when it lapses. This is cover, not money you ' +
      'hold, so it counts towards no asset total — and the premiums are already in your spending, so nothing ' +
      'here is a second record of them.</p>' +

    // one box per kind of cover; a group with no policies is left out entirely
    (pols.length
      ? GROUPS.map(function (g) {
          var mine = pols.filter(function (p) { return groupOf(p.kind) === g.key; });
          if (!mine.length) return "";
          var prem = mine.reduce(function (s, p) { return s + p.premium; }, 0);
          var soon = mine.filter(function (p) { return p.next && p.next.days <= 45; }).length;
          var first = mine[0].next;          // mine is already soonest-first
          return '<div class="card"><h2>' + g.title + '</h2>' +
            '<p class="cap">' + mine.length + (mine.length === 1 ? ' policy' : ' policies') +
              ' · ' + money(prem) + ' a year' +
              (first ? ' · next premium in <b>' + first.days + (first.days === 1 ? ' day' : ' days') + '</b>' : '') +
              (soon ? ' · <b>' + soon + ' due within 45 days</b>' : '') + '</p>' +
            mine.map(polBlock).join("") +
          '</div>';
        }).join("")
      : '<div class="card"><h2>Insurance cover</h2>' +
        '<div class="empty">' + (F === "soon" ? 'No premium falls due within 45 days.' : 'No policies tracked.') +
        '</div></div>');

  var root = el("tab-insurance");
  wireTiles(root, F || "all", function (k) {
    STATE.insFilter = k === "all" ? "" : k;
    renderInsurance();
  });
  var clr = el("ins-clear");
  if (clr) clr.addEventListener("click", function () { STATE.insFilter = ""; renderInsurance(); });
}

/* =====================================================================
   Bills -- what falls due in the next 60 days.

   From the Upcoming Bills sheet (one row per bill: its next due date and
   rhythm), plus insurance premiums from the Insurance Policies sheet, so a
   renewal date is kept in one place, and FD maturities as money coming in.
   Repeats are rolled forward here, so a row stays useful after its date
   passes. Only an "Exact" amount is trusted on every repeat; "This time" is
   exact for the next date only, and everything else is shown as ≈.

   Not counted in any total: amounts nobody knows yet (a planned trip) and
   anything marked Check, which may not be live at all (listed once only).
   ===================================================================== */

var BILL_DAYS = 60;

function isoDate(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" +
         String(d.getDate()).padStart(2, "0");
}

/* The bill's own day n months on, pulled back to the month's last day when
   that month is shorter (a bill on the 31st lands on 30 Nov, then 31 Dec). */
function addMonths(d, n, day) {
  var y = d.getFullYear(), m = d.getMonth() + n;
  return new Date(y, m, Math.min(day, new Date(y, m + 1, 0).getDate()));
}

function billStep(every) {
  var e = (every || "").toLowerCase();
  if (/week/.test(e))              return function (d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + 7); };
  if (/2 months|bi-?monthly/.test(e)) return function (d, day) { return addMonths(d, 2, day); };
  if (/quarter/.test(e))           return function (d, day) { return addMonths(d, 3, day); };
  if (/half/.test(e))              return function (d, day) { return addMonths(d, 6, day); };
  if (/month/.test(e))             return function (d, day) { return addMonths(d, 1, day); };
  if (/year|annual/.test(e))       return function (d, day) { return addMonths(d, 12, day); };
  return null;                     // Once, As used
}

/* Every date a bill falls due from `from` to `to` (ISO), with how many steps
   it was rolled forward from the sheet's date. A past one-off is gone. */
function billDates(start, every, from, to) {
  if (!start) return [];
  var step = billStep(every), d = new Date(start + "T00:00:00"), day = d.getDate();
  var f = new Date(from + "T00:00:00"), t = new Date(to + "T00:00:00"), out = [], n = 0;
  if (!step) return d >= f && d <= t ? [{ date: start, rolled: 0 }] : [];
  while (d < f && n < 2000) { d = step(d, day); n++; }
  for (var k = n; d <= t && k < n + 400; k++) { out.push({ date: isoDate(d), rolled: k }); d = step(d, day); }
  return out;
}

function renderBills() {
  var now = new Date(), today = isoDate(now);
  var end = isoDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() + BILL_DAYS));
  var far = isoDate(new Date(now.getFullYear() + 3, now.getMonth(), now.getDate()));
  function daysTo(iso) { return Math.round((new Date(iso + "T00:00:00") - new Date(today + "T00:00:00")) / 86400000); }
  function longDate(d) { return dayLabel(d) + " " + d.slice(0, 4); }

  var bills = (DATA.bills || []).slice();

  // insurance premiums, taken from the policies rather than listed twice --
  // only those paid from one of these accounts, so cover taken out of salary or
  // paid by someone else does not show up as a bill
  var ownAccounts = (DATA.accounts || []).map(function (a) { return a.name; });
  (DATA.insurance || []).forEach(function (p) {
    var n = nextPremium(p, today);
    if (!n || ownAccounts.indexOf(p.paidFrom) < 0) return;
    bills.push({
      name: p.name, group: "Insurance", amount: n.amount, amountIs: "Exact",
      every: n.every || "Yearly", due: n.date, via: p.paidFrom || "", mandate: "",
      status: "Active", evidence: "Insurance Policies sheet", notes: p.insurer || ""
    });
  });

  var occ = [];
  bills.forEach(function (b) {
    billDates(b.due, b.every, today, end).forEach(function (o, i) {
      // something that may not be live at all is listed once, not every week
      if (b.status === "Check" && i > 0) return;
      var approx = b.amount == null ? true
        : b.amountIs === "Exact" ? false
        : b.amountIs === "This time" ? o.rolled > 0 : true;
      occ.push({ b: b, date: o.date, days: daysTo(o.date), amount: b.amount, approx: approx,
                 first: i === 0, counted: b.amount != null && b.status !== "Check" });
    });
  });
  occ.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.b.name.localeCompare(b.b.name); });

  function sum(list) { return list.reduce(function (s, o) { return s + (o.counted ? o.amount : 0); }, 0); }
  var total = sum(occ);
  var in15 = sum(occ.filter(function (o) { return o.days <= 15; }));
  var in30 = sum(occ.filter(function (o) { return o.days <= 30; }));
  var repaid = sum(occ.filter(function (o) { return /amma/i.test(o.b.group); }));
  var anyApprox = occ.some(function (o) { return o.counted && o.approx; });

  var fdsIn = (DATA.fds || []).filter(function (f) { return f.maturity && f.maturity >= today && f.maturity <= end; });
  var fdTotal = fdsIn.reduce(function (s, f) { return s + (f.matAmt || 0); }, 0);

  // Trial: will charge unless cancelled. Check: may not be live, so kept out of
  // the totals. Question: live and counted, but worth a second look.
  var decide = bills.filter(function (b) { return /^(Trial|Check|Question)$/.test(b.status); });

  function amountCell(o) {
    if (o.amount == null) return '<span class="muted">not known</span>';
    var a = (o.approx ? "≈ " : "") + money(o.amount);
    return o.counted ? a : '<span class="muted">' + a + '</span>';
  }
  function statusPill(b, days, first) {
    if (first !== false) {
      if (b.status === "Trial") return ' <span class="pill warn">trial ends</span>';
      if (b.status === "Check") return ' <span class="pill">check · not in total</span>';
      if (b.status === "Question") return ' <span class="pill warn">check</span>';
    }
    if (days != null && days <= 7) return ' <span class="pill warn">' + (days === 0 ? "today" : days + (days === 1 ? " day" : " days")) + '</span>';
    return "";
  }

  // tile filters narrow the timeline only; the tiles keep their whole-window figures
  var F = STATE.billFilter;
  var shown = occ.filter(function (o) {
    if (F === "15") return o.days <= 15;
    if (F === "30") return o.days <= 30;
    if (F === "amma") return /amma/i.test(o.b.group);
    return true;
  });

  // the timeline, a header row per month
  var rows = "", lastMonth = "";
  shown.forEach(function (o) {
    var mk = monthKey(o.date);
    if (mk !== lastMonth) {
      var monthSum = sum(shown.filter(function (x) { return monthKey(x.date) === mk; }));
      rows += '<tr><td colspan="4" style="padding-top:18px"><b>' + monthLabel(mk) + '</b></td>' +
              '<td class="num"><b>' + money(monthSum) + '</b></td></tr>';
      lastMonth = mk;
    }
    rows += '<tr>' +
      '<td style="white-space:nowrap">' + dayLabel(o.date) + '</td>' +
      '<td class="desc">' + esc(o.b.name) + statusPill(o.b, o.days, o.first) +
        (o.first && o.b.notes && (o.b.status !== "Active" || o.b.amountIs !== "Exact")
          ? '<div class="muted" style="font-size:12.5px;margin-top:3px">' + esc(o.b.notes) + '</div>' : '') + '</td>' +
      '<td><span class="muted">' + esc(o.b.group) + '</span></td>' +
      '<td><span class="muted">' + esc(o.b.via) + '</span></td>' +
      '<td class="num">' + amountCell(o) + '</td>' +
    '</tr>';
  });

  // subtotal by group, biggest first
  var groups = [];
  occ.forEach(function (o) { if (groups.indexOf(o.b.group) < 0) groups.push(o.b.group); });
  groups.sort(function (a, b) {
    return sum(occ.filter(function (o) { return o.b.group === b; })) -
           sum(occ.filter(function (o) { return o.b.group === a; }));
  });
  var groupRows = groups.map(function (g) {
    var mine = occ.filter(function (o) { return o.b.group === g; });
    var known = mine.some(function (o) { return o.counted; });
    return '<tr><td>' + esc(g) + '</td><td class="num">' + mine.length + '</td>' +
           '<td class="num">' + (known ? money(sum(mine)) : '<span class="muted">not known</span>') + '</td></tr>';
  }).join("");

  // standing permissions to debit the bank, i.e. not the App Store balance
  var mandates = bills.filter(function (b) { return b.mandate && !/app store/i.test(b.mandate); });
  var kinds = [];
  mandates.forEach(function (b) { if (kinds.indexOf(b.mandate) < 0) kinds.push(b.mandate); });
  var appStore = bills.filter(function (b) { return /app store/i.test(b.mandate || ""); }).length;
  var mandateHtml = kinds.map(function (k) {
    var mine = mandates.filter(function (b) { return b.mandate === k; });
    return '<tr><td colspan="3" style="padding-top:16px"><b>' + esc(k) + '</b> <span class="muted">· ' +
             mine.length + '</span></td></tr>' +
      mine.map(function (b) {
        var nx = billDates(b.due, b.every, today, far)[0];
        return '<tr><td class="desc">' + esc(b.name) + statusPill(b, null) +
          '<div class="muted" style="font-size:12.5px;margin-top:3px">' + esc(b.evidence) +
          (b.status === "Check" && b.notes ? ' — ' + esc(b.notes) : '') + '</div></td>' +
          '<td><span class="muted">' + (nx ? longDate(nx.date) : esc(b.every)) + '</span></td>' +
          '<td class="num">' + (b.amount == null ? '<span class="muted">varies</span>' : money(b.amount)) + '</td></tr>';
      }).join("");
  }).join("");

  // what comes after the window: only bills the timeline above does not already
  // show, so the yearly renewals are not buried under next month's repeats
  var later = [];
  bills.forEach(function (b) {
    if (b.status === "Check" || occ.some(function (o) { return o.b === b; })) return;
    var nx = billDates(b.due, b.every, isoDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() + BILL_DAYS + 1)), far)[0];
    if (nx && b.amount != null) later.push({ b: b, date: nx.date });
  });
  later.sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  later = later.slice(0, 12);

  el("tab-bills").innerHTML =
    /* Ordered shortest window first (Vinod, 1 Oct 2026): what is due in 15 days
       is what needs money in the account now, so it leads. The 60-day tile is
       the whole window and doubles as "show everything". */
    '<div class="grid k6" style="margin-bottom:16px">' +
      tile("15", F, "Due in next 15 days", money(in15),
           occ.filter(function (o) { return o.counted && o.days <= 15; }).length + ' payments', "Show only the next 15 days") +
      tile("30", F, "Due in next 30 days", money(in30),
           occ.filter(function (o) { return o.counted && o.days <= 30; }).length + ' payments', "Show only the next 30 days") +
      tile("all", F || "all", "Due in next " + BILL_DAYS + " days", (anyApprox ? "≈ " : "") + money(total),
           occ.filter(function (o) { return o.counted; }).length + ' payments to ' + longDate(end), "Show everything due") +
      tile("amma", F, "Amma repays", money(repaid), 'paid by you, owed back', "Show only what Amma repays") +
      tile("in", F, "Coming in", money(fdTotal),
           fdsIn.length ? fdsIn.map(function (f) { return esc(f.id) + ' matures ' + dayLabel(f.maturity); }).join(", ")
                        : 'no FD matures', "Open the fixed deposits on the Assets tab") +
      tile("decide", F, "To decide", decide.length, 'trials and ones to check', "Jump to the trials and items to check") +
    '</div>' +
    (F === "15" || F === "30"
       ? filterBar('Showing only the next ' + F + ' days, to ' +
           longDate(isoDate(new Date(now.getFullYear(), now.getMonth(), now.getDate() + Number(F)))) + '.', "bills-clear")
     : F === "amma" ? filterBar('Showing only what Amma repays.', "bills-clear") : '') +

    '<div class="card" id="bills-timeline"><h2>' + (F === "15" || F === "30" ? 'Next ' + F + ' days' : F === "amma" ? 'Amma repays' : 'Next ' + BILL_DAYS + ' days') + '</h2>' +
      '<p class="cap">Every bill, subscription, card bill and premium due by ' + longDate(end) + '. ' +
        '≈ marks an estimate. Amounts in grey are left out of the totals: not known yet, or not certain to be charged.</p>' +
      (shown.length
        ? '<div class="tbl-scroll"><table><thead><tr><th>Date</th><th>Bill</th><th>Group</th><th>Paid via</th>' +
          '<th class="num">Amount</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
        : '<div class="empty">Nothing due.</div>') +
    '</div>' +

    '<div class="grid k2" style="margin-top:16px">' +
      '<div class="card"><h2>By group</h2><p class="cap">Next ' + BILL_DAYS + ' days.</p>' +
        '<div class="tbl-scroll"><table><thead><tr><th>Group</th><th class="num">Payments</th><th class="num">Total</th></tr></thead>' +
        '<tbody>' + groupRows + '</tbody></table></div></div>' +
      '<div class="card" id="bills-decide"><h2>To decide</h2><p class="cap">Free trials about to charge, and things that may or may not still be live.</p>' +
        (decide.length
          ? '<div class="tbl-scroll"><table><tbody>' + decide.map(function (b) {
              var nx = billDates(b.due, b.every, today, far)[0];
              return '<tr><td class="desc"><b>' + esc(b.name) + '</b>' + statusPill(b, null) +
                '<div class="muted" style="font-size:12.5px;margin-top:3px">' + esc(b.notes) + '</div></td>' +
                '<td class="num">' + (b.amount == null ? '' : money(b.amount) + '<div class="muted" style="font-size:12px">' + esc(b.every.toLowerCase()) + '</div>') +
                (nx ? '<div class="muted" style="font-size:12px">' + dayLabel(nx.date) + '</div>' : '') + '</td></tr>';
            }).join("") + '</tbody></table></div>'
          : '<div class="empty">Nothing to decide.</div>') +
      '</div>' +
    '</div>' +

    '<div class="card" style="margin-top:16px"><h2>Auto-debit mandates</h2>' +
      '<p class="cap">Standing permissions to take money from the bank without asking each time: UPI AutoPay, NACH ' +
        'eMandates and card standing instructions. The full live list is only in the bank: HDFC NetBanking → ' +
        'e-Mandate for NACH, and your UPI app’s AutoPay section for UPI.' +
        (appStore ? ' ' + appStore + ' apps are billed to the Apple Account balance instead, which is not a bank mandate.' : '') + '</p>' +
      (mandates.length
        ? '<div class="tbl-scroll"><table><thead><tr><th>Mandate</th><th>Next debit</th><th class="num">Amount</th></tr></thead>' +
          '<tbody>' + mandateHtml + '</tbody></table></div>'
        : '<div class="empty">None recorded.</div>') +
    '</div>' +

    '<div class="card" style="margin-top:16px"><h2>Later</h2><p class="cap">Yearly renewals and other payments ' +
      'not due before ' + longDate(end) + ', soonest first. Monthly bills are not repeated here.</p>' +
      (later.length
        ? '<div class="tbl-scroll"><table><tbody>' + later.map(function (x) {
            return '<tr><td style="white-space:nowrap">' + longDate(x.date) + '</td><td class="desc">' + esc(x.b.name) +
              '</td><td><span class="muted">' + esc(x.b.group) + '</span></td><td class="num">' +
              (x.b.amountIs === "Exact" ? "" : "≈ ") + money(x.b.amount) + '</td></tr>';
          }).join("") + '</tbody></table></div>'
        : '<div class="empty">Nothing further recorded.</div>') +
    '</div>';

  wireTiles(el("tab-bills"), F || "all", function (k) {
    // two tiles point elsewhere rather than filter
    if (k === "in")     { switchTab("assets"); return; }
    if (k === "decide") { flashCard("bills-decide"); return; }
    STATE.billFilter = k === "all" ? "" : k;
    renderBills();
  });
  var clr = el("bills-clear");
  if (clr) clr.addEventListener("click", function () { STATE.billFilter = ""; renderBills(); });
}

/* =====================================================================
   Salary -- every payslip found in email, from the Salary History sheet.

   Each slip's gross is split (in the workbook) into regular pay + bonus +
   arrears + one-offs. Pay rises are measured on REGULAR pay only, so a bonus
   month or a month of back pay never reads as a raise. Older data.json files
   have no salary array, hence the || [].
   ===================================================================== */

/* Employers keep a fixed colour wherever they appear, handed out in the order
   they employed you. The slot order keeps the two warm hues (yellow, orange)
   apart, since consecutive employers sit side by side in the chart. Names and
   notes come from data.json (salaryMeta) -- this code is public. */
var EMPLOYER_SLOTS = ["var(--series-4)", "var(--series-1)", "var(--series-3)", "var(--series-2)",
                      "#e87ba4", "#008300", "#4a3aa7"];

function employerStyle(company, cache, meta) {
  if (!cache[company]) {
    var used = Object.keys(cache).length;
    cache[company] = { short: (meta.short && meta.short[company]) || company.split(" (")[0],
                       colour: EMPLOYER_SLOTS[used % EMPLOYER_SLOTS.length] };
  }
  return cache[company];
}

/* Whole percent for the chart's label row, where bars are too narrow for a
   decimal; under 1% keeps one decimal so a small rise never reads as 0%.
   The tooltip keeps pctLabel's detail. */
function pctShort(p) {
  var v = Math.abs(p * 100);
  return (p >= 0 ? "+" : "−") + (v < 1 ? v.toFixed(1) : v.toFixed(0)) + "%";
}

function pctLabel(p) {
  var v = Math.abs(p * 100);
  if (v < 0.05) return "0%";
  // whole numbers from 10% up keep adjacent labels from running into each other
  return (p >= 0 ? "+" : "−") + (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + "%";
}

/* A round tick step (₹10k, ₹20k, ₹25k, ₹50k, ₹1L ...) giving at most five
   gridlines, so the axis reads ₹50k / ₹1L / ₹1.5L rather than ₹63k / ₹1.3L. */
function roundTicks(max) {
  var steps = [1, 2, 2.5, 5];
  for (var mag = 1000; ; mag *= 10) {
    for (var i = 0; i < steps.length; i++) {
      var st = steps[i] * mag;
      if (max / st <= 5) return { step: st, top: Math.max(st, Math.ceil(max / st) * st) };
    }
  }
}

/* Average regular monthly pay per employer per year, each employer's bars
   grouped together, labelled with the change on the previous year. */
function chartPayRise(container, groups) {
  // offer-letter bars carry a single value and no % label, so they take less
  // width than payslip bars, leaving the payslip bars room for their labels
  var LETTER_W = 0.6, bars = 0;
  groups.forEach(function (g) { bars += g.years.length * (g.letter ? LETTER_W : 1); });
  var gapBands = 0.45;                          // space between employers, in bars
  var W = chartWidth(container), H = 326, PL = 62, PR = 12, PT = 24, PB = 82;
  var iw = W - PL - PR, ih = H - PT - PB;
  var band = iw / (bars + gapBands * (groups.length - 1));
  var bw = Math.max(6, Math.min(34, band - 8));
  var ticks = roundTicks(Math.max.apply(null, groups.map(function (g) {
    return Math.max.apply(null, g.years.map(function (y) { return y.avg; }));
  })));
  var top = ticks.top;

  var s = "";
  for (var v = 0; v <= top; v += ticks.step) {
    var gy = PT + ih - (v / top) * ih;
    s += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy +
         '" stroke="var(--grid)" stroke-width="1"/>' +
         '<text x="' + (PL - 9) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11.5" fill="var(--muted)">' +
         moneyShort(v) + '</text>';
  }

  var x = PL;
  // narrow bars: alternate the % labels between two heights so neighbours never touch
  groups.forEach(function (g, gi) {
    var gx0 = x, noInr = false;
    g.years.forEach(function (y, yi) {
      var bandHere = band * (g.letter ? LETTER_W : 1);
      var bwHere = Math.min(bw, bandHere - 4);
      var bx = x + (bandHere - bwHere) / 2, h = (y.avg / top) * ih, by = PT + ih - h;
      if (y.avg > 0) s += '<path d="' + barUp(bx, by, bwHere, Math.max(h, 2), 2) + '" fill="' + g.colour + '"/>';
      if (y.letter) {
        // one figure from the offer letter: label it with its value; a job with no
        // rupee monthly figure gets one note across its group, after the loop
        if (y.avg > 0) {
          s += '<text x="' + (bx + bwHere / 2) + '" y="' + (by - 6) + '" text-anchor="middle" ' +
               'font-size="10" fill="var(--text-secondary)" font-variant-numeric="tabular-nums">' +
               (y.approx ? '≈' : '') + moneyShort(y.avg) + '</text>';
        } else noInr = true;
      }
      // the change on the year before, in its own row under the year labels, so
      // steeply rising neighbours can never put two labels on top of each other
      if (!y.letter && y.change !== null && Math.abs(y.change) >= 0.0005) {
        s += '<text x="' + (x + band / 2) + '" y="' + (PT + ih + 30) + '" text-anchor="middle" font-size="9" ' +
             'font-weight="700" fill="var(--text-secondary)" font-variant-numeric="tabular-nums">' +
             pctShort(y.change) + '</text>';
      }
      s += '<text x="' + (x + bandHere / 2) + '" y="' + (PT + ih + 16) + '" text-anchor="middle" font-size="10" fill="var(--muted)">' +
           "’" + String(y.y).slice(2) + '</text>';
      var tip = y.letter
        ? '<div class="t-title">' + esc(g.full || g.short) + ' · joined ' + y.y + '</div>' +
          '<div class="t-row">' + esc(y.role || "") + '</div>' +
          '<div class="t-row"><i class="swatch" style="background:' + g.colour + '"></i>Pay at joining<b>' +
            (y.avg > 0 ? money(y.avg) + '/mo' : 'no ₹ monthly figure') + '</b></div>' +
          '<div class="t-row muted" style="font-size:12px">' + esc(y.pay || "") + '</div>' +
          '<div class="t-row muted" style="font-size:12px">' + (y.approx
            ? 'An estimate in rupees, worked out as described above'
            : 'From the offer or appointment letter') + '</div>'
        : '<div class="t-title">' + esc(g.short) + ' · ' + y.y + '</div>' +
        '<div class="t-row"><i class="swatch" style="background:' + g.colour + '"></i>Regular pay<b>' + money(y.avg) + '/mo</b></div>' +
        '<div class="t-row">Change on ' + (y.y - 1) + '<b>' + (y.change === null ? "first year here" : pctLabel(y.change)) + '</b></div>' +
        '<div class="t-row">Bonus in the year<b>' + (y.bonus ? money(y.bonus) : "none") + '</b></div>' +
        '<div class="t-row">Payslips<b>' + y.n + '</b></div>';
      s += '<rect class="hit" x="' + x + '" y="' + PT + '" width="' + bandHere + '" height="' + ih +
           '" data-tip="' + esc(tip) + '"/>';
      x += bandHere;
    });
    // employer name under its own bars, with a bracket showing the span; names
    // alternate between two rows so single-bar employers side by side never collide
    var mid = (gx0 + x) / 2, ny = PT + ih + (gi % 2 ? 72 : 56);
    // the note only when the whole employer has no rupee figure; a single blank
    // year beside a drawn bar is explained by its tooltip instead
    if (noInr && !g.years.some(function (y) { return y.avg > 0; })) {
      s += '<text x="' + mid + '" y="' + (PT + ih - 6) + '" text-anchor="middle" font-size="10" ' +
           'fill="var(--muted)">no ₹</text>';
    }
    s += '<line x1="' + (gx0 + 3) + '" y1="' + (PT + ih + 40) + '" x2="' + (x - 3) + '" y2="' + (PT + ih + 40) +
         '" stroke="' + g.colour + '" stroke-width="2" stroke-linecap="round"/>' +
         '<text x="' + mid + '" y="' + ny + '" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-secondary)">' +
         esc(g.short) + '</text>';
    x += band * gapBands;
  });
  s += '<line x1="' + PL + '" y1="' + (PT + ih) + '" x2="' + (W - PR) + '" y2="' + (PT + ih) +
       '" stroke="var(--baseline)" stroke-width="1"/>';

  container.innerHTML =
    '<div class="legend">' + groups.filter(function (g) { return !g.letter; }).map(function (g) {
      return '<span><i class="swatch" style="background:' + g.colour + '"></i>' + esc(g.short) + '</span>';
    }).join("") +
    (groups.some(function (g) { return g.letter; })
      ? '<span><i class="swatch" style="background:var(--muted)"></i>Pay at joining, from the offer letter</span>' : '') +
    '</div>' +
    '<div class="chartwrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H +
    '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Average regular monthly pay by year, per employer">' +
    s + '</svg></div>';
  var wrap = container.querySelector(".chartwrap");
  attachTip(wrap, wrap.querySelector("svg"));
}

/* One bar per bonus payout, coloured by employer, each labelled with its amount. */
function chartBonus(container, payouts, styles) {
  var W = chartWidth(container), H = 230, PL = 62, PR = 12, PT = 26, PB = 36;
  var iw = W - PL - PR, ih = H - PT - PB;
  var band = iw / payouts.length;
  var bw = Math.max(8, Math.min(46, band - 18));
  var ticks = roundTicks(Math.max.apply(null, payouts.map(function (p) { return p.bonus; })));
  var top = ticks.top;

  var s = "";
  for (var v = 0; v <= top; v += ticks.step) {
    var gy = PT + ih - (v / top) * ih;
    s += '<line x1="' + PL + '" y1="' + gy + '" x2="' + (W - PR) + '" y2="' + gy +
         '" stroke="var(--grid)" stroke-width="1"/>' +
         '<text x="' + (PL - 9) + '" y="' + (gy + 4) + '" text-anchor="end" font-size="11.5" fill="var(--muted)">' +
         moneyShort(v) + '</text>';
  }
  payouts.forEach(function (p, i) {
    var st = styles[p.company];
    var bx = PL + band * i + (band - bw) / 2, h = (p.bonus / top) * ih, by = PT + ih - h;
    s += '<path d="' + barUp(bx, by, bw, h, 4) + '" fill="' + st.colour + '"/>';
    s += '<text x="' + (bx + bw / 2) + '" y="' + (by - 7) + '" text-anchor="middle" font-size="11" font-weight="700" ' +
         'fill="var(--text-primary)" font-variant-numeric="tabular-nums">' + moneyShort(p.bonus) + '</text>';
    s += '<text x="' + (PL + band * i + band / 2) + '" y="' + (PT + ih + 16) + '" text-anchor="middle" font-size="11" fill="var(--muted)">' +
         (p.extra ? p.m.slice(0, 4) + " †" : monthShort(p.m) + ' ’' + p.m.slice(2, 4)) + '</text>';
    s += '<text x="' + (PL + band * i + band / 2) + '" y="' + (PT + ih + 30) + '" text-anchor="middle" font-size="10.5" fill="var(--text-secondary)">' +
         esc(st.short) + '</text>';
    var tip = '<div class="t-title">' + esc(p.label || monthLabel(p.m)) + ' · ' + esc(st.short) + '</div>' +
      '<div class="t-row"><i class="swatch" style="background:' + st.colour + '"></i>Bonus<b>' + money(p.bonus) + '</b></div>' +
      (p.bonusNotes ? '<div class="t-row muted" style="font-size:12px">' + esc(p.bonusNotes) + '</div>' : '') +
      (p.extra ? '<div class="t-row muted" style="font-size:12px">No payslip on file for this month</div>'
               : '<div class="t-row">Gross that month<b>' + money(p.gross) + '</b></div>');
    s += '<rect class="hit" x="' + (PL + band * i) + '" y="' + PT + '" width="' + band + '" height="' + ih +
         '" data-tip="' + esc(tip) + '"/>';
  });
  s += '<line x1="' + PL + '" y1="' + (PT + ih) + '" x2="' + (W - PR) + '" y2="' + (PT + ih) +
       '" stroke="var(--baseline)" stroke-width="1"/>';

  var seen = {};
  container.innerHTML =
    '<div class="legend">' + payouts.filter(function (p) {
      return seen[p.company] ? false : (seen[p.company] = true);
    }).map(function (p) {
      return '<span><i class="swatch" style="background:' + styles[p.company].colour + '"></i>' +
             esc(styles[p.company].short) + '</span>';
    }).join("") + '</div>' +
    '<div class="chartwrap"><svg class="chart" viewBox="0 0 ' + W + ' ' + H +
    '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Bonus payouts">' + s + '</svg></div>';
  var wrap = container.querySelector(".chartwrap");
  attachTip(wrap, wrap.querySelector("svg"));
}

/* CTC per year from the employer's compensation letters (DATA.salaryCTC).
   Each row: the CTC from that date, its rise on the one before, and the
   performance bonus paid with that revision, measured against the CTC in force
   during the year it rewards (the row above). A thin bar shows the CTC's size. */
function ctcCard(styles, meta) {
  var rows = DATA.salaryCTC || [];
  if (!rows.length) return "";
  var max = Math.max.apply(null, rows.map(function (r) { return r.ctc; }));
  var first = rows[0], last = rows[rows.length - 1];
  var body = rows.map(function (r, i) {
    var prev = i > 0 && rows[i - 1].company === r.company ? rows[i - 1] : null;
    var st = employerStyle(r.company, styles, meta);
    return '<tr><td style="white-space:nowrap">' + esc(r.from) +
        '<div class="muted" style="font-size:12px">' + esc(st.short) + '</div></td>' +
      '<td class="num"><b>' + money(r.ctc) + '</b><div class="muted" style="font-size:12px">' +
        money(r.ctc / 12) + ' a month</div>' +
        '<div style="height:6px;border-radius:3px;margin-top:6px;background:' + st.colour + ';width:' +
          Math.round(r.ctc / max * 100) + '%;margin-left:auto"></div></td>' +
      '<td class="num">' + (prev ? '<b>' + pctLabel(r.ctc / prev.ctc - 1) + '</b><div class="muted" style="font-size:12px">+' +
          money(r.ctc - prev.ctc) + '</div>' : '<span class="muted">joining</span>') + '</td>' +
